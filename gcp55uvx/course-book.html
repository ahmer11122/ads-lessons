<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Solutions · Ads course book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style id="core-css">
/* Smart Solutions · light · design v4
   TYPE    Inter 400/500/600/700. Body 16px (17px on desktop sections), line-height 1.7. h1 fluid 30-46px.
   SPACE   8px grid: 4 8 12 16 24 32 48 64. One reading column (44rem, about 68 characters).
   RADIUS  16 containers, 12 controls, 999 pills. Nothing else.
   COLOR   Ink on white. Lime is a FILL only (dark text on it). ok/bad colours appear only in quiz and sort feedback.
   DEPTH   Hairline borders, no shadows.
   MOTION  One easing, 0.12-0.24s, only in response to a tap. Reveal = fade + 6px rise. All off for reduced-motion.
   RULES   Sentence-case labels (no all-caps). Do not add new colours, radii or shadows.
   BOOK    The course-book layout (.book, .side, .toc, details.chapter) lives in this same block. */
:root{
  --background:#F8F8F6;--surface:#F1F1ED;--card:#FFFFFF;
  --ink:#0D0D0D;--primary:#1A1A1A;--primary-fg:#FFFFFF;
  --muted:#EDEDEA;--muted-fg:#595959;
  --lime:#C4F236;--lime-soft:#F0FBD0;--lime-ink:#0D0D0D;
  --accent:var(--lime);--accent-fg:var(--lime-ink);
  --rule:#C4C4BE;--hair:rgba(13,13,13,.09);--border:var(--rule);
  --ok:#1D7A46;--ok-soft:#E7F5EC;--bad:#B3261E;--bad-soft:#FCECEA;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:var(--background);--line:var(--hair);--mute:var(--muted-fg);--faint:#6B6B6B;--r:16px;--shadow:none;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--background);color:var(--ink);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
a{color:var(--ink);text-decoration:underline;text-decoration-color:#8FB51A;text-decoration-thickness:2px;text-underline-offset:3px}
b,strong{font-weight:700}
[hidden]{display:none!important}
::selection{background:var(--lime)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.l-ur{font-family:"Inter",system-ui,"Noto Naskh Arabic","Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;line-height:1.95}
/* Roman Urdu is Latin text: headings keep their own tight line-height */
h1 .l-ur,h2 .l-ur,h3 .l-ur,h4 .l-ur,.qt .l-ur{line-height:inherit}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:20px 24px;margin:16px 0}
ul.tight{margin:4px 0 0;padding-left:20px}ul.tight li{margin:6px 0}

/* header: logo, counter, language. Progress line sits on the bottom edge */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:44rem;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px;padding:0 20px}
.logo{display:inline-flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:var(--ink)}
.logo svg{width:28px;height:28px;display:block}
.logo b{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.ctr{flex:none;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted-fg);white-space:nowrap}
.ctr strong{color:var(--ink);font-weight:700}
.grow{flex:1;min-width:0}
.progress-track{position:relative;height:2px;width:100%;background:transparent;margin-bottom:-1px}
.progress-fill{height:2px;width:0;background:var(--ink);transition:width .12s linear}
@media(max-width:379px){.logo b{display:none}}
.lang{flex:none;display:inline-flex;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:2px}
.lang button{font-size:12px;font-weight:600;border:0;background:none;color:var(--muted-fg);border-radius:8px;padding:0 12px;min-height:30px;min-width:40px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang.sm button{min-height:28px;padding:0 10px;min-width:34px}

/* page + hero */
.wrap{max-width:44rem;margin:0 auto;padding:0 20px 96px}
@media(min-width:640px){.wrap{padding:0 32px 128px}}
.hero{padding-top:40px}
@media(min-width:640px){.hero{padding-top:72px}}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;line-height:1.4;color:var(--ink);background:var(--lime);border-radius:8px;padding:4px 12px}
h1{margin:20px 0 0;font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-.03em;font-weight:700;color:var(--ink);text-wrap:balance}
.meta{margin-top:16px;font-size:14.5px;color:var(--muted-fg);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.statpill{display:inline-flex;gap:8px;font-size:13px;font-weight:600;color:var(--ink);background:var(--muted);border-radius:8px;padding:3px 12px}
.hero-rule{margin-top:32px;height:1px;background:var(--hair)}
.modebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.mbtn{font-size:13.5px;font-weight:600;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:0 16px;min-height:40px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hname{display:none;justify-content:space-between;gap:16px;font-size:14px;margin-top:20px;color:var(--muted-fg)}

/* sections */
.section{padding-top:48px;margin-top:48px;border-top:1px solid var(--hair)}
@media(min-width:640px){.section{padding-top:64px;margin-top:64px}}
.section.first{border-top:0;margin-top:0;padding-top:40px}
.sec-head{display:flex;align-items:center;gap:12px}
.sec-num{flex:none;display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border-radius:8px;background:var(--lime);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sec-head h3{margin:0;font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.02em;color:var(--ink);min-width:0;text-wrap:balance}
.sec-head h3.sm{font-size:18px}
@media(min-width:640px){.sec-head h3{font-size:26px}.sec-head h3.sm{font-size:20px}}
.sec-head .tail{display:none}
.sec-body{margin-top:20px;font-size:16px;line-height:1.7;color:#1F1F1F}
@media(min-width:640px){.sec-body{font-size:17px;line-height:1.75}}
.sec-body p{margin:0 0 14px}.sec-body>:last-child{margin-bottom:0}
.sec-body ul{margin:12px 0 0;padding-left:22px}.sec-body li{margin:8px 0}
.microlabel{display:block;font-size:13px;font-weight:600;color:var(--muted-fg)}

/* key point, plain words, example */
.keypoint{background:var(--lime-soft);box-shadow:inset 4px 0 0 var(--lime);border-radius:16px;padding:20px 24px;margin-top:32px}
.keypoint p{margin:8px 0 0;font-size:18px;line-height:1.55;font-weight:600;color:var(--ink)}
.keypoint.simple{background:var(--surface);box-shadow:inset 4px 0 0 var(--rule);margin-top:16px}
.keypoint.simple p{font-weight:500;font-size:16.5px}
ol.take{margin:8px 0 0;padding-left:22px;color:var(--ink);font-weight:500}ol.take li{margin:8px 0}
.example{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:20px 24px;margin-top:24px}
.example p{margin:0;font-size:16px;line-height:1.7;color:#1F1F1F}
.priv{display:none!important}
@media(max-width:639px){.card,.example,.keypoint{padding:18px 20px}}

/* breadcrumb click path */
.path{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin-top:12px;max-width:100%}
.crumb{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.crumb .sep{flex:none;width:7px;height:7px;border-top:2px solid #8A8A8A;border-right:2px solid #8A8A8A;transform:rotate(45deg);margin:0 4px 0 0}
.seg{display:inline-block;min-width:0;max-width:100%;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px}
.crumb:last-child .seg{background:var(--lime);border-color:var(--lime)}
.path-label{font-size:13px;font-weight:600;color:var(--muted-fg);margin-top:16px}
.chev{display:inline-block;width:7px;height:7px;border-top:2px solid #8A8A8A;border-right:2px solid #8A8A8A;transform:rotate(45deg);margin:0 8px 1px 4px}

/* tasks: number | text | checkbox */
.tasks{list-style:none;margin:20px 0 0;padding:0;counter-reset:tk}
.tasks>li{counter-increment:tk;border-top:1px solid var(--hair)}
.tasks>li:first-child{border-top:0}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) 24px;gap:12px;align-items:start;padding:16px 0;cursor:pointer}
.task::before{content:counter(tk);width:28px;height:28px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);color:var(--ink);font-size:13px;font-weight:600;display:grid;place-items:center}
.task.done::before{content:"✓";background:var(--lime);border-color:var(--lime);animation:pop .24s var(--ease)}
.task .tx{min-width:0;font-size:16px;line-height:1.55;color:#1F1F1F;padding-top:2px}
.task input{width:22px;height:22px;margin:3px 0 0;accent-color:#1A1A1A}
.task.done .tx>span:first-child{color:var(--muted-fg);text-decoration:line-through}
.note{font-size:13.5px;color:var(--muted-fg);margin-top:8px}

/* ===== teaching visuals ===== */
.vis-wrap{margin-top:20px}
.caption{font-size:13.5px;color:var(--muted-fg);margin-top:12px}
.vhint{font-size:13px;color:var(--muted-fg);margin:0 0 12px}
/* flow: tap a step to trace the path up to it */
.node{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:14px 18px;font-weight:600;font-size:15px;line-height:1.45;color:var(--ink);text-align:left}
.node small{display:block;font-weight:400;color:var(--muted-fg);font-size:13.5px;line-height:1.45;margin-top:4px}
.fc{display:flex;flex-direction:column;align-items:stretch}
.fc .node{cursor:pointer;transition:background .2s,opacity .25s,transform .15s,box-shadow .2s}
.fc .node:hover{transform:translateY(-1px)}
.fc .node:active{transform:scale(.985)}
.fc .node.done{background:var(--lime-soft)}
.fc .node.cur{background:var(--lime);box-shadow:0 0 0 4px var(--lime-soft)}
.fc.tracing .node:not(.done):not(.cur){opacity:.5}
.fc .link{position:relative;align-self:flex-start;margin-left:28px;width:2px;height:28px;background:var(--ink);transition:background .25s}
.fc .link::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--ink);border-bottom:0;transition:border-color .25s}
.fc .link em{position:absolute;left:16px;top:50%;transform:translateY(-50%);white-space:nowrap;font-style:normal;font-size:12.5px;color:var(--muted-fg)}
.fc.tracing .link:not(.done){background:var(--rule)}
.fc.tracing .link:not(.done)::after{border-top-color:var(--rule)}
/* steps: tap to expand */
.stepper{list-style:none;margin:0;padding:0;counter-reset:st}
.stepper>li{counter-increment:st;border:1px solid var(--hair);border-radius:16px;background:var(--card);margin:8px 0;transition:border-color .18s}
.stepper>li:hover{border-color:var(--rule)}
.stepper>li.open{border-color:var(--ink)}
.st-h{display:grid;grid-template-columns:30px minmax(0,1fr) 16px;gap:12px;align-items:center;width:100%;min-height:56px;text-align:left;background:none;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.st-h::before{content:counter(st);width:30px;height:30px;border-radius:6px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;transition:background .18s,color .18s}
.st-h .st-t{font-weight:600;line-height:1.4}
.st-h .pm{width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin-top:-4px;transition:transform .22s var(--ease),margin .22s var(--ease)}
.stepper li.open .st-h .pm{transform:rotate(-135deg);margin-top:4px}
.stepper li.open .st-h::before{background:var(--lime);color:var(--ink)}
.st-b{display:none;padding:0 16px 16px 58px;font-size:15.5px;line-height:1.65;color:#1F1F1F}
.stepper li.open .st-b{display:block;animation:rise .24s var(--ease)}
.stepper.static .st-h{cursor:default}.stepper.static .st-h .pm{display:none}
/* decision tree: connectors are drawn per item; the edge label sits inline, after the line */
.dt{--ind:20px;--off:14px;list-style:none;margin:0;padding:0}
@media(max-width:519px){.dt{--ind:14px;--off:6px}}
.dt ul{list-style:none;margin:0 0 0 var(--off);padding:0 0 0 var(--ind)}
.dt li{position:relative;padding-top:12px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start}
.dt li>.elabel{grid-column:1;grid-row:1;margin:15px 10px 0 0}
.dt li>.dnode{grid-column:2;grid-row:1}
.dt li>ul{grid-column:1/-1}
.dt ul>li::before{content:"";position:absolute;left:calc(-1*var(--ind));top:0;bottom:0;width:2px;background:var(--ink);transform-origin:top}
.dt ul>li:last-child::before{bottom:auto;height:39px}
.dt ul>li::after{content:"";position:absolute;left:calc(-1*var(--ind));top:37px;width:var(--ind);height:2px;background:var(--ink);transform-origin:left}
.elabel{display:inline-block;font-size:12.5px;font-weight:600;line-height:1.4;color:var(--ink);background:var(--lime);border-radius:8px;padding:3px 10px}
.dnode{display:block;width:100%;max-width:480px;text-align:left;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:14px 18px;font-weight:600;font-size:15px;line-height:1.45;cursor:default}
.dnode.q{background:var(--ink);color:#fff}
.dnode.a{position:relative;padding-right:48px;border-style:dashed;cursor:pointer}
.dnode.a::after{content:"+";position:absolute;right:18px;top:12px;font-size:22px;font-weight:400;line-height:1;color:var(--muted-fg);transition:transform .22s var(--ease)}
.dnode.a:hover{background:var(--surface)}
.dnode.a .tapme{display:block;font-size:13px;font-weight:500;color:var(--muted-fg);margin-top:4px}
.dnode .rev{display:none;font-weight:400;font-size:14.5px;line-height:1.55;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);color:#1F1F1F}
.dnode.open,.dnode.open:hover{border-style:solid;background:var(--lime-soft)}
.dnode.open::after{transform:rotate(45deg)}
.dnode.open .rev{display:block;animation:rise .24s var(--ease)}.dnode.open .tapme{display:none}
/* compare table */
.ctable{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;line-height:1.5;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.ctable th,.ctable td{padding:12px 16px;text-align:left;vertical-align:top;border-top:1px solid var(--hair)}
.ctable thead th{border-top:0;font-size:13px;font-weight:700;background:var(--surface)}
.ctable thead th.good{background:var(--lime)}
.ctable tbody th{font-weight:700;width:30%}
@media(max-width:519px){.ctable{font-size:13.5px}.ctable th,.ctable td{padding:10px 12px}}
/* before / after toggle */
.tog .seg2{display:inline-flex;border:1px solid var(--rule);border-radius:8px;padding:2px;background:var(--card);margin-bottom:12px}
.tog .seg2 button{border:0;background:none;border-radius:8px;padding:0 16px;min-height:36px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted-fg)}
.tog .seg2 button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tog .pane{border:1px solid var(--rule);border-radius:16px;padding:16px 20px;background:var(--card);animation:rise .22s var(--ease)}
.tog .pane.after{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--lime)}
.tog .pane ul{margin:0;padding-left:20px}.tog .pane li{margin:6px 0}
.tog .pane .plab{display:none}
/* slider calculator + number line */
.calc{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:20px}
.calc label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.calc label span{float:right;font-variant-numeric:tabular-nums}
.calc input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;cursor:pointer}
.calc input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#E2E2DE}
.calc input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:#E2E2DE}
.calc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:6px;background:var(--lime);border:2px solid var(--ink);transition:transform .12s}
.calc input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:6px;background:var(--lime);border:2px solid var(--ink);transition:transform .12s}
.calc input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.calc input[type=range]:active::-moz-range-thumb{transform:scale(1.15)}
.calc .out{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)}
.calc .out b{font-size:32px;line-height:1.1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.calc .out span{font-size:14px;color:var(--muted-fg)}
.nline{position:relative;height:52px;margin:28px 12px 12px}
.nline .ax{position:absolute;left:0;right:0;top:14px;height:4px;background:#E2E2DE;border-radius:4px}
.nline .band{position:absolute;top:10px;height:12px;background:var(--lime);border-radius:4px}
.nline .mk{position:absolute;top:4px;width:3px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .12s}
.nline .tk{position:absolute;top:32px;white-space:nowrap;line-height:1.4;font-size:12px;color:var(--muted-fg);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.nline .bl{position:absolute;top:-16px;font-size:12px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
/* tap to sort */
.sort .it{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:16px;margin:8px 0}
.sort .it p{margin:0 0 12px;font-weight:600}
.sort .bins{display:flex;flex-wrap:wrap;gap:8px}
.sort .bins button{border:1.5px solid var(--rule);background:var(--background);border-radius:8px;padding:0 16px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer}
.sort .bins button:not([disabled]):hover{border-color:var(--ink)}
.sort .bins button.right{background:var(--ok-soft);border-color:var(--ok);animation:pop .24s var(--ease)}
.sort .bins button.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .3s}
.sort .bins button[disabled]{cursor:default}
.sort .why{display:none;font-size:14.5px;margin-top:12px;color:#1F1F1F}
.sort .it.done .why{display:block;animation:rise .24s var(--ease)}
.sort .tally{font-weight:700;margin-top:12px}
/* annotated screenshot */
.shot{position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--card)}
.shot img{display:block;width:100%;height:auto}
.pin{position:absolute;width:26px;height:26px;border-radius:6px;background:var(--lime);color:var(--ink);border:2px solid var(--ink);font-size:12.5px;font-weight:700;display:grid;place-items:center;transform:translate(-50%,-50%)}
.pins{margin:12px 0 0;padding-left:0;list-style:none}.pins li{display:flex;gap:12px;margin:8px 0;font-size:14.5px}
.pins li b{flex:none;width:24px;height:24px;border-radius:6px;background:var(--lime);display:grid;place-items:center;font-size:12px}
.vis img{max-width:100%;height:auto;border-radius:16px;display:block}

/* mistakes, activity, teacher notes */
.mistakes{list-style:none;margin:16px 0 0;padding:0}
.mistakes li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--hair);font-size:15.5px;line-height:1.55}
.mistakes li:first-child{border-top:0}
.mistakes li::before{content:"✕";width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.activity{box-shadow:inset 4px 0 0 var(--lime)}
.activity ol{margin:12px 0 0;padding-left:22px}.activity li{margin:8px 0}
.key{margin-top:16px;font-size:14.5px;line-height:1.6;padding:14px 16px;border-radius:12px;background:var(--surface)}

077379203657"},{"label":"Meta help: partner access","url":"https://www.facebook.com/business/help/1717412048538897"},{"label":"Meta help: 2FA","url":"https://www.facebook.com/business/help/865384580786591"}],"next":"Tomorrow: who sees your ad.","next_ur":"Kal: aap ka ad kaun dekhta hai.","simple":"Make one safe business folder on Meta. Lock it with 2FA. Never share passwords.","simple_ur":"Meta par business ka ek mehfooz folder banayein. 2FA se lock karein. Password kabhi na dein.","teach":["Clients add you as a partner. No passwords.","2FA on + 2 full-control admins = no lockout."],"mistakes":["Asking a client for his password","Only one admin"],"activity":{"title":"Role-play: add a client safely","minutes":12,"steps":["Pairs: bakery owner and agency","Owner offers a password; agency explains partners"],"answer":"No password. Settings, Users, Partners, Add, paste ID, share Page and ad account."},"kind":"lesson","week":1,"level":1,"level_name":"Level 1 · Foundations + safety","progress":{"done":1,"total":64,"level_left":15},"streak":5,"xp":50},{"n":2,"date":"2026-10-28","minutes":5,"track":"Foundations","title":"When ads stop: payment and account health","title_ur":"Jab ads ruk jayein: payment aur account ki sehat","idea":"Ads stop for 2 reasons: a **failed payment** or a **restricted account** (Meta blocked ads). Find which, then fix.","idea_ur":"Ads 2 wajah se rukte hain: **payment fail** ya **restricted account** (Meta ne ads rok diye). Wajah dhoondein, phir theek karein.","blocks":[{"h":"Payment failed","h_ur":"Payment fail ho gayi","p":"Card fails? Meta **pauses ads** and **disables the ad account** until you pay. Go to **Billing and payments** and pay with a card that works.","p_ur":"Card fail? Meta ads **rok deta hai** aur ad account **band** kar deta hai jab tak aap pay na karein. **Billing and payments** mein chalne wale card se pay karein."},{"h":"Stop it before it happens","h_ur":"Pehle hi rok lein","p":"Meta charges at your **payment threshold** (spend level that takes money) and on bill date. Keep money on the card. Add a **backup card**.","p_ur":"Meta **payment threshold** (itna kharch hone par paise katna) aur bill date par paise kaatta hai. Card mein paise rakhein. **Backup card** lagayein."},{"h":"Account restricted","h_ur":"Account restricted","p":"Open **Account status overview** (account health page). Read the reason. Do what **What you can do** asks: confirm ID, 2FA, or **Request review** (ask Meta to check again).","p_ur":"**Account status overview** (account ki sehat ka page) kholein. Wajah parhein. **What you can do** jo kahe karein: ID, 2FA, ya **Request review** (Meta se dobara check)."},{"h":"Review rules","h_ur":"Review ke usool","p":"Only an **admin** can ask. It takes about 48 hours. Reviews are **limited** and the answer is final. After a fix, turn ads back on yourself.","p_ur":"Sirf **admin** maang sakta hai. Taqreeban 48 ghante. Reviews **ginti ke** hain aur faisla aakhri. Theek hone par ads khud on karein."}],"visual":{"type":"tree","label":"Your ads stopped. What now?","label_ur":"Ads ruk gaye. Ab kya karein?","nodes":[{"id":"r","t":"What does Meta show?","t_ur":"Meta kya dikha raha hai?","kind":"q"},{"id":"pay","t":"Fix the payment","t_ur":"Payment theek karein","kind":"a","reveal":"Billing and payments. Pay with a working card. Add a backup card.","reveal_ur":"Billing and payments. Chalne wale card se pay karein. Backup card lagayein."},{"id":"mis","t":"Was it a mistake by Meta?","t_ur":"Kya Meta ne ghalti ki?","kind":"q"},{"id":"rev","t":"Ask for a review","t_ur":"Review maangein","kind":"a","reveal":"Do every What you can do step. Then Request review. Tries are few.","reveal_ur":"Pehle What you can do ke kaam. Phir Request review. Mauqay kam hain."},{"id":"fix","t":"Fix the cause","t_ur":"Wajah theek karein","kind":"a","reveal":"Read the reason. Fix or delete the ad that broke the rule.","reveal_ur":"Wajah parhein. Ghalat ad theek ya delete karein."}],"edges":[["r","pay",{"t":"Payment failed","t_ur":"Payment fail"}],["r","mis",{"t":"Account restricted","t_ur":"Account restricted"}],["mis","rev",{"t":"Yes","t_ur":"Haan"}],["mis","fix",{"t":"No","t_ur":"Nahi"}]]},"example":{"label":"Example · local bakery","text":"A Sargodha bakery's ads stop on the 1st. Billing shows a failed payment: the card was empty on bill date. Fix: pay now, add a backup card.","text_ur":"Sargodha ki bakery ke ads 1 tareekh ko ruk gaye. Billing mein payment fail: bill date par card khali tha. Hal: abhi pay, backup card lagayein."},"tasks":[{"t":"Open **Account status overview** and read your status (look only)","t_ur":"**Account status overview** khol kar status parhein (sirf dekhein)","path":["Business Support Home","Account status overview"]},{"t":"Check you have a **backup card** added","t_ur":"Check karein **backup card** laga hua hai","path":["Billing and payments","Payment methods"]},{"t":"Ask your bank to allow **online international** payments on your card (rule of thumb)","t_ur":"Bank se card par **online international** payment on karwayein (tajurbe ki baat)"}],"task_minutes":10,"quiz":[{"q":"Your card failed. What happens to your ads?","q_ur":"Card fail ho gaya. Ads ka kya hoga?","options":["They keep running for free","They pause until you pay the amount due","Meta deletes your Page"],"options_ur":["Muft chalte rahenge","Raqam ada karne tak ruk jayenge","Meta Page delete kar dega"],"answer":1,"why":"Meta pauses ads until you pay.","why_ur":"Pay karne tak Meta ads rok deta hai."},{"q":"Who can click Request review?","q_ur":"Request review kaun daba sakta hai?","options":["Any person on the Page","Only an admin","Only the bank"],"options_ur":["Page ka koi bhi shakhs","Sirf admin","Sirf bank"],"answer":1,"why":"Meta says only admins can.","why_ur":"Meta ke mutabiq sirf admin."},{"q":"Why not request a review before fixing anything?","q_ur":"Theek kiye baghair review kyun na maangein?","options":["Reviews are limited and the answer is final","Reviews cost money","Reviews delete the ad account"],"options_ur":["Reviews ginti ke hain aur faisla aakhri hai","Review ke paise lagte hain","Review se ad account delete hota hai"],"answer":0,"why":"Fix first, then use your review.","why_ur":"Pehle theek karein, phir review."}],"terms":[{"t":"Payment threshold","d":"Spend level that triggers a charge.","d_ur":"Itna kharch hone par card se paise katte hain."},{"t":"Account status overview","d":"Meta page showing account problems and fixes.","d_ur":"Account ke masle aur hal dikhane wala page."}],"sources":[{"label":"Meta help: fix a failed payment","url":"https://www.facebook.com/business/help/268196136699959"},{"label":"Meta help: request a review","url":"https://www.facebook.com/business/help/530209463124901"},{"label":"Meta help: disabled or restricted account","url":"https://www.facebook.com/business/help/422289316306981"}],"next":"Tomorrow: Boost vs Ads Manager.","next_ur":"Kal: Boost button ya Ads Manager.","simple":"Ads stopped? Check payment, then account status. Fix first, review later.","simple_ur":"Ads ruk gaye? Pehle payment, phir account status. Pehle theek karein, review baad mein.","teach":["Two causes: failed payment or restricted account.","Fix first, then request a review."],"mistakes":["Requesting review before fixing","Only one card on the account"],"activity":{"title":"Doctor game","minutes":10,"steps":["Teacher reads 3 short cases","Pairs say: payment or restricted, and the first fix"],"answer":"Empty card: pay + backup card. Broken rule: fix the ad; review only if Meta was wrong."},"kind":"lesson","week":1,"level":1,"level_name":"Level 1 · Foundations + safety","progress":{"done":2,"total":64,"level_left":14},"streak":5,"xp":50},{"n":3,"date":"2026-10-28","minutes":5,"track":"Foundations","title":"Pick the right goal: Boost or Ads Manager","title_ur":"Sahi goal chunein: Boost ya Ads Manager","idea":"Meta finds people who do the **objective** (the result you pick). Pick likes, you get likes. Pick leads, you get leads.","idea_ur":"Meta wohi log dhoondta hai jo **objective** (aap ka chuna hua nateeja) karein. Likes chunein to likes, leads chunein to leads.","blocks":[{"h":"Recall: Lesson 1","h_ur":"Yaad karein: Lesson 1","p":"A client wants you to run his ads. What do you ask for? **Not his password.** He adds your portfolio ID as a partner.","p_ur":"Client ads chalwana chahta hai. Aap kya maangein? **Password nahi.** Woh aap ki portfolio ID ko partner banata hai."},{"h":"6 objectives, pick 1","h_ur":"6 objectives, 1 chunein","p":"Awareness, Traffic, Engagement, **Leads**, App, **Sales**. One per campaign. Then pick the **conversion location** (where people act): website, WhatsApp, form.","p_ur":"Awareness, Traffic, Engagement, **Leads**, App, **Sales**. Har campaign mein ek. Phir **conversion location** (jahan log kaam karein): website, WhatsApp, form."},{"h":"Your two setups","h_ur":"Aap ke do setup","p":"Local service wants chats: **Leads** with **WhatsApp**. Shopify COD store wants orders: **Sales** with website, event **Purchase** (order placed).","p_ur":"Local service ko chat chahiye: **Leads** aur **WhatsApp**. Shopify COD store ko order chahiye: **Sales**, website, event **Purchase** (order lag gaya)."},{"h":"Boost vs Ads Manager","h_ur":"Boost ya Ads Manager","p":"**Boost** = ad from a post you already made, few options. OK to show a post to more people. For leads or sales use **Ads Manager**: budgets, many ads and full results live there.","p_ur":"**Boost** = pehle wali post se ad, kam options. Post zyada logon ko dikhani ho to theek. Leads ya sales ke liye **Ads Manager**: budget, kayi ads aur poore nateeje wahin."}],"visuals":[{"type":"steps","label":"3 levels of every ad","label_ur":"Har ad ke 3 level","steps":[{"t":"Campaign: the goal","t_ur":"Campaign: goal","d":"Objective, like Leads. One campaign, one objective.","d_ur":"Objective, jaise Leads. Ek campaign, ek objective."},{"t":"Ad set: who, where, how much","t_ur":"Ad set: kaun, kahan, kitna","d":"Location, budget, schedule, placements (where ads show).","d_ur":"Shehar, budget, waqt, placements (ad kahan dikhe)."},{"t":"Ad: what people see","t_ur":"Ad: log kya dekhein","d":"Video or photo, text, button. Put 3+ different ads here.","d_ur":"Video ya photo, text, button. Yahan 3+ alag ads."}]},{"type":"sort","label":"Boost or Ads Manager?","label_ur":"Boost ya Ads Manager?","bins":["Boost is OK","Ads Manager"],"bins_ur":["Boost theek","Ads Manager"],"items":[{"t":"Show an Eid post to more locals","t_ur":"Eid post zyada logon ko dikhani","bin":0,"why":"Just reach. Boost is fine.","why_ur":"Sirf dikhana hai. Boost theek."},{"t":"Get WhatsApp leads for a service","t_ur":"Service ke liye WhatsApp leads","bin":1,"why":"Leads objective lives in Ads Manager.","why_ur":"Leads objective Ads Manager mein."},{"t":"Get COD orders on a Shopify store","t_ur":"Shopify store par COD orders","bin":1,"why":"Sales + Purchase needs Ads Manager.","why_ur":"Sales + Purchase Ads Manager mein."}]}],"example":{"label":"What would you do? · example dashboard","text":"Made-up numbers. A salon boosted a post for Engagement: 1,400 likes, 2 chats, 0 bookings. Fix: stop boosting. Ads Manager: Leads, WhatsApp, 3 ads.","text_ur":"Farzi numbers. Salon ne Engagement ke liye post boost ki: 1,400 likes, 2 chats, 0 booking. Hal: boost band. Ads Manager: Leads, WhatsApp, 3 ads."},"tasks":[{"t":"Click **Create** and read the 6 objectives (do not publish)","t_ur":"**Create** daba kar 6 objectives parhein (publish na karein)","path":["Ads Manager","Create"]},{"t":"Pick **Leads**, find **WhatsApp** as conversion location, then close","t_ur":"**Leads** chunein, **WhatsApp** conversion location dhoondein, phir band karein"},{"t":"Check your past boosts: which goal did each use?","t_ur":"Purane boosts dekhein: har ek ka goal kya tha?","path":["Ads Manager","Campaigns"]}],"task_minutes":10,"quiz":[{"q":"You want WhatsApp leads. Which objective?","q_ur":"WhatsApp leads chahiye. Kaun sa objective?","options":["Awareness","Leads with WhatsApp","Page likes boost"],"options_ur":["Awareness","Leads aur WhatsApp","Page likes boost"],"answer":1,"why":"Meta finds people likely to message you.","why_ur":"Meta woh log dhoondta hai jo message karein."},{"q":"Where do you pick the budget and location?","q_ur":"Budget aur shehar kahan chunte hain?","options":["Campaign","Ad set","Ad"],"options_ur":["Campaign","Ad set","Ad"],"answer":1,"why":"Ad set = who, where, how much.","why_ur":"Ad set = kaun, kahan, kitna."},{"q":"When is boosting fine?","q_ur":"Boost kab theek hai?","options":["To show a post to more people","To get COD orders","To test 3 ads"],"options_ur":["Post zyada logon ko dikhani","COD orders lene","3 ads test karne"],"answer":0,"why":"Boost is for reach, not leads or sales.","why_ur":"Boost dikhane ke liye, leads ya sales ke liye nahi."}],"terms":[{"t":"Objective","d":"The result you ask Meta for.","d_ur":"Woh nateeja jo aap Meta se maangte hain."},{"t":"Conversion location","d":"Where people take the action.","d_ur":"Jahan log kaam karte hain (WhatsApp, website)."}],"sources":[{"label":"Meta help: choose the right objective","url":"https://www.facebook.com/business/help/1438417719786914"},{"label":"Meta help: boosted posts vs ads","url":"https://www.facebook.com/business/help/317083072148603"},{"label":"Meta help: campaign, ad set, ad","url":"https://www.facebook.com/business/help/621956575422138"},{"label":"Video: Boosting Posts vs Ads Manager (2025 Guide)","url":"https://www.youtube.com/watch?v=mqEpRgzJ5aA"}],"next":"Next: WhatsApp leads, start to end.","next_ur":"Agla: WhatsApp leads, shuru se aakhir.","simple":"Pick the result you want. Meta finds people who do it. Boost for reach, Ads Manager for leads.","simple_ur":"Jo nateeja chahiye chunein. Boost dikhane ke liye, leads Ads Manager mein.","teach":["Objective = who Meta hunts for.","Boost for reach. Leads and sales in Ads Manager."],"mistakes":["Boosting for likes when you want leads","Many objectives in one campaign"],"activity":{"title":"Goal match","minutes":8,"steps":["Teacher reads 4 business goals","Pairs say objective + Boost or Ads Manager"],"answer":"Chats: Leads + WhatsApp. Orders: Sales. Reach: Boost."},"kind":"lesson","week":1,"level":1,"level_name":"Level 1 · Foundations + safety","progress":{"done":3,"total":64,"level_left":13},"streak":5,"xp":50},{"n":4,"date":"2026-10-29","minutes":5,"track":"Foundations","title":"WhatsApp leads, start to end","title_ur":"WhatsApp leads, shuru se aakhir","idea":"The ad only opens the chat. **Your replies** turn a chat into a booked client. Fast, short, with 2-3 questions.","idea_ur":"Ad sirf chat kholta hai. **Aap ke jawab** chat ko booked client banate hain. Jaldi, chhote, 2-3 sawal ke saath.","blocks":[{"h":"Recall: Lesson 1","h_ur":"Yaad karein: Lesson 1","p":"Why keep 2 people with full control of the portfolio? **Backup:** if one loses access, the other can still manage it.","p_ur":"Portfolio mein 2 log full control ke saath kyun? **Backup:** ek ka access chala jaye to doosra sambhal le."},{"h":"Set up once","h_ur":"Ek dafa setup","p":"Use the **WhatsApp Business app** and link it to your Facebook Page. The ad uses the WhatsApp number linked to that Page.","p_ur":"**WhatsApp Business app** lein aur Facebook Page se jorein. Ad wohi WhatsApp number use karta hai jo Page se jura ho."},{"h":"3 free tools in the app","h_ur":"App ke 3 free tools","p":"**Greeting message** (auto hello): goes on the first chat, or after 14 days of no chat. **Quick replies** (saved answers): up to 50, type / to use. **Labels** (chat tags): up to 20, now turning into lists.","p_ur":"**Greeting message** (khud jane wala salam): pehli chat par, ya 14 din baad. **Quick replies** (save kiye jawab): 50 tak, / likh kar. **Labels** (chat ke tag): 20 tak, ab lists ban rahe hain."},{"h":"Qualify in chat","h_ur":"Chat mein parkhein","p":"Ask 2-3 short questions: what service, which area, when. Rule of thumb: reply within minutes. A late reply often means a lost client.","p_ur":"2-3 chhote sawal: kaunsi service, kaunsa ilaqa, kab. Rule of thumb: minutes mein jawab dein. Der se jawab aksar client kho deta hai."}],"visuals":[{"type":"steps","label":"From ad to booked client","label_ur":"Ad se booked client tak","steps":[{"t":"Ad: one clear offer","t_ur":"Ad: ek saaf offer","d":"Button opens WhatsApp.","d_ur":"Button WhatsApp kholta hai."},{"t":"Greeting arrives","t_ur":"Greeting aata hai","d":"Auto hello + first question.","d_ur":"Khud salam + pehla sawal."},{"t":"You reply fast","t_ur":"Aap jaldi jawab dein","d":"Quick replies for price, area, timing.","d_ur":"Qeemat, ilaqa, waqt ke quick replies."},{"t":"Ask 2-3 questions","t_ur":"2-3 sawal poochein","d":"Service, area, when.","d_ur":"Service, ilaqa, kab."},{"t":"Tag the chat","t_ur":"Chat ko tag karein","d":"Booked, follow up, or junk.","d_ur":"Booked, follow up, ya junk."}]},{"type":"sort","label":"Tag these chats","label_ur":"In chats ko tag karein","bins":["Booked","Follow up","Junk"],"bins_ur":["Booked","Follow up","Junk"],"items":[{"t":"Gave area + time, said yes","t_ur":"Ilaqa + waqt bataya, haan kaha","bin":0,"why":"Ready client.","why_ur":"Tayyar client."},{"t":"Asked price, then went quiet","t_ur":"Qeemat poochi, phir chup","bin":1,"why":"Send one reminder next day.","why_ur":"Agle din ek reminder bhejein."},{"t":"Lives in another country","t_ur":"Kisi aur mulk mein hai","bin":2,"why":"Cannot be served.","why_ur":"Service nahi de sakte."}]}],"example":{"label":"What would you do? · example dashboard","text":"Made-up numbers. 40 chats in a week, 3 booked. Owner replied after 5 hours, no questions asked. Fix: greeting on, quick replies, reply in minutes.","text_ur":"Farzi numbers. Hafte mein 40 chats, 3 booked. Malik ne 5 ghante baad jawab diya, koi sawal nahi. Hal: greeting on, quick replies, minutes mein jawab."},"tasks":[{"t":"Turn on a **greeting** with 1 question","t_ur":"Ek sawal wala **greeting** on karein","path":["WhatsApp Business","Tools","Greeting message"]},{"t":"Save 3 **quick replies**: price, area, timing","t_ur":"3 **quick replies** save karein: qeemat, ilaqa, waqt","path":["WhatsApp Business","Tools","Quick replies"]},{"t":"Make 3 labels: Booked, Follow up, Junk","t_ur":"3 labels banayein: Booked, Follow up, Junk","path":["WhatsApp Business","Chats","Labels"]}],"task_minutes":15,"selfcheck":[{"t":"Message your own business from another phone. Do you get the greeting?","t_ur":"Doosre phone se apne business ko message karein. Greeting aaya?"}],"quiz":[{"q":"Which number does a WhatsApp ad use?","q_ur":"WhatsApp ad kaunsa number use karta hai?","options":["Any number you type","The number linked to your Page","Your personal number"],"options_ur":["Jo bhi number likhein","Page se jura number","Aap ka zaati number"],"answer":1,"why":"Meta uses the WhatsApp number linked to the Page.","why_ur":"Meta Page se jura WhatsApp number use karta hai."},{"q":"What is a quick reply?","q_ur":"Quick reply kya hai?","options":["A saved answer you send with /","A paid ad","An auto hello"],"options_ur":["Save jawab jo / se bhejein","Paid ad","Khud jane wala salam"],"answer":0,"why":"Type / in a chat to pick a saved answer.","why_ur":"Chat mein / likh kar save jawab chunein."},{"q":"Many chats, few bookings. Check first?","q_ur":"Chats zyada, booking kam. Pehle kya dekhein?","options":["Raise the budget","How fast and how you reply","Change the city"],"options_ur":["Budget barhayein","Kitni jaldi aur kaise jawab diya","Shehar badlein"],"answer":1,"why":"The ad worked. The chat is losing them.","why_ur":"Ad ne kaam kiya. Chat mein client ja raha hai."}],"terms":[{"t":"Greeting message","d":"Auto hello on a first chat.","d_ur":"Pehli chat par khud jane wala salam."},{"t":"Qualify","d":"Check if a lead can buy.","d_ur":"Dekhna ke lead khareed sakta hai."}],"sources":[{"label":"Meta help: ads that click to WhatsApp","url":"https://www.facebook.com/business/help/447934475640650"},{"label":"WhatsApp help: greeting messages","url":"https://faq.whatsapp.com/501866148528310"},{"label":"WhatsApp help: quick replies","url":"https://faq.whatsapp.com/1791149784551042"},{"label":"Video: Click to Chat Ads on Facebook (Step-by-Step)","url":"https://www.youtube.com/watch?v=PguWnCOp4rk"}],"next":"Next: your ad is your targeting.","next_ur":"Agla: aap ka ad hi aap ki targeting hai.","simple":"Ad opens the chat. Fast replies and 2-3 questions get the booking.","simple_ur":"Ad chat kholta hai. Jaldi jawab aur 2-3 sawal booking laate hain.","teach":["Chats are not clients until you qualify them.","Greeting, quick replies, labels: all free."],"mistakes":["Replying hours later","No questions, only price"],"activity":{"title":"Role play chat","minutes":8,"steps":["One student is the customer","Other replies with greeting + 3 questions"],"answer":"Asked service, area, time; tagged."},"kind":"lesson","week":1,"level":1,"level_name":"Level 1 · Foundations + safety","progress":{"done":4,"total":64,"level_left":12},"streak":5,"xp":50},{"n":5,"date":"2026-10-29","minutes":5,"track":"Creative","title":"Your ad is your targeting","title_ur":"Aap ka ad hi targeting hai","idea":"Meta reads your ad to find buyers. **Truly different ads** reach different people. Keep audience broad.","idea_ur":"Meta aap ka ad parh kar khareedar dhoondta hai. **Waqai mukhtalif ads** mukhtalif logon tak jaate hain. Audience khuli rakhein.","blocks":[{"h":"Recall: Lesson 2","h_ur":"Yaad karein: Lesson 2","p":"Your card payment fails. What happens to your ads? **They stop** until you pay the amount due.","p_ur":"Card payment fail ho gayi. Ads ka kya hota hai? **Ruk jaate hain** jab tak baqi raqam ada na karein."},{"h":"How Meta picks ads","h_ur":"Meta ad kaise chunta hai","p":"**Andromeda** (Meta ka ad chunne wala AI) picks a few thousand ads from tens of millions for each person. Your ad's picture, words and sound tell it who the ad is for.","p_ur":"**Andromeda** (Meta ka ad chunne wala AI) har shakhs ke liye karoron ads mein se kuch hazaar chunta hai. Ad ki tasveer, alfaaz aur awaaz batate hain ke ad kis ke liye hai."},{"h":"So: broad + many places","h_ur":"Is liye: khuli audience + sab jagah","p":"Set city + age, skip interest lists. Keep **Advantage+ placements** (Meta khud jagah chunta hai) on. Rule of thumb: let the ads target.","p_ur":"Shehar + umar set karein, interest lists chhorein. **Advantage+ placements** (Meta khud jagah chunta hai) on rakhein. Rule of thumb: targeting ads karein."},{"h":"What makes ads different","h_ur":"Ads ko mukhtalif kya banata hai","p":"Change the **angle** (khareedne ki wajah), the **person** (kaun bol raha hai) or the **format** (video, photo, carousel). A new colour or word is the same ad to Meta.","p_ur":"**Angle** (khareedne ki wajah), **person** (kaun bol raha hai) ya **format** (video, photo, carousel) badlein. Naya rang ya lafz Meta ke liye wohi ad hai."}],"visuals":[{"type":"steps","label":"Ad Library research in 10 min","label_ur":"10 minute mein Ad Library research","steps":[{"t":"Open Ad Library","t_ur":"Ad Library kholein","d":"Country: Pakistan. All ads.","d_ur":"Mulk: Pakistan. All ads."},{"t":"Search your service","t_ur":"Apni service search karein","d":"e.g. solar, salon, clinic.","d_ur":"Maslan solar, salon, clinic."},{"t":"Find old active ads","t_ur":"Purane chalte ads dhoondein","d":"Check 'Started running on'. Old + active often works.","d_ur":"'Started running on' dekhein. Purana + chalta aksar kaam karta hai."},{"t":"Note the structure","t_ur":"Dhaancha note karein","d":"Hook, angle, offer, CTA.","d_ur":"Hook, angle, offer, CTA."},{"t":"Make your own version","t_ur":"Apna version banayein","d":"Copy the structure, never the content.","d_ur":"Dhaancha lein, content kabhi nahi."}]},{"type":"sort","label":"New ad or same ad?","label_ur":"Naya ad ya wohi ad?","bins":["Truly new","Same to Meta"],"bins_ur":["Waqai naya","Meta ke liye wohi"],"items":[{"t":"Same video, new text colour","t_ur":"Wohi video, text ka naya rang","bin":1,"why":"Looks the same.","why_ur":"Dikhne mein wohi."},{"t":"Happy client talks on video","t_ur":"Khush client video mein bole","bin":0,"why":"New person + proof angle.","why_ur":"Naya shakhs + saboot wala angle."},{"t":"Price offer as a photo","t_ur":"Qeemat offer photo mein","bin":0,"why":"New format + price angle.","why_ur":"Naya format + qeemat angle."}]}],"example":{"label":"What would you do? · example","text":"Made-up numbers. 5 ads, one ad set. One got 92% of spend. All 5 are the same video with new text. Fix: 3 truly different ads.","text_ur":"Farzi numbers. 5 ads, ek ad set. Ek ko 92% kharcha mila. Paanchon wohi video, naya text. Hal: 3 waqai mukhtalif ads."},"tasks":[{"t":"Find 3 **Pakistani local service ads** running 30+ days","t_ur":"30+ din se chalte 3 **Pakistani local service ads** dhoondein","path":["Ad Library","Pakistan","All ads"]},{"t":"Write hook, angle, offer, CTA for each","t_ur":"Har ek ka hook, angle, offer, CTA likhein","path":["Notes"]},{"t":"Plan 3 different ad ideas for your business","t_ur":"Apne business ke 3 mukhtalif ad ideas likhein","path":["Notes"]}],"task_minutes":15,"selfcheck":[{"t":"In Ads Manager, are two of your ads the same video?","t_ur":"Ads Manager mein, kya do ads wohi video hain?"}],"quiz":[{"q":"In 2026, what mostly decides who sees your ad?","q_ur":"2026 mein zyada tar kya tay karta hai ke ad kaun dekhega?","options":["Long interest lists","The ad itself","Ad colour only"],"options_ur":["Lambi interest lists","Ad khud","Sirf ad ka rang"],"answer":1,"why":"Meta's AI reads the ad to match people.","why_ur":"Meta ka AI ad parh kar log milata hai."},{"q":"Which is a truly new ad?","q_ur":"Kaunsa waqai naya ad hai?","options":["Same video, new font","A client talks on video","Same ad, new button"],"options_ur":["Wohi video, naya font","Client video mein bole","Wohi ad, naya button"],"answer":1,"why":"New person and new angle.","why_ur":"Naya shakhs aur naya angle."},{"q":"An ad has run 6 months. What do you take?","q_ur":"Ad 6 mahine se chal raha. Aap kya l  Lesson 3","p":"Where do you set budget and location? In the **ad set** (beech wala level).","p_ur":"Budget aur location kahan set hoti hai? **Ad set** (beech wala level) mein."},{"h":"Hook: first 3 seconds","h_ur":"Hook: pehle 3 second","p":"The **hook** (pehli line ya scene jo scroll roke) shows the problem or result at once. No logo intro. Rule of thumb: decide in 1-3 sec.","p_ur":"**Hook** (pehli line ya scene jo scroll roke) foran masla ya natija dikhaye. Logo intro nahi. Rule of thumb: 1-3 second mein faisla."},{"h":"Fit the phone","h_ur":"Phone ke mutabiq","p":"Meta: use **9:16** (khari full screen video), captions recommended, sound strongly recommended, no licensed music. Keep text out of the **safe zone** edges: top 14%, bottom 35%, sides 6%.","p_ur":"Meta: **9:16** (khari full screen video), captions behtar, awaaz bohat zaroori, licensed music nahi. Text **safe zone** (kinare jahan buttons aate hain) se door: upar 14%, neeche 35%, side 6%."},{"h":"Copy + policy","h_ur":"Copy + policy","p":"Short English + Roman Urdu, a local signal like **'Sargodha'**, one offer, one **CTA** (jaise 'WhatsApp karein'). Never say what the viewer **is**: 'Are you in debt?' breaks policy.","p_ur":"Chhoti English + Roman Urdu, local nishani jaise **'Sargodha'**, ek offer, ek **CTA** (jaise 'WhatsApp karein'). Dekhne wala **kya hai** na kahein: 'Kya aap qarz mein hain?' policy torta hai."}],"visuals":[{"type":"steps","label":"A 15-second ad, step by step","label_ur":"15 second ka ad, qadam ba qadam","steps":[{"t":"0-3 sec: Hook","t_ur":"0-3 sec: Hook","d":"Show the problem or the result.","d_ur":"Masla ya natija dikhayein."},{"t":"3-8 sec: Proof","t_ur":"3-8 sec: Saboot","d":"Real work, real client, real place.","d_ur":"Asal kaam, asal client, asal jagah."},{"t":"8-12 sec: Offer","t_ur":"8-12 sec: Offer","d":"One clear offer, local signal.","d_ur":"Ek saaf offer, local nishani."},{"t":"12-15 sec: CTA","t_ur":"12-15 sec: CTA","d":"One action: 'WhatsApp karein'.","d_ur":"Ek kaam: Kinare buttons aur icons se chhup jaate hain."},{"q":"Which ad line breaks Meta policy?","q_ur":"Kaunsi ad line Meta policy torti hai?","options":["Are you in debt?","Easy monthly plans","Free visit in Sargodha"],"options_ur":["Kya aap qarz mein hain?","Asaan mahana plan","Sargodha mein free visit"],"answer":0,"why":"It says what the viewer is (money trouble).","why_ur":"Yeh batata hai ke dekhne wala kya hai (paison ki mushkil)."}],"terms":[{"t":"Hook","d":"First line or scene that stops the scroll.","d_ur":"Pehli line ya scene jo scroll roke."},{"t":"Safe zone","d":"Middle area not covered by buttons.","d_ur":"Beech ki jagah jo buttons se na chhupe."},{"t":"CTA","d":"The one action you ask for.","d_ur":"Woh ek kaam jo aap kehte hain."}],"sources":[{"label":"Meta Ads Guide: Instagram Reels video specs","url":"https://www.facebook.com/business/ads-guide/update/video/instagram-reels"},{"label":"Meta help: text overlays and safe zones","url":"https://www.facebook.com/business/help/980593475366490"},{"label":"Meta policy: personal attributes","url":"https://transparency.meta.com/policies/ad-standards/objectionable-content/privacy-violations-personal-attributes"},{"label":"Meta help: Advantage+ creative","url":"https://www.facebook.com/business/help/297506218282224"},{"label":"Video: I tested over 1000 ads. Here are the hooks ACTUALLY making MONEY","url":"https://www.youtube.com/watch?v=t-Xf12o4jt4"}],"next":"Next: money math + kill/keep/scale rules.","next_ur":"Agla: paison ka hisaab + kill/keep/scale rules.","simple":"Hook in 3 sec, 9:16, captions, one offer, one CTA.","simple_ur":"3 sec mein hook, 9:16, captions, ek offer, ek CTA.","teach":["Show the problem first, never the logo.","Meta AI text generation adds text options: read each first."],"mistakes":["Logo intro","Text under buttons","3 CTAs in one ad"],"activity":{"title":"Hook battle","minutes":10,"steps":["Each student writes 2 hooks for one local service; class votes the one they would not scroll past"],"answ <script id="core-js">
(function(){
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // inline markup: **bold**; a leftover "A → B" arrow is drawn as a small chevron (build --check warns about it)
  const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\s*(→|-&gt;)\s*/g,'<span class="chev" aria-label="then"></span>');
  const h=(html)=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild};
  const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  // each copy gets its own gradient/clip ids: a hidden copy (e.g. the book sidebar in print) must not blank the others
  let logoN=0;const logo=()=>{const t=document.getElementById("ss-logo");if(!t)return "";const k=++logoN;return t.innerHTML.trim().replace(/(id="|url\(#)([\w-]+)/g,(m,a,b)=>a+b+"-"+k)};

  // ---- bilingual: English + Roman Urdu side by side, one hidden ----
  const L=(en,ur)=>ur==null||ur===""?en:'<span class="l-en">'+en+'</span><span class="l-ur" hidden>'+ur+'</span>';
  const tx=(o,k)=>o==null?"":L(md(o[k]),o[k+"_ur"]!=null?md(o[k+"_ur"]):null);
  const lst=(arr,ur)=>(arr||[]).map((x,i)=>L(md(x),ur&&ur[i]!=null?md(ur[i]):null));
  const UI={guided:["Guided","Step by step"],fullmap:["Full map","Poora naqsha"],reset:["Start over","Dobara shuru karein"],both:["Compare","Muqabla"],play:["Play the path","Rasta chalayein"],cmphint:["Switch views to see what changed","Kya badla, dekhne ke liye view badlein"],tapflow:["Tap a step, or play the path","Kisi step par tap karein, ya rasta chalayein"],
    key:["Key point","Asal baat"],take:["5 things to remember","Yaad rakhne wali 5 baatein"],
    doit:["Do this now","Abhi yeh karein"],note:["Draft only. Don't publish or spend.","Sirf draft. Publish ya paisa kharch na karein."],
    deep:["Go deeper","Mazeed gehrai"],deep2:["Optional · tap to open","Optional · kholne ke liye tap karein"],
    quiz:["Quick test","Chhota sa test"],tap:["Tap an answer","Jawab par tap karein"],mixed:["Mixed review","Mix review"],
    terms:["Key terms","Aham alfaaz"],tapt:["Tap a term","Kisi lafz par tap karein"],cheat:["Cheat sheet","Cheat sheet"],
    src:["Sources","Hawale"],next:["Next up","Agla sabaq"],see:["See it","Dekh kar samjhein"],ex:["Example","Misaal"],
    right:["Correct. ","Sahi jawab! "],wrong:["Not quite. ","Ghalat. "],
    click:["Click path","Click ka rasta"],min:["min","min"],
    self:["Self-check · do it alone","Self-check · khud karein"],selfnote:["Use your own account. Look and check only; change nothing live.","Apna account use karein. Sirf dekhein aur check karein; live kuch na badlein."],
    live:["Live test","Live test"],plan:["Plan","Plan"],measure:["What to measure","Kya naapna hai"],kill:["Kill","Band karein"],keepr:["Keep","Chalne dein"],scale:["Scale","Barhayein"],
    livesafe:["You launch it yourself on your own account, at a budget you choose. Send the numbers back to be graded.","Aap khud apne account par, apni marzi ke budget se launch karein. Numbers wapas bhejein taa ke grade ho sakein."],
    simple:["In plain words","Aasan alfaaz mein"],mist:["Common beginner mistakes","Naye logon ki aam ghaltiyan"],
    act:["Class activity","Class activity"],tkey:["Teacher key","Teacher key"],tnotes:["Teacher notes · not shown to students","Teacher notes · students ko nahi dikhte"],
    say:["Say this (talking points)","Yeh samjhayein"],ask:["Ask the class","Class se poochein"],talk:["Talk about it","Is par baat karein"],
    tapstep:["Tap a step to open it","Step kholne ke liye tap karein"],tapnode:["Answer each question to find your fix, or open Full map to see every branch","Har sawal ka jawab dein aur apna hal dhoondein, ya Full map kholein"],
    tapans:["Tap to see what to do","Kya karna hai, tap karein"],slide:["Move the sliders","Sliders ko move karein"],
    sorthint:["Tap where each one belongs","Har ek ko sahi jagah tap karein"],before:["Before","Pehle"],after:["After","Baad mein"]
  };
  const U=k=>L(UI[k][0],UI[k][1]);
  const getLang=()=>store.get("at-lang")==="ur"?"ur":"en";
  function applyLang(scope,lang){
    scope.querySelectorAll(".l-en").forEach(e=>e.hidden=lang!=="en");
    scope.querySelectorAll(".l-ur").forEach(e=>e.hidden=lang!=="ur");
    scope.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
    if(scope.classList&&scope.classList.contains("q"))scope.dataset.lang=lang;
    scope.querySelectorAll(".q").forEach(q=>q.dataset.lang=lang);
  }
  const langToggle=(cls,scope)=>'<div class="lang'+(cls?" "+cls:"")+'" role="group" aria-label="Language" data-scope="'+scope+'"><button type="button" data-l="en" aria-pressed="true" title="English">EN</button><button type="button" data-l="ur" aria-pressed="false" title="Roman Urdu">UR</button></div>';

  // ---- teaching visuals (picked by visual.type) ----
  const nodeHTML=o=>{o=typeof o==="string"?{t:o}:o;return '<div class="node">'+tx(o,"t")+(o.sub?'<small>'+tx(o,"sub")+'</small>':"")+'</div>'};
  function pathHTML(p){
    if(!p||!p.length)return "";
    return '<div class="path">'+p.map((s,i)=>{s=typeof s==="string"?{t:s}:s;return '<span class="crumb">'+(i?'<span class="sep" aria-hidden="true"></span>':"")+'<span class="seg">'+tx(s,"t")+'</span></span>'}).join("")+'</div>';
  }
  // (a) numbered steps, tap to expand ("d" = detail shown on tap)
  function stepsHTML(steps,interactive){
    return '<ol class="stepper'+(interactive?"":" static")+'">'+steps.map(s=>{s=typeof s==="string"?{t:s}:s;const body=(s.d?'<div>'+tx(s,"d")+'</div>':s.sub?'<div>'+tx(s,"sub")+'</div>':"")+(s.path?pathHTML(s.path):"");
      return '<li'+(interactive?"":' class="open"')+'><button type="button" class="st-h" aria-expanded="'+(!interactive)+'"><span class="st-t">'+tx(s,"t")+'</span><span class="pm" aria-hidden="true"></span></button>'+(body?'<div class="st-b">'+body+'</div>':"")+'</li>'}).join("")+'</ol>';
  }
  // (b) decision tree: nodes {id,t,kind:"q"|"a",reveal}, edges [from,to,label]
  function treeHTML(v){
    const nodes={},kids={},hp={};let c=0;const seen={};
    (v.nodes||[]).forEach(n=>nodes[n.id]=n);
    (v.edges||[]).forEach(e=>{const [x,y,l]=Array.isArray(e)?e:[e.from,e.to,e.label];(kids[x]=kids[x]||[]).push({id:y,label:l});hp[y]=1});
    const lb=l=>typeof l==="string"?md(l):tx(l,"t");
    const li=(id,lab,gated)=>{
      if(seen[id]||!nodes[id])return "";seen[id]=1;
      const n=nodes[id],k=kids[id]||[];
      const ans=k.length>1?'<span class="dt-ans" role="group">'+k.map((x,i)=>'<button type="button" data-k="'+i+'" aria-pressed="false">'+lb(x.label)+'</button>').join("")+'</span>':"";
      const box=n.reveal
        ?'<button type="button" class="dt-box is-a" aria-expanded="false"><span class="dt-t">'+tx(n,"t")+'</span><span class="dt-sub dt-tap">'+U("tapans")+'</span><span class="dt-plus" aria-hidden="true"></span><span class="dt-rev"><span>'+tx(n,"reveal")+'</span></span></button>'
        :'<div class="dt-box is-q"><span class="dt-t">'+tx(n,"t")+'</span>'+(n.sub?'<span class="dt-sub">'+tx(n,"sub")+'</span>':"")+ans+'</div>';
      return '<li class="dt-n" style="--i:'+(c++)+'"'+(gated?' data-gated':'')+'>'+(lab?'<span class="dt-edge">'+lb(lab)+'</span>':"")+box+(k.length?'<ul class="dt-kids">'+k.map(x=>li(x.id,x.label,k.length>1)).join("")+'</ul>':"")+'</li>';
    };
    const bar='<div class="dt-bar noprint"><div class="seg2" style="--n:2;--k:0" role="group"><button type="button" data-m="guided" aria-pressed="true">'+U("guided")+'</button><button type="button" data-m="map" aria-pressed="false">'+U("fullmap")+'</button></div><button type="button" class="dt-reset" hidden>'+U("reset")+'</button></div>';
    return '<div class="dt-wrap">'+bar+'<ul class="dtree guided">'+(v.nodes||[]).filter(n=>!hp[n.id]).map(r=>li(r.id)).join("")+'</ul></div>';
  }
  function flowHTML(v){
    const steps=v.steps||v.nodes||[];
    const bar='<div class="fl-bar noprint"><button type="button" class="fl-play" aria-pressed="false">'+U("play")+'</button><span class="fl-count" aria-live="polite"></span></div>';
    return '<div class="fl-wrap">'+bar+'<ol class="fl">'+steps.map((s,i)=>{s=typeof s==="string"?{t:s}:s;
      return '<li class="fl-s" style="--i:'+i+'">'+(i&&s.via?'<em class="fl-via">'+md(s.via)+'</em>':"")+'<button type="button" class="fl-box" aria-pressed="false"><span class="fl-n">'+(i+1)+'</span><span><span class="fl-t">'+tx(s,"t")+'</span>'+(s.sub?'<span class="fl-sub">'+tx(s,"sub")+'</span>':"")+'</span></button></li>'}).join("")+'</ol></div>';
  }
  // labelled compare table: cols [corner, A, B], rows [[label, a, b], ...]; "good" = index of the better column
  function tableHTML(v){
    const cols=v.cols||["",(v.left||{}).title,(v.right||{}).title];
    let rows=v.rows;
    if(!rows&&v.left){const n=Math.max(v.left.items.length,v.right.items.length);rows=[];for(let i=0;i<n;i++)rows.push(["",v.left.items[i]||"",v.right.items[i]||""])}
    const good=v.good!=null?v.good:2;const hasLab=rows.some(r=>r[0]);
    return '<table class="ctable"><thead><tr>'+cols.map((c,i)=>(i||hasLab)?'<th'+(i===good?' class="good"':"")+'>'+L(md(c),v.cols_ur?md(v.cols_ur[i]):null)+'</th>':"").join("")+'</tr></thead><tbody>'+
      rows.map((r,ri)=>'<tr>'+r.map((c,i)=>(i||hasLab)?(i===0?'<th scope="row">':'<td>')+L(md(c),v.rows_ur?md(v.rows_ur[ri][i]):null)+(i===0?'</th>':'</td>'):"").join("")+'</tr>').join("")+'</tbody></table>';
  }
  // before/after compare: paired rows, switch Old / Compare / New
  function toggleHTML(v){
    const A=v.before,B=v.after,a=lst(A.items||[A.text],A.items_ur),b=lst(B.items||[B.text],B.items_ur);
    const lab=(p,k)=>p.label?tx(p,"label"):U(k);let rows="";
    for(let i=0;i<Math.max(a.length,b.length);i++)rows+='<li style="--i:'+i+'"><span class="c-old"><b class="c-l">'+lab(A,"before")+'</b><span class="c-t">'+(a[i]||"")+'</span></span><i class="c-ar" aria-hidden="true"></i><span class="c-new"><b class="c-l">'+lab(B,"after")+'</b><span class="c-t">'+(b[i]||"")+'</span></span></li>';
    return '<div class="cmpw" data-v="before"><div class="seg2" style="--n:3;--k:0" role="group"><button type="button" data-v="before" aria-pressed="true">'+lab(A,"before")+'</button><button type="button" data-v="both" aria-pressed="false">'+U("both")+'</button><button type="button" data-v="after" aria-pressed="false">'+lab(B,"after")+'</button></div><ul class="cmp">'+rows+'</ul></div>';
  }
  // (c) slider calculator: fixed formula library (no eval)
  const FORMULAS={
    hook_rate:{f:x=>x.impressions?100*x.plays/x.impressions:0,unit:"%",dp:1},
    hold_rate:{f:x=>x.plays?100*x.thruplays/x.plays:0,unit:"%",dp:1},
    breakeven_roas:{f:x=>x.price>x.cost?x.price/(x.price-x.cost):0,unit:"x",dp:2},
    cpa:{f:x=>x.results?x.spend/x.results:0,unit:"",dp:0},
    ctr:{f:x=>x.impressions?100*x.clicks/x.impressions:0,unit:"%",dp:2}
  };
  function calcHTML(v){
    const F=FORMULAS[v.formula]||{f:()=>0,unit:""};const sc=v.scale||{min:0,max:100};
    const pct=x=>Math.max(0,Math.min(100,100*(x-sc.min)/(sc.max-sc.min)));
    const ticks=(sc.ticks||[sc.min,sc.max]).map(t=>'<span class="tk" style="left:'+pct(t)+'%">'+esc(t)+(F.unit==="%"?"%":"")+'</span>').join("");
    const band=v.band?'<span class="band" style="left:'+pct(v.band.from)+'%;width:'+(pct(v.band.to)-pct(v.band.from))+'%"></span><span class="bl" style="left:'+((pct(v.band.from)+pct(v.band.to))/2)+'%">'+tx(v.band,"label")+'</span>':"";
    return '<div class="calc" data-formula="'+esc(v.formula)+'">'+(v.inputs||[]).map(i=>'<label>'+tx(i,"label")+' <span data-show="'+esc(i.id)+'"></span><input type="range" data-id="'+esc(i.id)+'" min="'+i.min+'" max="'+i.max+'" step="'+(i.step||1)+'" value="'+i.value+'" aria-label="'+esc(i.label)+'"></label>').join("")+
      '<div class="out"><b data-out></b><span>'+tx(v,"result")+'</span></div>'+(v.scale?'<div class="nline"><span class="ax"></span>'+band+ticks+'<span class="mk"></span></div>':"")+
      (v.verdicts?'<div class="note" data-verdict></div>':"")+'</div>';
  }
  // (c) tap-to-sort: bins [..], items [{t, bin, why}]
  function sortHTML(v){
    return '<div class="sort">'+(v.items||[]).map((it,i)=>'<div class="it" data-bin="'+it.bin+'"><p>'+tx(it,"t")+'</p><div class="bins">'+
      (v.bins||[]).map((b,bi)=>'<button type="button" data-b="'+bi+'"'+(bi===it.bin?' class="ans"':"")+'>'+L(md(b),v.bins_ur?md(v.bins_ur[bi]):null)+'</button>').join("")+'</div>'+(it.why?'<div class="why">'+tx(it,"why")+'</div>':"")+'</div>').join("")+'<div class="tally" aria-live="polite"></div></div>';
  }
  // (d) annotated real screenshot: only rendered when build.py embedded a real file (data URI)
  function shotHTML(v){
    const src=v.data||(String(v.src||"").startsWith("data:")?v.src:null);if(!src)return "";
    return '<figure class="shot" style="margin:0"><img src="'+esc(src)+'" alt="'+esc(v.alt||"")+'">'+(v.marks||[]).map((m,i)=>'<span class="pin" style="left:'+(+m.x)+'%;top:'+(+m.y)+'%">'+(i+1)+'</span>').join("")+'</figure>'+
      ((v.marks||[]).length?'<ol class="pins">'+v.marks.map((m,i)=>'<li><b>'+(i+1)+'</b><span>'+tx(m,"label")+'</span></li>').join("")+'</ol>':"");
  }
  const HINT={flow:"tapflow",toggle:"cmphint",steps:"tapstep",tree:"tapnode",calc:"slide",sort:"sorthint"};
  function visualInner(v){
    switch(v.type){
      case "steps":return stepsHTML(v.steps||[],true);
      case "tree":return treeHTML(v);
      case "flow":return flowHTML(v);
      case "path":return pathHTML(v.path);
      case "table":case "compare":return tableHTML(v);
      case "toggle":return toggleHTML(v);

      case "sort":return sortHTML(v);
      case "shot":return shotHTML(v);
      case "img":return (v.data||v.src)?'<div class="vis"><img loading="lazy" src="'+esc(v.data||v.src)+'" alt="'+esc(v.alt||v.caption||"")+'"></div>':"";
    }

  }
  function visual(v){

      '<div class="vis-wrap">'+(HINT[v.type]?'<p class="vhint noprint">'+U(HINT[v.type])+'</p>':"")+inner+'</div>'+(v.caption?'<div class="caption">'+tx(v,"caption")+'</div>':"")+'</section>';

  function quizHTML(qs,uid,isRecap){
    if(!qs||!qs.length)return "";
    return '<section class="section" data-quiz data-uid="'+uid+'" data-total="'+qs.length+'">'+secHead("Q",isRecap?U("mixed"):U("quiz"))+

      qs.map((q,qi)=>{
        const hasUr=q.q_ur!=null;const im=q.image||null;const src=im&&(im.data||(String(im.src||"").startsWith("data:")?im.src:null));
        return '<div class="q" data-a="'+q.answer+'"><div class="q-top"><span class="qn">'+L("Question "+(qi+1),"Sawal "+(qi+1))+'</span>'+(hasUr?langToggle("sm","q"):"")+'</div>'+

        '<div class="why"><b class="verdict"></b>'+tx(q,"why")+'</div></div>'}).join("")+

  function secHead(num,inner,small){return '<div class="sec-head"><span class="sec-num">'+num+'</span><h3'+(small?' class="sm"':"")+'>'+inner+'</h3><span class="tail"></span></div>'}

  // ---- modes: "teacher" (default: everything + teacher notes) / "student" (clean handout) ----
  function getMode(){let m=null;try{m=new URLSearchParams(location.search).get("mode")}catch(e){}
    if(m==="student"||m==="teacher"){store.set("at-mode",m);return m}return store.get("at-mode")==="student"?"student":"teacher"}
  function modeLink(m){return location.pathname.split("/").pop()+"?mode="+m+location.hash}
  function modeBar(mode,locked){
    if(locked)return '<div class="modebar noprint"><span class="mbtn on">Student handout</span><button type="button" class="mbtn" onclick="window.print()">Save PDF</button></div>';
    return '<div class="modebar noprint"><a class="mbtn'+(mode==="teacher"?" on":"")+'" href="'+esc(modeLink("teacher"))+'">Teacher</a><a class="mbtn'+(mode==="student"?" on":"")+'" href="'+esc(modeLink("student"))+'">Student</a><button type="button" class="mbtn" onclick="window.print()">Save PDF</button></div>';
  }
  const PRIV='<span class="priv">Private · hidden for students</span>';

  function render(d,opts){
    opts=opts||{};
    const mode=opts.mode==="student"?"student":"teacher",S=mode==="student",T=!S;
    const keep=x=>!(S&&x&&typeof x==="object"&&x.private);
    const tag=x=>(T&&x&&typeof x==="object"&&x.private)?PRIV:"";
    const isRecap=d.kind==="recap";
    const uid=(d.kind||"lesson")+"-"+(isRecap?d.week:d.n||0);
    const cp=d.progress||{};
    let head="";
    if(!opts.chapter){
      head='<header class="topbar"><div class="in"><span class="logo" aria-label="Smart Solutions">'+logo()+'<b>Smart Solutions</b></span>'+
        '<span class="ctr">'+(isRecap?'Week <strong>'+esc(d.week)+'</strong> recap':'Lesson <strong>'+String(d.n).padStart(2,"0")+'</strong> / '+String(cp.total||64))+'</span>'+
        '<span class="grow"></span>'+langToggle("","page")+'</div></header><div class="progress-track"><div class="progress-fill" data-scrollfill></div></div>';
    }
    const body=[];
    if(!opts.chapter){
      body.push('<div class="hero"><span class="eyebrow">'+esc(isRecap?"Week "+d.week+" recap":(d.level_name||d.track||"Lesson"))+'</span><h1>'+tx(d,"title")+'</h1><div class="meta">'+
        (d.minutes?'<span>'+esc(d.minutes)+' min read</span>':"")+(T&&d.date?'<span>'+esc(d.date)+'</span>':"")+
        (T&&(d.streak!=null||d.xp!=null)?'<span class="statpill">'+(d.streak!=null?'<span>Streak '+esc(d.streak)+'</span>':"")+(d.xp!=null?'<span>'+esc(d.xp)+' XP</span>':"")+'</span>':"")+
        (S?'<span>Student handout</span>':"")+'</div>'+modeBar(mode,opts.locked)+
        '<div class="hname"><span>Name: ______________________</span><span>Date: ____________</span></div><div class="hero-rule"></div></div>');
    }
    if(d.idea)body.push('<aside class="keypoint"><span class="microlabel">'+U("key")+'</span><p>'+tx(d,"idea")+'</p></aside>');
    if(d.simple)body.push('<aside class="keypoint simple"><span class="microlabel">'+U("simple")+'</span><p>'+tx(d,"simple")+'</p></aside>');
    if(isRecap&&d.takeaways)body.push('<aside class="keypoint"><span class="microlabel">'+U("take")+'</span><ol class="take">'+lst(d.takeaways,d.takeaways_ur).map(x=>'<li>'+x+'</li>').join("")+'</ol></aside>');
    (d.blocks||[]).filter(keep).forEach((b,i)=>body.push('<section class="section'+(i===0?" first":"")+'">'+secHead(String(i+1).padStart(2,"0"),tx(b,"h")+tag(b))+
      '<div class="sec-body">'+(b.p?'<p style="margin:0">'+tx(b,"p")+'</p>':"")+
      (b.bullets?'<ul>'+lst(b.bullets,b.bullets_ur).map(x=>'<li>'+x+'</li>').join("")+'</ul>':"")+
      (b.visual?'<div class="vis-wrap">'+visualInner(b.visual)+'</div>'+(b.visual.caption?'<div class="caption">'+tx(b.visual,"caption")+'</div>':""):"")+'</div></section>'));
    (Array.isArray(d.visuals)?d.visuals:[d.visual]).forEach(v=>body.push(visual(v)));
    let ex=d.example;
    if(ex&&S&&ex.private)ex=ex.generic||null;
    if(ex){
      const e=ex;
      body.push('<section class="section">'+secHead("Ex",(e.label?tx(e,"label"):U("ex"))+tag(e),true)+
        '<div class="example">'+(e.title?'<h3 style="margin:0 0 6px;font-size:17px">'+tx(e,"title")+'</h3>':"")+'<p>'+tx(e,"text")+'</p>'+
        (T&&e.private&&e.generic?'<p class="note" style="margin-top:12px">Students see instead: '+tx(e.generic,"text")+'</p>':"")+
        (e.path?'<div class="path-label">'+(e.path_label?tx(e,"path_label"):U("click"))+'</div>'+pathHTML(e.path):"")+
        (e.steps?'<div style="margin-top:14px">'+stepsHTML(e.steps,false)+'</div>':"")+'</div></section>');
    }
    if(d.mistakes&&d.mistakes.length)body.push('<section class="section">'+secHead("!",U("mist"),true)+'<ul class="mistakes">'+lst(d.mistakes,d.mistakes_ur).map(x=>'<li><span>'+x+'</span></li>').join("")+'</ul></section>');
    if(T&&d.tasks&&d.tasks.length){
      body.push('<section class="section" data-tasks>'+secHead("Do",U("doit")+(d.task_minutes?' · '+esc(d.task_minutes)+' '+U("min"):""),true)+
        '<ol class="tasks">'+d.tasks.map((t,i)=>{const o=typeof t==="string"?{t:t,t_ur:d.tasks_ur?d.tasks_ur[i]:null}:t;
          return '<li><label class="task"><span class="tx"><span>'+tx(o,"t")+tag(o)+'</span>'+(o.path?pathHTML(o.path):"")+'</span><input type="checkbox" data-i="'+i+'" aria-label="Done"></label></li>'}).join("")+
        '</ol><div class="note">'+(d.task_note?tx(d,"task_note"):U("note"))+'</div></section>');
    }
    const sc=(d.selfcheck||[]).filter(keep);
    if(sc.length)body.push('<section class="section" data-tasks data-key="self">'+secHead("Me",U("self"),true)+
      '<div class="selfcheck"><ol class="tasks">'+sc.map((t,i)=>{const o=typeof t==="string"?{t:t}:t;
        return '<li><label class="task"><span class="tx"><span>'+tx(o,"t")+tag(o)+'</span>'+(o.path?pathHTML(o.path):"")+'</span><input type="checkbox" data-i="'+i+'" aria-label="Done"></label></li>'}).join("")+
      '</ol></div><div class="note">'+U("selfnote")+'</div></section>');
    const lt=d.livetest;
    if(lt&&keep(lt))body.push('<section class="section lt">'+secHead("Live",U("live")+(lt.title?': '+tx(lt,"title"):"")+tag(lt),true)+
      (lt.plan?'<h4>'+U("plan")+'</h4><ol>'+lst(lt.plan,lt.plan_ur).map(x=>'<li>'+x+'</li>').join("")+'</ol>':"")+
      (lt.measure?'<h4>'+U("measure")+'</h4><ul>'+lst(lt.measure,lt.measure_ur).map(x=>'<li>'+x+'</li>').join("")+'</ul>':"")+
      ((lt.kill||lt.keep||lt.scale)?'<div class="rules">'+[["kill","kill"],["keep","keepr"],["scale","scale"]].filter(r=>lt[r[0]]).map(r=>'<div class="rule '+r[0]+'"><b>'+U(r[1])+'</b><div>'+tx(lt,r[0])+'</div></div>').join("")+'</div>':"")+
      '<p class="safe">'+U("livesafe")+'</p></section>');
    const act=d.activity;
    if(act)body.push('<section class="section">'+secHead("Act",U("act")+(act.minutes?' · '+esc(act.minutes)+' '+U("min"):""),true)+
      '<div class="example activity"><h3 style="margin:0 0 6px;font-size:17px">'+tx(act,"title")+'</h3>'+
      '<ol>'+lst(act.steps,act.steps_ur).map(x=>'<li>'+x+'</li>').join("")+'</ol>'+
      (T&&act.answer?'<div class="key"><b>'+U("tkey")+':</b> '+tx(act,"answer")+'</div>':"")+'</div></section>');
    const deep=(d.deep||[]).filter(keep);
    if(deep.length){
      body.push('<section class="section">'+secHead("+",U("deep"),true)+
        '<details class="deep" style="margin-top:14px"><summary>'+U("deep2")+'</summary><div class="body">'+
        deep.map(x=>(x.h?'<h4>'+tx(x,"h")+tag(x)+'</h4>':"")+'<p>'+tx(x,"p")+'</p>'+(x.visual?visualInner(x.visual):"")).join("")+'</div></details></section>');
    }
    body.push(quizHTML(d.quiz,uid,isRecap));
    if(T&&((d.teach&&d.teach.length)||(d.discuss&&d.discuss.length)))
      body.push('<section class="section">'+secHead("T",U("tnotes"),true)+'<div class="tnotes">'+
        (d.teach&&d.teach.length?'<h4>'+U("say")+'</h4><ol class="take">'+lst(d.teach,d.teach_ur).map(x=>'<li>'+x+'</li>').join("")+'</ol>':"")+
        (d.discuss&&d.discuss.length?'<h4>'+U("ask")+'</h4><ul class="tight">'+lst(d.discuss,d.discuss_ur).map(x=>'<li>'+x+'</li>').join("")+'</ul>':"")+'</div></section>');
    if(S&&d.discuss&&d.discuss.length)body.push('<section class="section">'+secHead("?",U("talk"),true)+'<div class="sec-body"><ul>'+lst(d.discuss,d.discuss_ur).map(x=>'<li>'+x+'</li>').join("")+'</ul></div></section>');
    if(d.terms&&d.terms.length){
      const gl='<div class="glossary">'+d.terms.map(t=>'<div><b>'+esc(t.t)+'</b> · '+tx(t,"d")+'</div>').join("")+'</div>';
      if(isRecap)body.push('<section class="section">'+secHead("Aa",U("cheat"),true)+gl+'</section>');
      else body.push('<section class="section" data-terms>'+secHead("Aa",U("terms"),true)+
          '<span class="microlabel noprint" style="margin-top:12px">'+U("tapt")+'</span><div class="chips noprint">'+
          d.terms.map((t,i)=>'<button type="button" class="chip" data-i="'+i+'">'+esc(t.t)+'</button>').join("")+'</div><div class="def noprint"></div><div class="printonly">'+gl+'</div></section>');
    }
    if(d.sources&&d.sources.length)body.push('<section class="section">'+secHead("Src",U("src"),true)+
      '<ul class="src">'+d.sources.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a></li>').join("")+'</ul></section>');

    const root=h('<div class="mode-'+mode+'">'+head+'<main class="'+(opts.chapter?"":"wrap")+'">'+body.join("")+'</main></div>');
    wire(root,d,uid,mode);
