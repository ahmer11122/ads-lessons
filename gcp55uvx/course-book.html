  }

  function wire(root,d,uid,mode){
    root.querySelectorAll(".lang").forEach(g=>g.addEventListener("click",ev=>{
      const b=ev.target.closest("button");if(!b)return;const l=b.dataset.l;
      if(g.dataset.scope==="page"){store.set("at-lang",l);applyLang(document,l)}else applyLang(g.closest(".q"),l);
    }));
    root.querySelectorAll("[data-tasks]").forEach(sec=>{
      const key="at-tasks-"+uid+(sec.dataset.key?"-"+sec.dataset.key:"");const saved=store.get(key)||{};
      sec.querySelectorAll("input").forEach(cb=>{
        const i=cb.dataset.i;cb.checked=!!saved[i];cb.closest(".task").classList.toggle("done",cb.checked);
        cb.addEventListener("change",()=>{saved[i]=cb.checked;store.set(key,saved);cb.closest(".task").classList.toggle("done",cb.checked)});
      });
    });
    // (a) steps
    root.querySelectorAll(".stepper:not(.static) .st-h").forEach(b=>b.addEventListener("click",()=>{const li=b.parentElement;const o=li.classList.toggle("open");b.setAttribute("aria-expanded",String(o))}));
    // (b) tree answers
    root.querySelectorAll(".dnode.a").forEach(b=>b.addEventListener("click",()=>{const o=b.classList.toggle("open");b.setAttribute("aria-expanded",String(o))}));
    // (c) toggle
    root.querySelectorAll(".tog").forEach(t=>t.querySelectorAll(".seg2 button").forEach(b=>b.addEventListener("click",()=>{
      t.querySelectorAll(".seg2 button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      t.querySelectorAll(".pane").forEach(p=>p.hidden=!p.classList.contains(b.dataset.p));
    })));
    // (c) calculator
    root.querySelectorAll(".calc").forEach(c=>{
      const F=FORMULAS[c.dataset.formula];if(!F)return;
      const v=(d.visuals||[d.visual]).concat((d.blocks||[]).map(b=>b.visual)).find(x=>x&&x.type==="calc"&&x.formula===c.dataset.formula)||{};
      const sc=v.scale||{min:0,max:100};const fmt=n=>Number(n).toLocaleString("en-US");
      const upd=()=>{const x={};c.querySelectorAll("input").forEach(i=>{x[i.dataset.id]=+i.value;const s=c.querySelector('[data-show="'+i.dataset.id+'"]');if(s)s.textContent=fmt(i.value)});
        const r=F.f(x);c.querySelector("[data-out]").textContent=(F.unit===""?fmt(Math.round(r)):r.toFixed(F.dp))+(F.unit==="x"?"x":F.unit);
        const mk=c.querySelector(".mk");if(mk)mk.style.left=Math.max(0,Math.min(100,100*(r-sc.min)/(sc.max-sc.min)))+"%";
        const vd=c.querySelector("[data-verdict]");if(vd&&v.verdicts){const hit=v.verdicts.find(w=>r<w.below)||v.verdicts[v.verdicts.length-1];vd.innerHTML=tx(hit,"t");applyLang(vd,getLang())}};
      c.querySelectorAll("input").forEach(i=>i.addEventListener("input",upd));upd();
    });
    // (c) sort
    root.querySelectorAll(".sort").forEach(s=>{let done=0,right=0;const items=s.querySelectorAll(".it");
      items.forEach(it=>it.querySelectorAll(".bins button").forEach(b=>b.addEventListener("click",()=>{
        const ok=+b.dataset.b===+it.dataset.bin;it.querySelectorAll(".bins button").forEach(x=>{x.disabled=true;if(+x.dataset.b===+it.dataset.bin)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");else right++;it.classList.add("done");done++;
        if(done===items.length){const t=s.querySelector(".tally");t.innerHTML=L(right+"/"+items.length+" sorted right",right+"/"+items.length+" sahi");applyLang(t,getLang())}
      })))});
    // quiz
    root.querySelectorAll("[data-quiz]").forEach(sec=>{
      const total=+sec.dataset.total;let answered=0,right=0;const missed=[];
      sec.querySelectorAll(".q").forEach((q,qi)=>{
        const a=+q.dataset.a;
        q.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
          const i=+b.dataset.i;q.querySelectorAll(".opt").forEach(x=>x.disabled=true);
          q.querySelectorAll(".opt")[a].classList.add("right");
          const why=q.querySelector(".why"),v=why.querySelector(".verdict");
          if(i===a){right++;why.classList.add("ok");v.innerHTML=U("right")}
          else{b.classList.add("wrong");missed.push(qi+1);why.classList.add("no");v.innerHTML=U("wrong")}
          applyLang(v,q.dataset.lang||getLang());why.classList.add("show");answered++;
          if(answered===total){
            const s=sec.querySelector(".score");
            const tag=(d.kind==="recap"?"Week "+d.week:"Day "+d.n)+": "+right+"/"+total+(missed.length?" (missed Q"+missed.join(", Q")+")":"");
            s.innerHTML=L("You got "+right+"/"+total,"Aap ke "+right+"/"+total+" jawab sahi hain")+(mode==="student"?
              (missed.length?"<small>"+L("Read the part about Q"+missed.join(", Q")+" again.","Q"+missed.join(", Q")+" wala hissa dobara parhein.")+"</small>":""):
              "<small>"+L("Reply in chat: ","Chat mein yeh bhej dein: ")+"<b>"+esc(tag)+"</b>"+L(" so I can track it."," taa ke main record rakh sakun.")+"</small>");
            applyLang(s,getLang());s.classList.add("show");
          }
        }));
      });
    });
    root.querySelectorAll("[data-terms]").forEach(sec=>{
      const def=sec.querySelector(".def");
      sec.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
        const on=c.classList.contains("on");sec.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
        if(on){def.classList.remove("show");return}
        c.classList.add("on");const t=d.terms[+c.dataset.i];def.innerHTML="<b>"+esc(t.t)+"</b>: "+tx(t,"d");applyLang(def,getLang());def.classList.add("show");
      }));
    });
  }
  // print: everything static and open; the teacher PDF marks answers, the student PDF stays a blank worksheet
  function preparePrint(scope,mode){
    scope.querySelectorAll("details.deep,details.chapter").forEach(x=>x.open=true);
    if(mode==="teacher")scope.querySelectorAll(".q").forEach(q=>{const o=q.querySelectorAll(".opt")[+q.dataset.a];if(o)o.classList.add("right")});
  }
  window.AT={render,esc,md,h,applyLang,getLang,getMode,modeLink,store,logo,preparePrint};
})();
</script>
<script>
(function(){
  const B=JSON.parse(document.getElementById("book-data").textContent);
  const {esc,md,h,render}=AT;
  const locked=B.locked_mode==="student";
  const mode=locked?"student":AT.getMode(),S=mode==="student",TM=!S;
  document.body.classList.add("mode-"+mode);
  if(S){document.title="Ads course book · Student edition";document.querySelector(".side .sub").textContent="Student edition"+(locked?"":" · built "+document.querySelector(".side .sub").textContent.split("built ")[1]);}
  const C=document.getElementById("content"),T=document.getElementById("toc");
  const scoreTag=s=>{if(S)return "";if(!s||s.score==null)return '<span class="tag na">not tested</span>';const r=s.score/s.max;return '<span class="tag '+(r>=2/3-1e-9?"ok":"bad")+'">'+s.score+'/'+s.max+'</span>'};
  const P=B.progress||{};const scores=P.scores||{};
  // header + KPIs
  const tested=Object.values(scores).filter(s=>s.score!=null);
  const avg=tested.length?Math.round(100*tested.reduce((a,s)=>a+s.score/s.max,0)/tested.length):null;
  const modeBtns=locked?'<span class="btn on">Student edition</span>':'<a class="btn'+(TM?" on":"")+'" href="'+esc(AT.modeLink("teacher"))+'">Teacher</a><a class="btn'+(S?" on":"")+'" href="'+esc(AT.modeLink("student"))+'">Student</a>';
  C.appendChild(h('<div><div class="hero"><div class="cover">'+AT.logo()+'<div><div class="cv">Smart Solutions</div><div class="cn">Ads course book</div></div></div><div style="margin-top:22px"><span class="eyebrow">'+(S?"Student edition":"Teacher edition")+'</span></div><h1>'+(S?"Paid ads, step by step":"Everything you learned, in one place")+'</h1><div class="meta">'+B.lessons.length+' lessons · '+B.recaps.length+(B.recaps.length===1?' weekly recap · ':' weekly recaps · ')+(S?"search or print to PDF":"search, revise, or print to PDF")+'</div>'+
   '<div class="toolbar">'+modeBtns+'<button class="btn" id="openAll">Open all</button><button class="btn" id="closeAll">Close all</button><button class="btn" onclick="window.print()">Save PDF</button>'+
   '<div class="lang" id="bookLang" role="group" aria-label="Language"><button type="button" data-l="en" title="English">EN</button><button type="button" data-l="ur" title="Roman Urdu">UR</button></div></div></div></div>'));
  document.getElementById("bookLang").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;AT.store.set("at-lang",b.dataset.l);AT.applyLang(document,b.dataset.l)});
  if(TM){
  C.appendChild(h('<div class="kpis"><div class="kpi"><b>'+B.lessons.length+'<small style="font-size:14px;color:var(--faint)">/'+B.course.total_lessons+'</small></b><span>lessons done</span></div>'+
    '<div class="kpi"><b>'+(avg==null?"–":avg+"%")+'</b><span>avg quiz score</span></div>'+
    '<div class="kpi"><b>'+(P.streak!=null?P.streak:"–")+'</b><span>day streak</span></div>'+
    '<div class="kpi"><b>'+(P.weak_spots||[]).length+'</b><span>weak spots</span></div></div>'));
  // revise these
  const rev=[];
  B.lessons.forEach(l=>{const s=scores[l.n];if(s&&s.score!=null&&s.score/s.max<2/3-1e-9)rev.push('<li><a href="#day-'+l.n+'">Day '+l.n+': '+md(l.title)+'</a> '+scoreTag(s)+'</li>')});
  (P.weak_spots||[]).forEach(w=>rev.push('<li>Weak spot: '+md(w)+'</li>'));
  (B.due||[]).forEach(x=>rev.push('<li>Spaced review due: <a href="#day-'+x.n+'">Day '+x.n+': '+md(x.title)+'</a> <span class="tag na">'+x.age+(x.age===1?" day ago":" days ago")+'</span></li>'));
  C.appendChild(h('<div class="no-print-not"><h2>Revise these</h2><section class="card rev">'+(rev.length?'<ul class="tight">'+rev.join("")+'</ul>':'<p class="empty">Nothing to revise right now. Nice.</p>')+'</section></div>'));
  // scores table
  C.appendChild(h('<div><h2>Quiz scores</h2><section class="card" style="overflow:auto"><table class="sc"><tr><th>Day</th><th>Topic</th><th>Score</th></tr>'+
    B.lessons.map(l=>'<tr><td>'+l.n+'</td><td><a href="#day-'+l.n+'">'+md(l.title)+'</a></td><td>'+scoreTag(scores[l.n])+'</td></tr>').join("")+
    B.recaps.map(r=>'<tr><td>W'+r.week+'</td><td><a href="#week-'+r.week+'">Week '+r.week+' recap</a></td><td>'+scoreTag(scores["W"+r.week])+'</td></tr>').join("")+
    '</table></section></div>'));
  }
  // chapters grouped by level -> week
  const groups=[];
  B.lessons.forEach(l=>{let g=groups.find(g=>g.level===l.level);if(!g){g={level:l.level,name:l.level_name,weeks:{}};groups.push(g)}(g.weeks[l.week]=g.weeks[l.week]||[]).push(l)});
  B.recaps.forEach(r=>{let g=groups.find(g=>Object.keys(g.weeks).includes(String(r.week)))||groups[groups.length-1];if(g)(g.weeks[r.week]=g.weeks[r.week]||[]).push(r)});
  const chapters=[];
  groups.forEach(g=>{
    C.appendChild(h('<h2>'+esc(g.name)+'</h2>'));
    T.appendChild(h('<h5>'+esc(g.name)+'</h5>'));
    Object.keys(g.weeks).sort((a,b)=>a-b).forEach(w=>{
      T.appendChild(h('<h6>Week '+w+'</h6>'));
      g.weeks[w].sort((a,b)=>(a.kind==="recap")-(b.kind==="recap")||a.n-b.n).forEach(d=>{
        const isR=d.kind==="recap";const id=isR?"week-"+d.week:"day-"+d.n;const sk=scores[isR?"W"+d.week:d.n];
        const ch=h('<details class="chapter'+(isR?" recap":"")+'" id="'+id+'"><summary><span class="d">'+(isR?"Recap":(S?"Lesson ":"Day ")+d.n)+'</span><span class="t">'+md(isR?("Week "+d.week+": "+d.title):d.title)+'</span>'+scoreTag(sk)+'</summary><div class="chbody"></div></details>');
        ch.querySelector(".chbody").appendChild(render(d,{chapter:true,mode}));
        C.appendChild(ch);
        const a=h('<a href="#'+id+'"><span class="d">'+(isR?"Recap":(S?"Lesson ":"Day ")+d.n)+'</span><span>'+md(isR?"Week "+d.week+" recap":d.title)+'</span><span class="s">'+(TM&&sk&&sk.score!=null?sk.score+"/"+sk.max:"")+'</span></a>');
        a.addEventListener("click",()=>{ch.open=true});
        T.appendChild(a);
        chapters.push({el:ch,link:a,text:ch.textContent.toLowerCase()});
      });
    });
  });
  if(!chapters.length)C.appendChild(h('<p class="empty">No lessons yet.</p>'));
  document.getElementById("openAll").onclick=()=>chapters.forEach(c=>c.el.open=true);
  document.getElementById("closeAll").onclick=()=>chapters.forEach(c=>c.el.open=false);
  // search
  const q=document.getElementById("q"),hits=document.getElementById("hits");
  q.addEventListener("input",()=>{
    const words=q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);let n=0;
    chapters.forEach(c=>{const ok=!words.length||words.every(w=>c.text.includes(w));c.el.classList.toggle("hide",!ok);c.link.classList.toggle("hide",!ok);if(ok)n++;c.el.open=!!words.length&&ok});
    hits.textContent=words.length?(n+" match"+(n===1?"":"es")):"";
  });
  // print: open everything and mark answers
  window.addEventListener("beforeprint",()=>{chapters.forEach(c=>{c.el.classList.remove("hide");c.el.open=true});
    document.querySelectorAll("details.deep").forEach(x=>x.open=true);
    if(TM)document.querySelectorAll(".q").forEach(qq=>{const o=qq.querySelectorAll(".opt")[+qq.dataset.a];if(o)o.classList.add("right")})});
  AT.applyLang(document,AT.getLang());
  if(location.hash){const t=document.querySelector(location.hash);if(t&&t.tagName==="DETAILS")t.open=true}
})();
</script>
<script id="motion-js">
(function(){
  var d=document,root=d.documentElement;
  if(!("IntersectionObserver" in window))return;
  root.classList.add("js-anim");
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("seen");io.unobserve(e.target)}})},{threshold:.15});
  function scan(){
    d.querySelectorAll(".fc,.dt,.stepper").forEach(function(v){
      if(v.dataset.m)return;v.dataset.m=1;
      var kids=v.classList.contains("dt")?v.querySelectorAll("li"):v.children;
      [].forEach.call(kids,function(k,i){k.style.setProperty("--i",Math.min(i,14))});
      if(v.classList.contains("fc"))v.querySelectorAll(".node").forEach(function(n){n.tabIndex=0;n.setAttribute("role","button")});
      io.observe(v);
    });
  }
  scan();setTimeout(scan,400);
  d.addEventListener("toggle",function(){setTimeout(scan,0)},true);
  d.addEventListener("click",function(e){
    setTimeout(scan,50);
    var n=e.target.closest&&e.target.closest(".fc>.node");if(!n)return;
    var fc=n.parentNode,kids=[].slice.call(fc.children),at=kids.indexOf(n),off=n.classList.contains("cur");
    kids.forEach(function(k,i){k.classList.remove("cur","done");k.removeAttribute("aria-pressed");
      if(!off){if(i<at)k.classList.add("done");else if(i===at){k.classList.add("cur");k.setAttribute("aria-pressed","true")}}});
    fc.classList.toggle("tracing",!off);
  });
  d.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".fc>.node")){e.preventDefault();e.target.click()}});
  window.addEventListener("beforeprint",function(){d.querySelectorAll(".fc,.dt,.stepper").forEach(function(v){v.classList.add("seen")})});
})();
</script>
<script id="v5-js">
(function(){
  var d=document,calm=matchMedia("(prefers-reduced-motion: reduce)").matches,tm;
  function seg(b){var g=b.parentNode;[].forEach.call(g.children,function(x,i){x.setAttribute("aria-pressed",String(x===b));if(x===b)g.style.setProperty("--k",i)})}
  function clear(t){
    t.querySelectorAll(".shown").forEach(function(x){x.classList.remove("shown")});
    t.querySelectorAll(".dt-ans button").forEach(function(b){b.setAttribute("aria-pressed","false")});
    t.querySelectorAll(".is-a.open").forEach(function(b){b.classList.remove("open");b.setAttribute("aria-expanded","false")});
  }
  function sync(t){
    t.querySelectorAll(".dt-n.cur").forEach(function(x){x.classList.remove("cur")});
    var g=t.classList.contains("guided");
    if(g)t.querySelectorAll(".dt-n").forEach(function(l){
      if(!l.offsetParent||!l.querySelector(":scope>.dt-box .dt-ans"))return;
      if(!l.querySelector(":scope>.dt-kids>.dt-n.shown"))l.classList.add("cur");
    });
    var r=t.parentNode.querySelector(".dt-reset");if(r)r.hidden=!(g&&t.querySelector(".dt-n.shown"));
  }

    ss.forEach(function(s,k){s.classList.toggle("on",k<=i);s.classList.toggle("done",k<i);s.classList.toggle("cur",k===i);s.firstChild.tagName==="EM"?s.children[1].setAttribute("aria-pressed",String(k===i)):s.firstChild.setAttribute("aria-pressed",String(k===i))});
    w.querySelector(".fl-count").textContent=i<0?"":(i+1)+" / "+ss.length;

  }
  function stop(w){clearInterval(tm);var p=w.querySelector(".fl-play");p.setAttribute("aria-pressed","false")}
  function at(w){var c=w.querySelector(".fl-s.cur");return c?[].indexOf.call(w.querySelectorAll(".fl-s"),c):-1}
  d.addEventListener("click",function(e){
    var el=e.target;if(!el.closest)return;
    var a=el.closest(".dt-ans button");
    if(a){
      var t=a.closest(".dtree"),l=a.closest(".dt-n"),k=+a.dataset.k,kids=l.querySelectorAll(":scope>.dt-kids>.dt-n");
      kids.forEach(function(c){c.classList.remove("shown");clear(c)});
      l.querySelectorAll(":scope>.dt-box .dt-ans button").forEach(function(b){b.setAttribute("aria-pressed",String(b===a))});
      var c=kids[k];c.classList.add("shown");
      var ab=c.querySelector(":scope>.is-a");if(ab){ab.classList.add("open");ab.setAttribute("aria-expanded","true")}
      sync(t);setTimeout(function(){c.scrollIntoView({block:"nearest",behavior:calm?"auto":"smooth"})},80);return;
    }
    var o=el.closest(".dt-box.is-a");
    if(o){var on=o.classList.toggle("open");o.setAttribute("aria-expanded",String(on));return}
    var m=el.closest(".dt-bar [data-m]");
    if(m){var tt=m.closest(".dt-wrap").querySelector(".dtree");seg(m);tt.classList.toggle("guided",m.dataset.m!=="map");clear(tt);sync(tt);return}
    var r=el.closest(".dt-reset");
    if(r){var t2=r.closest(".dt-wrap").querySelector(".dtree");clear(t2);sync(t2);return}
    var fp=el.closest(".fl-play");
    if(fp){
      var w=fp.closest(".fl-wrap"),n=w.querySelectorAll(".fl-s").length;
      if(fp.getAttribute("aria-pressed")==="true"){stop(w);return}
      var i=0;fp.setAttribute("aria-pressed","true");flow(w,0);
      tm=setInterval(function(){i++;if(i>=n){stop(w);return}flow(w,i)},calm?700:1200);return;
    }
    var fb=el.closest(".fl-box");
    if(fb){var w2=fb.closest(".fl-wrap"),k2=[].indexOf.call(w2.querySelectorAll(".fl-s"),fb.parentNode);stop(w2);flow(w2,at(w2)===k2?-1:k2);return}
    var c2=el.closest(".cmpw [data-v]");
    if(c2){var w3=c2.closest(".cmpw"),ul=w3.querySelector(".cmp");w3.dataset.v=c2.dataset.v;seg(c2);ul.classList.remove("flip");void ul.offsetWidth;ul.classList.add("flip")}
  });
  d.addEventListener("keydown",function(e){
    var b=e.target,k=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;
    if(!k||!b.closest||!b.closest(".seg2"))return;
    var bs=[].slice.call(b.parentNode.children),n=bs[bs.indexOf(b)+k];if(n){e.preventDefault();n.focus();n.click()}
  });
  var io="IntersectionObserver" in window?new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("seen");io.unobserve(x.target)}})},{threshold:.2}):null;
  function scan(){d.querySelectorAll(".dtree:not([data-o]),.fl-wrap:not([data-o])").forEach(function(t){t.dataset.o=1;if(t.classList.contains("dtree"))sync(t);if(io)io.observe(t);else t.classList.add("seen")})}
  scan();setTimeout(scan,400);setTimeout(scan,1200);
  function bar(host){var p=d.createElement("div");p.className="pg noprint";p.innerHTML='<span class="pg-bar"><i></i></span><span class="pg-n" aria-live="polite"></span>';host.parentNode.insertBefore(p,host);return p}
  function upd(p,a,n){p.style.setProperty("--p",n?a/n:0);p.querySelector(".pg-n").textContent=a+" / "+n;p.classList.toggle("full",n>0&&a===n)}
  function more(){
    d.querySelectorAll("[data-tasks] .tasks:not([data-pg])").forEach(function(ol){
      ol.dataset.pg=1;var p=bar(ol);function f(){upd(p,ol.querySelectorAll("input:checked").length,ol.querySelectorAll("input").length)}

      st.dataset.pg=1;var p=bar(st),n=st.children.length;function f(){upd(p,st.querySelectorAll("li.visited").length,n)}
      st.addEventListener("click",function(e){var h=e.target.closest(".st-h");if(h&&h.parentNode.classList.contains("open")){h.parentNode.classList.add("visited");f()}});f();
    });

      sr.dataset.pg=1;var p=bar(sr),n=sr.querySelectorAll(".it").length;function f(){upd(p,sr.querySelectorAll(".it.done").length,n)}
      sr.addEventListener("click",function(){setTimeout(f,0)});f();
    });
  }
  more();setTimeout(more,400);setTimeout(more,1200);
})();
</script>
