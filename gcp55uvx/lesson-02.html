<!--
  Ads Teacher lesson template v4 (27 Oct 2026, new layout: design v4 + v5 controls + motion).
  Built ONCE; the bot only writes lesson JSON. build.py fills the title, logo and lesson data.
  Smart Solutions brand (light): ink #0D0D0D / #1A1A1A, lime #C4F236 as fills only, rules #B8B8B8.
  Visual types: steps (tap to expand), tree (decision tree, tap answers), flow, table, toggle (before/after),
  calc (slider calculator), sort (tap-to-sort), path (click breadcrumb), shot (annotated REAL screenshot only).
  Modes: ?mode=student or the Teacher/Student buttons. Everything is inline: works as one downloaded file
  (Inter loads from Google Fonts when online, system font otherwise).
-->
<!-- CORE-CSS:START. Design v4: this one block styles BOTH the lesson page and the course book. To restyle the book, replace its two <style> blocks with this block. Student-only labels ("Private") are hidden. The renderer JS and JSON contract are untouched; a small MOTION-JS block after it adds flow tracing and entrance motion. -->
<style id="core-css">
/* Smart Solutions · light · design v4
   TYPE    Inter 400/500/600/700. Body 16px (17px on desktop sections), line-height 1.7. h1 fluid 30-46px.
   SPACE   8px grid: 4 8 12 16 24 32 48 64. One reading column (44rem, about 68 characters).
   RADIUS  16 containers, 12 controls, 999 pills. Nothing else.
   COLOR   Ink on white. Lime is a FILL only (dark text on it). ok/bad colours appear only in quiz and sort feedback.
   DEPTH   Hairline borders, no shadows.
   MOTION  One easing, 0.12-0.24s, only in response to a tap. Reveal = fade + 6px rise. All off for reduced-motion.
   RULES   Sentence-case labels (no all-caps). Do not add new colours, radii or shadows.
   BOOK    The course-book layout (.book, .side, .toc, details.chapter) lives in this same block. */
:root{
  --background:#F8F8F6;--surface:#F1F1ED;--card:#FFFFFF;
  --ink:#0D0D0D;--primary:#1A1A1A;--primary-fg:#FFFFFF;
  --muted:#EDEDEA;--muted-fg:#595959;
  --lime:#C4F236;--lime-soft:#F0FBD0;--lime-ink:#0D0D0D;
  --accent:var(--lime);--accent-fg:var(--lime-ink);
  --rule:#C4C4BE;--hair:rgba(13,13,13,.09);--border:var(--rule);
  --ok:#1D7A46;--ok-soft:#E7F5EC;--bad:#B3261E;--bad-soft:#FCECEA;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:var(--background);--line:var(--hair);--mute:var(--muted-fg);--faint:#6B6B6B;--r:16px;--shadow:none;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--background);color:var(--ink);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
a{color:var(--ink);text-decoration:underline;text-decoration-color:#8FB51A;text-decoration-thickness:2px;text-underline-offset:3px}
b,strong{font-weight:700}
[hidden]{display:none!important}
::selection{background:var(--lime)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.l-ur{font-family:"Inter",system-ui,"Noto Naskh Arabic","Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;line-height:1.95}
/* Roman Urdu is Latin text: headings keep their own tight line-height */
h1 .l-ur,h2 .l-ur,h3 .l-ur,h4 .l-ur,.qt .l-ur{line-height:inherit}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:20px 24px;margin:16px 0}
ul.tight{margin:4px 0 0;padding-left:20px}ul.tight li{margin:6px 0}

/* header: logo, counter, language. Progress line sits on the bottom edge */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:44rem;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px;padding:0 20px}
.logo{display:inline-flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:var(--ink)}
.logo svg{width:28px;height:28px;display:block}
.logo b{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.ctr{flex:none;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted-fg);white-space:nowrap}
.ctr strong{color:var(--ink);font-weight:700}
.grow{flex:1;min-width:0}
.progress-track{position:relative;height:2px;width:100%;background:transparent;margin-bottom:-1px}
.progress-fill{height:2px;width:0;background:var(--ink);transition:width .12s linear}
@media(max-width:379px){.logo b{display:none}}
.lang{flex:none;display:inline-flex;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:2px}
.lang button{font-size:12px;font-weight:600;border:0;background:none;color:var(--muted-fg);border-radius:8px;padding:0 12px;min-height:30px;min-width:40px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang.sm button{min-height:28px;padding:0 10px;min-width:34px}

/* page + hero */
.wrap{max-width:44rem;margin:0 auto;padding:0 20px 96px}
@media(min-width:640px){.wrap{padding:0 32px 128px}}
.hero{padding-top:40px}
@media(min-width:640px){.hero{padding-top:72px}}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;line-height:1.4;color:var(--ink);background:var(--lime);border-radius:8px;padding:4px 12px}
h1{margin:20px 0 0;font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-.03em;font-weight:700;color:var(--ink);text-wrap:balance}
.meta{margin-top:16px;font-size:14.5px;color:var(--muted-fg);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.statpill{display:inline-flex;gap:8px;font-size:13px;font-weight:600;color:var(--ink);background:var(--muted);border-radius:8px;padding:3px 12px}
.hero-rule{margin-top:32px;height:1px;background:var(--hair)}
.modebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.mbtn{font-size:13.5px;font-weight:600;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:0 16px;min-height:40px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hname{display:none;justify-content:space-between;gap:16px;font-size:14px;margin-top:20px;color:var(--muted-fg)}

/* sections */
.section{padding-top:48px;margin-top:48px;border-top:1px solid var(--hair)}
@media(min-width:640px){.section{padding-top:64px;margin-top:64px}}
.section.first{border-top:0;margin-top:0;padding-top:40px}
.sec-head{display:flex;align-items:center;gap:12px}
.sec-num{flex:none;display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border-radius:8px;background:var(--lime);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sec-head h3{margin:0;font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.02em;color:var(--ink);min-width:0;text-wrap:balance}
.sec-head h3.sm{font-size:18px}
@media(min-width:640px){.sec-head h3{font-size:26px}.sec-head h3.sm{font-size:20px}}
.sec-head .tail{display:none}
.sec-body{margin-top:20px;font-size:16px;line-height:1.7;color:#1F1F1F}
@media(min-width:640px){.sec-body{font-size:17px;line-height:1.75}}
.sec-body p{margin:0 0 14px}.sec-body>:last-child{margin-bottom:0}
.sec-body ul{margin:12px 0 0;padding-left:22px}.sec-body li{margin:8px 0}
.microlabel{display:block;font-size:13px;font-weight:600;color:var(--muted-fg)}

/* key point, plain words, example */
.keypoint{background:var(--lime-soft);box-shadow:inset 4px 0 0 var(--lime);border-radius:16px;padding:20px 24px;margin-top:32px}
.keypoint p{margin:8px 0 0;font-size:18px;line-height:1.55;font-weight:600;color:var(--ink)}
.keypoint.simple{background:var(--surface);box-shadow:inset 4px 0 0 var(--rule);margin-top:16px}
.keypoint.simple p{font-weight:500;font-size:16.5px}
ol.take{margin:8px 0 0;padding-left:22px;color:var(--ink);font-weight:500}ol.take li{margin:8px 0}
.example{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:20px 24px;margin-top:24px}
.example p{margin:0;font-size:16px;line-height:1.7;color:#1F1F1F}
.priv{display:none!important}
@media(max-width:639px){.card,.example,.keypoint{padding:18px 20px}}

/* breadcrumb click path */
.path{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin-top:12px;max-width:100%}
.crumb{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.crumb .sep{flex:none;width:7px;height:7px;border-top:2px solid #8A8A8A;border-right:2px solid #8A8A8A;transform:rotate(45deg);margin:0 4px 0 0}
.seg{display:inline-block;min-width:0;max-width:100%;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px}
.crumb:last-child .seg{background:var(--lime);border-color:var(--lime)}
.path-label{font-size:13px;font-weight:600;color:var(--muted-fg);margin-top:16px}
.chev{display:inline-block;width:7px;height:7px;border-top:2px solid #8A8A8A;border-right:2px solid #8A8A8A;transform:rotate(45deg);margin:0 8px 1px 4px}

/* tasks: number | text | checkbox */
.tasks{list-style:none;margin:20px 0 0;padding:0;counter-reset:tk}
.tasks>li{counter-increment:tk;border-top:1px solid var(--hair)}
.tasks>li:first-child{border-top:0}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) 24px;gap:12px;align-items:start;padding:16px 0;cursor:pointer}
.task::before{content:counter(tk);width:28px;height:28px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);color:var(--ink);font-size:13px;font-weight:600;display:grid;place-items:center}
.task.done::before{content:"✓";background:var(--lime);border-color:var(--lime);animation:pop .24s var(--ease)}
.task .tx{min-width:0;font-size:16px;line-height:1.55;color:#1F1F1F;padding-top:2px}
.task input{width:22px;height:22px;margin:3px 0 0;accent-color:#1A1A1A}
.task.done .tx>span:first-child{color:var(--muted-fg);text-decoration:line-through}
.note{font-size:13.5px;color:var(--muted-fg);margin-top:8px}

/* ===== teaching visuals ===== */
.vis-wrap{margin-top:20px}
.caption{font-size:13.5px;color:var(--muted-fg);margin-top:12px}
.vhint{font-size:13px;color:var(--muted-fg);margin:0 0 12px}
/* flow: tap a step to trace the path up to it */
.node{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:14px 18px;font-weight:600;font-size:15px;line-height:1.45;color:var(--ink);text-align:left}
.node small{display:block;font-weight:400;color:var(--muted-fg);font-size:13.5px;line-height:1.45;margin-top:4px}
.fc{display:flex;flex-direction:column;align-items:stretch}
.fc .node{cursor:pointer;transition:background .2s,opacity .25s,transform .15s,box-shadow .2s}
.fc .node:hover{transform:translateY(-1px)}
.fc .node:active{transform:scale(.985)}
.fc .node.done{background:var(--lime-soft)}
.fc .node.cur{background:var(--lime);box-shadow:0 0 0 4px var(--lime-soft)}
.fc.tracing .node:not(.done):not(.cur){opacity:.5}
.fc .link{position:relative;align-self:flex-start;margin-left:28px;width:2px;height:28px;background:var(--ink);transition:background .25s}
.fc .link::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--ink);border-bottom:0;transition:border-color .25s}
.fc .link em{position:absolute;left:16px;top:50%;transform:translateY(-50%);white-space:nowrap;font-style:normal;font-size:12.5px;color:var(--muted-fg)}
.fc.tracing .link:not(.done){background:var(--rule)}
.fc.tracing .link:not(.done)::after{border-top-color:var(--rule)}
/* steps: tap to expand */
.stepper{list-style:none;margin:0;padding:0;counter-reset:st}
.stepper>li{counter-increment:st;border:1px solid var(--hair);border-radius:16px;background:var(--card);margin:8px 0;transition:border-color .18s}
.stepper>li:hover{border-color:var(--rule)}
.stepper>li.open{border-color:var(--ink)}
.st-h{display:grid;grid-template-columns:30px minmax(0,1fr) 16px;gap:12px;align-items:center;width:100%;min-height:56px;text-align:left;background:none;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.st-h::before{content:counter(st);width:30px;height:30px;border-radius:6px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;transition:background .18s,color .18s}
.st-h .st-t{font-weight:600;line-height:1.4}
.st-h .pm{width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin-top:-4px;transition:transform .22s var(--ease),margin .22s var(--ease)}
.stepper li.open .st-h .pm{transform:rotate(-135deg);margin-top:4px}
.stepper li.open .st-h::before{background:var(--lime);color:var(--ink)}
.st-b{display:none;padding:0 16px 16px 58px;font-size:15.5px;line-height:1.65;color:#1F1F1F}
.stepper li.open .st-b{display:block;animation:rise .24s var(--ease)}
.stepper.static .st-h{cursor:default}.stepper.static .st-h .pm{display:none}
/* decision tree: connectors are drawn per item; the edge label sits inline, after the line */
.dt{--ind:20px;--off:14px;list-style:none;margin:0;padding:0}
@media(max-width:519px){.dt{--ind:14px;--off:6px}}
.dt ul{list-style:none;margin:0 0 0 var(--off);padding:0 0 0 var(--ind)}
.dt li{position:relative;padding-top:12px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start}
.dt li>.elabel{grid-column:1;grid-row:1;margin:15px 10px 0 0}
.dt li>.dnode{grid-column:2;grid-row:1}
.dt li>ul{grid-column:1/-1}
.dt ul>li::before{content:"";position:absolute;left:calc(-1*var(--ind));top:0;bottom:0;width:2px;background:var(--ink);transform-origin:top}
.dt ul>li:last-child::before{bottom:auto;height:39px}
.dt ul>li::after{content:"";position:absolute;left:calc(-1*var(--ind));top:37px;width:var(--ind);height:2px;background:var(--ink);transform-origin:left}
.elabel{display:inline-block;font-size:12.5px;font-weight:600;line-height:1.4;color:var(--ink);background:var(--lime);border-radius:8px;padding:3px 10px}
.dnode{display:block;width:100%;max-width:480px;text-align:left;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:14px 18px;font-weight:600;font-size:15px;line-height:1.45;cursor:default}
.dnode.q{background:var(--ink);color:#fff}
.dnode.a{position:relative;padding-right:48px;border-style:dashed;cursor:pointer}
.dnode.a::after{content:"+";position:absolute;right:18px;top:12px;font-size:22px;font-weight:400;line-height:1;color:var(--muted-fg);transition:transform .22s var(--ease)}
.dnode.a:hover{background:var(--surface)}
.dnode.a .tapme{display:block;font-size:13px;font-weight:500;color:var(--muted-fg);margin-top:4px}
.dnode .rev{display:none;font-weight:400;font-size:14.5px;line-height:1.55;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);color:#1F1F1F}
.dnode.open,.dnode.open:hover{border-style:solid;background:var(--lime-soft)}
.dnode.open::after{transform:rotate(45deg)}
.dnode.open .rev{display:block;animation:rise .24s var(--ease)}.dnode.open .tapme{display:none}
/* compare table */
.ctable{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;line-height:1.5;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.ctable th,.ctable td{padding:12px 16px;text-align:left;vertical-align:top;border-top:1px solid var(--hair)}
.ctable thead th{border-top:0;font-size:13px;font-weight:700;background:var(--surface)}
.ctable thead th.good{background:var(--lime)}
.ctable tbody th{font-weight:700;width:30%}
@media(max-width:519px){.ctable{font-size:13.5px}.ctable th,.ctable td{padding:10px 12px}}
/* before / after toggle */
.tog .seg2{display:inline-flex;border:1px solid var(--rule);border-radius:8px;padding:2px;background:var(--card);margin-bottom:12px}
.tog .seg2 button{border:0;background:none;border-radius:8px;padding:0 16px;min-height:36px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted-fg)}
.tog .seg2 button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tog .pane{border:1px solid var(--rule);border-radius:16px;padding:16px 20px;background:var(--card);animation:rise .22s var(--ease)}
.tog .pane.after{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--lime)}
.tog .pane ul{margin:0;padding-left:20px}.tog .pane li{margin:6px 0}
.tog .pane .plab{display:none}
/* slider calculator + number line */
.calc{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:20px}
.calc label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.calc label span{float:right;font-variant-numeric:tabular-nums}
.calc input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;cursor:pointer}
.calc input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#E2E2DE}
.calc input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:#E2E2DE}
.calc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:6px;background:var(--lime);border:2px solid var(--ink);transition:transform .12s}
.calc input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:6px;background:var(--lime);border:2px solid var(--ink);transition:transform .12s}
.calc input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.calc input[type=range]:active::-moz-range-thumb{transform:scale(1.15)}
.calc .out{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)}
.calc .out b{font-size:32px;line-height:1.1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.calc .out span{font-size:14px;color:var(--muted-fg)}
.nline{position:relative;height:52px;margin:28px 12px 12px}
.nline .ax{position:absolute;left:0;right:0;top:14px;height:4px;background:#E2E2DE;border-radius:4px}
.nline .band{position:absolute;top:10px;height:12px;background:var(--lime);border-radius:4px}
.nline .mk{position:absolute;top:4px;width:3px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .12s}
.nline .tk{position:absolute;top:32px;white-space:nowrap;line-height:1.4;font-size:12px;color:var(--muted-fg);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.nline .bl{position:absolute;top:-16px;font-size:12px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
/* tap to sort */
.sort .it{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:16px;margin:8px 0}
.sort .it p{margin:0 0 12px;font-weight:600}
.sort .bins{display:flex;flex-wrap:wrap;gap:8px}
.sort .bins button{border:1.5px solid var(--rule);background:var(--background);border-radius:8px;padding:0 16px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer}
.sort .bins button:not([disabled]):hover{border-color:var(--ink)}
.sort .bins button.right{background:var(--ok-soft);border-color:var(--ok);animation:pop .24s var(--ease)}
.sort .bins button.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .3s}
.sort .bins button[disabled]{cursor:default}
.sort .why{display:none;font-size:14.5px;margin-top:12px;color:#1F1F1F}
.sort .it.done .why{display:block;animation:rise .24s var(--ease)}
.sort .tally{font-weight:700;margin-top:12px}
/* annotated screenshot */
.shot{position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--card)}
.shot img{display:block;width:100%;height:auto}
.pin{position:absolute;width:26px;height:26px;border-radius:6px;background:var(--lime);color:var(--ink);border:2px solid var(--ink);font-size:12.5px;font-weight:700;display:grid;place-items:center;transform:translate(-50%,-50%)}
.pins{margin:12px 0 0;padding-left:0;list-style:none}.pins li{display:flex;gap:12px;margin:8px 0;font-size:14.5px}

/* ===== print: A4, quiet, black on white ===== */
@page{margin:14mm 13mm 15mm}
@media print{
  /* base: white paper, readable type, colour fills kept (they are light) */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html{scroll-behavior:auto}

  .dtree .dt-n,.dtree .dt-n>*,.dtree .dt-n::before,.dtree .dt-n::after,

  .printonly{display:block!important}
  /* spacing: tighter than screen so pages are not half empty */
  .hero{padding-top:10pt!important;padding-bottom:0!important}
  h1{font-size:22pt;line-height:1.15;margin:6pt 0 4pt}
  .keypoint{margin:10pt 0!important;padding:10pt 14pt!important}
  .section{margin-top:8pt!important;padding-top:8pt!important}
  .section.first{padding-top:8pt!important}
  .sec-head{margin-bottom:6pt!important}
  .sec-head h3{font-size:14pt}
  .sec-body,.st-b{font-size:10.5pt;line-height:1.55}
  /* keep things whole */
  .keypoint,.example,.q,.stepper>li,.tasks>li,.mistakes>li,.tnotes,.glossary>*,.caption,.note,.src li,.calc,.ctable tr,.rule,
  .sort .it,.fl-s,.dt-box,.cmp li,.tog .pane,.shot,.vis-img,figure,img,svg,.activity,.key,.hname{break-inside:avoid;page-break-inside:avoid}

  .section:not(:has(.stepper,.tasks,.q,.dtree,.fl-wrap,.cmp,.sort,.ctable,.src)){break-inside:avoid;page-break-inside:avoid}
  /* a heading never sits alone at the bottom of a page */

  .sec-head+*,.sec-head+*>li:first-child,.q-top+.qt{break-before:avoid}

  .st-b,.dnode .rev{display:block!important}
  .stepper>li{margin:4pt 0!important}
  .tasks>li{padding-top:6pt!important;padding-bottom:6pt!important}
  .tnotes,.example{padding:10pt 14pt!important}
  .tog .pane{display:block!important;margin-bottom:8px}.tog .pane .plab{display:block;font-weight:700;margin-bottom:6px}
  details.deep>*{display:block}
  /* quiz: teacher copy marks the answer, student copy is a clean worksheet */
  .opt{border-width:1px;min-height:0!important;padding-top:4.5pt!important;padding-bottom:4.5pt!important;margin:4pt 0!important}

  .mode-student .hname{display:flex}
  .mode-teacher .opt.right::after{content:"  ✓ answer";font-weight:700;color:var(--ok)}
  /* sources: show the address so the paper copy is still useful */
  .src a{padding:3pt 0!important;font-size:9.5pt}
  .src a[href^="http"]::after{content:" · " attr(href);font-size:8pt;color:#555;word-break:break-all}
  a{text-decoration:none;color:inherit}

  .book{display:block!important}
  .hero .cover svg,.cover svg{width:64px;height:64px}
  .kpis{break-inside:avoid}
  details.chapter{break-before:page;page-break-before:always;border:0!important;box-shadow:none!important;margin:0!important}
  details.chapter>summary{list-style:none;padding:0 0 8pt!important;border-bottom:1px solid #bbb;margin-bottom:6pt}
  details.chapter>summary::-webkit-details-marker{display:none}
  details.chapter>summary::after,details.chapter>summary::before{display:none!important}

  /* ink saver: big dark boxes print as outlined boxes (small number badges stay dark) */

  .is-q .dt-sub,.dnode.q small{color:#444!important}

  .wrap{padding-bottom:0!important}
}

  // (b) decision tree: nodes {id,t,kind:"q"|"a",reveal}, edges [from,to,label]
  function treeHTML(v){
    const nodes={},kids={},hp={};let c=0;const seen={};
    (v.nodes||[]).forEach(n=>nodes[n.id]=n);
    (v.edges||[]).forEach(e=>{const [x,y,l]=Array.isArray(e)?e:[e.from,e.to,e.label];(kids[x]=kids[x]||[]).push({id:y,label:l});hp[y]=1});
    const lb=l=>typeof l==="string"?md(l):tx(l,"t");
    const li=(id,lab,gated)=>{
      if(seen[id]||!nodes[id])return "";seen[id]=1;
      const n=nodes[id],k=kids[id]||[];

        ?'<button type="button" class="dt-box is-a" aria-expanded="false"><span class="dt-t">'+tx(n,"t")+'</span><span class="dt-sub dt-tap">'+U("tapans")+'</span><span class="dt-plus" aria-hidden="true"></span><span class="dt-rev"><span>'+tx(n,"reveal")+'</span></span></button>'
        :'<div class="dt-box is-q"><span class="dt-t">'+tx(n,"t")+'</span>'+(n.sub?'<span class="dt-sub">'+tx(n,"sub")+'</span>':"")+ans+'</div>';
      return '<li class="dt-n" style="--i:'+(c++)+'"'+(gated?' data-gated':'')+'>'+(lab?'<span class="dt-edge">'+lb(lab)+'</span>':"")+box+(k.length?'<ul class="dt-kids">'+k.map(x=>li(x.id,x.label,k.length>1)).join("")+'</ul>':"")+'</li>';
    };
    const bar='<div class="dt-bar noprint"><div class="seg2" style="--n:2;--k:0" role="group"><button type="button" data-m="guided" aria-pressed="true">'+U("guided")+'</button><button type="button" data-m="map" aria-pressed="false">'+U("fullmap")+'</button></div><button type="button" class="dt-reset" hidden>'+U("reset")+'</button></div>';
    return '<div class="dt-wrap">'+bar+'<ul class="dtree guided">'+(v.nodes||[]).filter(n=>!hp[n.id]).map(r=>li(r.id)).join("")+'</ul></div>';

  // labelled compare table: cols [corner, A, B], rows [[label, a, b], ...]; "good" = index of the better column
  function tableHTML(v){
    const cols=v.cols||["",(v.left||{}).title,(v.right||{}).title];
    let rows=v.rows;
    if(!rows&&v.left){const n=Math.max(v.left.items.length,v.right.items.length);rows=[];for(let i=0;i<n;i++)rows.push(["",v.left.items[i]||"",v.right.items[i]||""])}
    const good=v.good!=null?v.good:2;const hasLab=rows.some(r=>r[0]);

      rows.map((r,ri)=>'<tr>'+r.map((c,i)=>(i||hasLab)?(i===0?'<th scope="row">':'<td>')+L(md(c),v.rows_ur?md(v.rows_ur[ri][i]):null)+(i===0?'</th>':'</td>'):"").join("")+'</tr>').join("")+'</tbody></table>';

  // before/after compare: paired rows, switch Old / Compare / New
  function toggleHTML(v){
    const A=v.before,B=v.after,a=lst(A.items||[A.text],A.items_ur),b=lst(B.items||[B.text],B.items_ur);

  // (c) slider calculator: fixed formula library (no eval)
  const FORMULAS={
    hook_rate:{f:x=>x.impressions?100*x.plays/x.impressions:0,unit:"%",dp:1},
    hold_rate:{f:x=>x.plays?100*x.thruplays/x.plays:0,unit:"%",dp:1},
    breakeven_roas:{f:x=>x.price>x.cost?x.price/(x.price-x.cost):0,unit:"x",dp:2},
    cpa:{f:x=>x.results?x.spend/x.results:0,unit:"",dp:0},
    ctr:{f:x=>x.impressions?100*x.clicks/x.impressions:0,unit:"%",dp:2}
  };
  function calcHTML(v){
    const F=FORMULAS[v.formula]||{f:()=>0,unit:""};const sc=v.scale||{min:0,max:100};
    const pct=x=>Math.max(0,Math.min(100,100*(x-sc.min)/(sc.max-sc.min)));
    const ticks=(sc.ticks||[sc.min,sc.max]).map(t=>'<span class="tk" style="left:'+pct(t)+'%">'+esc(t)+(F.unit==="%"?"%":"")+'</span>').join("");
    const band=v.band?'<span class="band" style="left:'+pct(v.band.from)+'%;width:'+(pct(v.band.to)-pct(v.band.from))+'%"></span><span class="bl" style="left:'+((pct(v.band.from)+pct(v.band.to))/2)+'%">'+tx(v.band,"label")+'</span>':"";
    return '<div class="calc" data-formula="'+esc(v.formula)+'">'+(v.inputs||[]).map(i=>'<label>'+tx(i,"label")+' <span data-show="'+esc(i.id)+'"></span><input type="range" data-id="'+esc(i.id)+'" min="'+i.min+'" max="'+i.max+'" step="'+(i.step||1)+'" value="'+i.value+'" aria-label="'+esc(i.label)+'"></label>').join("")+
      '<div class="out"><b data-out></b><span>'+tx(v,"result")+'</span></div>'+(v.scale?'<div class="nline"><span class="ax"></span>'+band+ticks+'<span class="mk"></span></div>':"")+

    if(S&&d.discuss&&d.discuss.length)body.push('<section class="section">'+secHead("?",U("talk"),true)+'<div class="sec-body"><ul>'+lst(d.discuss,d.discuss_ur).map(x=>'<li>'+x+'</li>').join("")+'</ul></div></section>');
    if(d.terms&&d.terms.length){
      const gl='<div class="glossary">'+d.terms.map(t=>'<div><b>'+esc(t.t)+'</b> · '+tx(t,"d")+'</div>').join("")+'</div>';
      if(isRecap)body.push('<section class="section">'+secHead("Aa",U("cheat"),true)+gl+'</section>');
      else body.push('<section class="section" data-terms>'+secHead("Aa",U("terms"),true)+
          '<span class="microlabel noprint" style="margin-top:12px">'+U("tapt")+'</span><div class="chips noprint">'+
          d.terms.map((t,i)=>'<button type="button" class="chip" data-i="'+i+'">'+esc(t.t)+'</button>').join("")+'</div><div class="def noprint"></div><div class="printonly">'+gl+'</div></section>');
    }
    if(d.sources&&d.sources.length)body.push('<section class="section">'+secHead("Src",U("src"),true)+
      '<ul class="src">'+d.sources.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a></li>').join("")+'</ul></section>');
    if(T&&d.next&&!opts.chapter)body.push('<div class="next"><span class="microlabel">'+U("next")+'</span><p>'+tx(d,"next")+'</p></div>');
    const root=h('<div class="mode-'+mode+'">'+head+'<main class="'+(opts.chapter?"":"wrap")+'">'+body.join("")+'</main></div>');
    wire(root,d,uid,mode);
    applyLang(root,getLang());
    return root;
  }

  function wire(root,d,uid,mode){
    root.querySelectorAll(".lang").forEach(g=>g.addEventListener("click",ev=>{
      const b=ev.target.closest("button");if(!b)return;const l=b.dataset.l;
      if(g.dataset.scope==="page"){store.set("at-lang",l);applyLang(document,l)}else applyLang(g.closest(".q"),l);
    }));
    root.querySelectorAll("[data-tasks]").forEach(sec=>{
      const key="at-tasks-"+uid+(sec.dataset.key?"-"+sec.dataset.key:"");const saved=store.get(key)||{};
      sec.querySelectorAll("input").forEach(cb=>{
        const i=cb.dataset.i;cb.checked=!!saved[i];cb.closest(".task").classList.toggle("done",cb.checked);
        cb.addEventListener("change",()=>{saved[i]=cb.checked;store.set(key,saved);cb.closest(".task").classList.toggle("done",cb.checked)});
      });
    });
    // (a) steps
    root.querySelectorAll(".stepper:not(.static) .st-h").forEach(b=>b.addEventListener("click",()=>{const li=b.parentElement;const o=li.classList.toggle("open");b.setAttribute("aria-expanded",String(o))}));
    // (b) tree answers
    root.querySelectorAll(".dnode.a").forEach(b=>b.addEventListener("click",()=>{const o=b.classList.toggle("open");b.setAttribute("aria-expanded",String(o))}));
    // (c) toggle
    root.querySelectorAll(".tog").forEach(t=>t.querySelectorAll(".seg2 button").forEach(b=>b.addEventListener("click",()=>{
      t.querySelectorAll(".seg2 button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      t.querySelectorAll(".pane").forEach(p=>p.hidden=!p.classList.contains(b.dataset.p));
    })));
    // (c) calculator
    root.querySelectorAll(".calc").forEach(c=>{
      const F=FORMULAS[c.dataset.formula];if(!F)return;
      const v=(d.visuals||[d.visual]).concat((d.blocks||[]).map(b=>b.visual)).find(x=>x&&x.type==="calc"&&x.formula===c.dataset.formula)||{};
      const sc=v.scale||{min:0,max:100};const fmt=n=>Number(n).toLocaleString("en-US");
      const upd=()=>{const x={};c.querySelectorAll("input").forEach(i=>{x[i.dataset.id]=+i.value;const s=c.querySelector('[data-show="'+i.dataset.id+'"]');if(s)s.textContent=fmt(i.value)});
        const r=F.f(x);c.querySelector("[data-out]").textContent=(F.unit===""?fmt(Math.round(r)):r.toFixed(F.dp))+(F.unit==="x"?"x":F.unit);
        const mk=c.querySelector(".mk");if(mk)mk.style.left=Math.max(0,Math.min(100,100*(r-sc.min)/(sc.max-sc.min)))+"%";
        const vd=c.querySelector("[data-verdict]");if(vd&&v.verdicts){const hit=v.verdicts.find(w=>r<w.below)||v.verdicts[v.verdicts.length-1];vd.innerHTML=tx(hit,"t");applyLang(vd,getLang())}};
      c.querySelectorAll("input").forEach(i=>i.addEventListener("input",upd));upd();
    });
    // (c) sort
    root.querySelectorAll(".sort").forEach(s=>{let done=0,right=0;const items=s.querySelectorAll(".it");
      items.forEach(it=>it.querySelectorAll(".bins button").forEach(b=>b.addEventListener("click",()=>{
        const ok=+b.dataset.b===+it.dataset.bin;it.querySelectorAll(".bins button").forEach(x=>{x.disabled=true;if(+x.dataset.b===+it.dataset.bin)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");else right++;it.classList.add("done");done++;
        if(done===items.length){const t=s.querySelector(".tally");t.innerHTML=L(right+"/"+items.length+" sorted right",right+"/"+items.length+" sahi");applyLang(t,getLang())}
      })))});
    // quiz
    root.querySelectorAll("[data-quiz]").forEach(sec=>{
      const total=+sec.dataset.total;let answered=0,right=0;const missed=[];
      sec.querySelectorAll(".q").forEach((q,qi)=>{
        const a=+q.dataset.a;
        q.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
          const i=+b.dataset.i;q.querySelectorAll(".opt").forEach(x=>x.disabled=true);
          q.querySelectorAll(".opt")[a].classList.add("right");
          const why=q.querySelector(".why"),v=why.querySelector(".verdict");
          if(i===a){right++;why.classList.add("ok");v.innerHTML=U("right")}
          else{b.classList.add("wrong");missed.push(qi+1);why.classList.add("no");v.innerHTML=U("wrong")}
          applyLang(v,q.dataset.lang||getLang());why.classList.add("show");answered++;
          if(answered===total){
            const s=sec.querySelector(".score");
            const tag=(d.kind==="recap"?"Week "+d.week:"Day "+d.n)+": "+right+"/"+total+(missed.length?" (missed Q"+missed.join(", Q")+")":"");
            s.innerHTML=L("You got "+right+"/"+total,"Aap ke "+right+"/"+total+" jawab sahi hain")+(mode==="student"?
              (missed.length?"<small>"+L("Read the part about Q"+missed.join(", Q")+" again.","Q"+missed.join(", Q")+" wala hissa dobara parhein.")+"</small>":""):
              "<small>"+L("Reply in chat: ","Chat mein yeh bhej dein: ")+"<b>"+esc(tag)+"</b>"+L(" so I can track it."," taa ke main record rakh sakun.")+"</small>");
            applyLang(s,getLang());s.classList.add("show");
          }
        }));
      });
    });
    root.querySelectorAll("[data-terms]").forEach(sec=>{
      const def=sec.querySelector(".def");
      sec.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
        const on=c.classList.contains("on");sec.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
        if(on){def.classList.remove("show");return}
        c.classList.add("on");const t=d.terms[+c.dataset.i];def.innerHTML="<b>"+esc(t.t)+"</b>: "+tx(t,"d");applyLang(def,getLang());def.classList.add("show");
      }));
    });
  }
  // print: everything static and open; the teacher PDF marks answers, the student PDF stays a blank worksheet
  function preparePrint(scope,mode){
    scope.querySelectorAll("details.deep,details.chapter").forEach(x=>x.open=true);
    if(mode==="teacher")scope.querySelectorAll(".q").forEach(q=>{const o=q.querySelectorAll(".opt")[+q.dataset.a];if(o)o.classList.add("right")});
  }
  window.AT={render,esc,md,h,applyLang,getLang,getMode,modeLink,store,logo,preparePrint};
})();
</script>

<script>
(function(){
  const el=document.getElementById("lesson-data");
  if(!el||!window.AT)return;
  let d;try{d=JSON.parse(el.textContent)}catch(e){document.getElementById("app").textContent="Lesson data is missing or broken.";return}
  const locked=d.locked_mode==="student";
  const mode=locked?"student":AT.getMode();
  document.title=(d.kind==="recap"?"Week "+d.week+" recap":(mode==="student"?"Lesson ":"Day ")+d.n)+" · "+d.title+(mode==="student"?" (student handout)":"");
  const root=AT.render(d,{mode,locked});
  document.getElementById("app").appendChild(root);
  window.addEventListener("beforeprint",()=>AT.preparePrint(root,mode));
  const fill=root.querySelector("[data-scrollfill]");
  const onScroll=()=>{const doc=document.documentElement;const max=doc.scrollHeight-window.innerHeight;
    if(fill)fill.style.width=(max>0?Math.min(100,Math.max(0,100*window.scrollY/max)):0)+"%"};
  window.addEventListener("scroll",onScroll,{passive:true});onScroll();
})();
</script>
<!-- MOTION-JS:START (flow trace + entrance; add this block before </body> in course-book.html too) -->
<script id="motion-js">
(function(){
  var d=document,root=d.documentElement;
  if(!("IntersectionObserver" in window))return;
  root.classList.add("js-anim");
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("seen");io.unobserve(e.target)}})},{threshold:.15});
  function scan(){
    d.querySelectorAll(".fc,.dt,.stepper").forEach(function(v){
      if(v.dataset.m)return;v.dataset.m=1;
      var kids=v.classList.contains("dt")?v.querySelectorAll("li"):v.children;
      [].forEach.call(kids,function(k,i){k.style.setProperty("--i",Math.min(i,14))});
      if(v.classList.contains("fc"))v.querySelectorAll(".node").forEach(function(n){n.tabIndex=0;n.setAttribute("role","button")});
      io.observe(v);
    });
  }
  scan();setTimeout(scan,400);
  d.addEventListener("toggle",function(){setTimeout(scan,0)},true);
  d.addEventListener("click",function(e){
    setTimeout(scan,50);
    var n=e.target.closest&&e.target.closest(".fc>.node");if(!n)return;
    var fc=n.parentNode,kids=[].slice.call(fc.children),at=kids.indexOf(n),off=n.classList.contains("cur");
    kids.forEach(function(k,i){k.classList.remove("cur","done");k.removeAttribute("aria-pressed");
      if(!off){if(i<at)k.classList.add("done");else if(i===at){k.classList.add("cur");k.setAttribute("aria-pressed","true")}}});
    fc.classList.toggle("tracing",!off);
  });
  d.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".fc>.node")){e.preventDefault();e.target.click()}});
  window.addEventListener("beforeprint",function(){d.querySelectorAll(".fc,.dt,.stepper").forEach(function(v){v.classList.add("seen")})});
})();
</script>
<!-- MOTION-JS:END -->
<script id="v5-js">
(function(){
  var d=document,calm=matchMedia("(prefers-reduced-motion: reduce)").matches,tm;
  function seg(b){var g=b.parentNode;[].forEach.call(g.children,function(x,i){x.setAttribute("aria-pressed",String(x===b));if(x===b)g.style.setProperty("--k",i)})}
  function clear(t){
    t.querySelectorAll(".shown").forEach(function(x){x.classList.remove("shown")});
    t.querySelectorAll(".dt-ans button").forEach(function(b){b.setAttribute("aria-pressed","false")});
    t.querySelectorAll(".is-a.open").forEach(function(b){b.classList.remove("open");b.setAttribute("aria-expanded","false")});
  }
  function sync(t){
    t.querySelectorAll(".dt-n.cur").forEach(function(x){x.classList.remove("cur")});
    var g=t.classList.contains("guided");
    if(g)t.querySelectorAll(".dt-n").forEach(function(l){
      if(!l.offsetParent||!l.querySelector(":scope>.dt-box .dt-ans"))return;
      if(!l.querySelector(":scope>.dt-kids>.dt-n.shown"))l.classList.add("cur");
    });
    var r=t.parentNode.querySelector(".dt-reset");if(r)r.hidden=!(g&&t.querySelector(".dt-n.shown"));
  }
  function flow(w,i){
    var ss=w.querySelectorAll(".fl-s");w.classList.toggle("tracing",i>=0);
    ss.forEach(function(s,k){s.classList.toggle("on",k<=i);s.classList.toggle("done",k<i);s.classList.toggle("cur",k===i);s.firstChild.tagName==="EM"?s.children[1].setAttribute("aria-pressed",String(k===i)):s.firstChild.setAttribute("aria-pressed",String(k===i))});
    w.querySelector(".fl-count").textContent=i<0?"":(i+1)+" / "+ss.length;
    if(i>=0)ss[i].scrollIntoView({block:"nearest",behavior:calm?"auto":"smooth"});
  }
  function stop(w){clearInterval(tm);var p=w.querySelector(".fl-play");p.setAttribute("aria-pressed","false")}
  function at(w){var c=w.querySelector(".fl-s.cur");return c?[].indexOf.call(w.querySelectorAll(".fl-s"),c):-1}
  d.addEventListener("click",function(e){
    var el=e.target;if(!el.closest)return;
    var a=el.closest(".dt-ans button");
    if(a){
      var t=a.closest(".dtree"),l=a.closest(".dt-n"),k=+a.dataset.k,kids=l.querySelectorAll(":scope>.dt-kids>.dt-n");
      kids.forEach(function(c){c.classList.remove("shown");clear(c)});
      l.querySelectorAll(":scope>.dt-box .dt-ans button").forEach(function(b){b.setAttribute("aria-pressed",String(b===a))});
      var c=kids[k];c.classList.add("shown");
      var ab=c.querySelector(":scope>.is-a");if(ab){ab.classList.add("open");ab.setAttribute("aria-expanded","true")}
      sync(t);setTimeout(function(){c.scrollIntoView({block:"nearest",behavior:calm?"auto":"smooth"})},80);return;
    }
    var o=el.closest(".dt-box.is-a");
    if(o){var on=o.classList.toggle("open");o.setAttribute("aria-expanded",String(on));return}
    var m=el.closest(".dt-bar [data-m]");
    if(m){var tt=m.closest(".dt-wrap").querySelector(".dtree");seg(m);tt.classList.toggle("guided",m.dataset.m!=="map");clear(tt);sync(tt);return}
    var r=el.closest(".dt-reset");
    if(r){var t2=r.closest(".dt-wrap").querySelector(".dtree");clear(t2);sync(t2);return}
    var fp=el.closest(".fl-play");
    if(fp){
      var w=fp.closest(".fl-wrap"),n=w.querySelectorAll(".fl-s").length;
      if(fp.getAttribute("aria-pressed")==="true"){stop(w);return}
      var i=0;fp.setAttribute("aria-pressed","true");flow(w,0);
      tm=setInterval(function(){i++;if(i>=n){stop(w);return}flow(w,i)},calm?700:1200);return;
    }
    var fb=el.closest(".fl-box");
    if(fb){var w2=fb.closest(".fl-wrap"),k2=[].indexOf.call(w2.querySelectorAll(".fl-s"),fb.parentNode);stop(w2);flow(w2,at(w2)===k2?-1:k2);return}
    var c2=el.closest(".cmpw [data-v]");
    if(c2){var w3=c2.closest(".cmpw"),ul=w3.querySelector(".cmp");w3.dataset.v=c2.dataset.v;seg(c2);ul.classList.remove("flip");void ul.offsetWidth;ul.classList.add("flip")}
  });
  d.addEventListener("keydown",function(e){
    var b=e.target,k=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;
    if(!k||!b.closest||!b.closest(".seg2"))return;
    var bs=[].slice.call(b.parentNode.children),n=bs[bs.indexOf(b)+k];if(n){e.preventDefault();n.focus();n.click()}
  });
  var io="IntersectionObserver" in window?new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("seen");io.unobserve(x.target)}})},{threshold:.2}):null;
  function scan(){d.querySelectorAll(".dtree:not([data-o]),.fl-wrap:not([data-o])").forEach(function(t){t.dataset.o=1;if(t.classList.contains("dtree"))sync(t);if(io)io.observe(t);else t.classList.add("seen")})}
  scan();setTimeout(scan,400);setTimeout(scan,1200);
  function bar(host){var p=d.createElement("div");p.className="pg noprint";p.innerHTML='<span class="pg-bar"><i></i></span><span class="pg-n" aria-live="polite"></span>';host.parentNode.insertBefore(p,host);return p}
  function upd(p,a,n){p.style.setProperty("--p",n?a/n:0);p.querySelector(".pg-n").textContent=a+" / "+n;p.classList.toggle("full",n>0&&a===n)}
  function more(){
    d.querySelectorAll("[data-tasks] .tasks:not([data-pg])").forEach(function(ol){
      ol.dataset.pg=1;var p=bar(ol);function f(){upd(p,ol.querySelectorAll("input:checked").length,ol.querySelectorAll("input").length)}
      ol.addEventListener("change",f);f();setTimeout(f,300);
    });
    d.querySelectorAll(".stepper:not(.static):not([data-pg])").forEach(function(st){
      st.dataset.pg=1;var p=bar(st),n=st.children.length;function f(){upd(p,st.querySelectorAll("li.visited").length,n)}
      st.addEventListener("click",function(e){var h=e.target.closest(".st-h");if(h&&h.parentNode.classList.contains("open")){h.parentNode.classList.add("visited");f()}});f();
    });
    d.querySelectorAll(".sort:not([data-pg])").forEach(function(sr){
      sr.dataset.pg=1;var p=bar(sr),n=sr.querySelectorAll(".it").length;function f(){upd(p,sr.querySelectorAll(".it.done").length,n)}
      sr.addEventListener("click",function(){setTimeout(f,0)});f();
    });
  }
  more();setTimeout(more,400);setTimeout(more,1200);
})();
</script>
