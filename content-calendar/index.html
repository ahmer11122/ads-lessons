<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content calendar — Smart Solutions</title>
<link rel="icon" href="smart-solutions-s-logo.svg" type="image/svg+xml">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F0;--card:#FFFFFF;--ink:#151515;--mute:#5A5D55;--faint:#7B7E75;--line:rgba(21,21,21,.1);--soft:#ECEEE8;
--lime:#C4F236;--lime-soft:#EEF9C6;--lime-mid:#DDF683;--lime-ink:#0D0D0D;--lime-deep:#587300;
--ok:#17703E;--ok-soft:#E0F2E7;--fb:#1877F2;--ig:#D6249F;--tt:#151515;--cy:#25F4EE;
--shadow:0 24px 70px rgba(0,0,0,.22);--ease:cubic-bezier(.2,.7,.2,1);
--disp:"Bricolage Grotesque","Inter",system-ui,sans-serif;--ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0E0C;--card:#151613;--ink:#F1F2EC;--mute:#A3A69C;--faint:#8A8D84;--line:rgba(255,255,255,.11);--soft:#1E201B;--lime-soft:#262F0E;--lime-mid:#36431A;--lime-deep:#C4F236;--ok:#6FD79A;--ok-soft:#163021;--tt:#F1F2EC;--shadow:0 24px 70px rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0E0C;--card:#151613;--ink:#F1F2EC;--mute:#A3A69C;--faint:#8A8D84;--line:rgba(255,255,255,.11);--soft:#1E201B;--lime-soft:#262F0E;--lime-mid:#36431A;--lime-deep:#C4F236;--ok:#6FD79A;--ok-soft:#163021;--tt:#F1F2EC;--shadow:0 24px 70px rgba(0,0,0,.65);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--lime);color:var(--lime-ink)}
svg{display:block}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hd .in{max-width:1320px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:700 17px var(--disp);letter-spacing:-.02em;white-space:nowrap}
.brand img{width:28px;height:28px}
.brand span{display:none;color:var(--faint);font:500 13px var(--ui);letter-spacing:0}
.upd{margin-left:auto;font-size:12px;line-height:1.3;color:var(--mute);text-align:right}
.upd b{display:block;color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--soft)}
.tabs button{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:99px;font:600 13.5px var(--ui);color:var(--mute)}
.tabs svg{display:none}
.tabs button[aria-current=page]{background:var(--lime);color:var(--lime-ink)}
@media(max-width:899px){
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.16);z-index:55}
.tabs button{flex:1;flex-direction:column;gap:3px;padding:8px 0;border-radius:18px;font-size:11.5px}
.tabs svg{display:block}}
@media(min-width:900px){.hd .in{padding:0 32px}.brand span{display:inline}.tabs{margin:0 auto}.upd{margin-left:0}}

.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 124px}
@media(min-width:900px){.wrap{padding:32px 32px 72px}}
.tab{display:flex;flex-direction:column;gap:16px}
.fine{margin:24px 0 0;font-size:12px;color:var(--faint);text-align:center}
.bar h1,.ph{font:700 clamp(30px,6vw,46px)/1 var(--disp);letter-spacing:-.04em;margin:0}
.psub{margin:8px 0 0;color:var(--mute);max-width:46ch}

.board{order:3;display:grid;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.board.solo{order:0}
.nums{display:grid;grid-template-columns:repeat(4,1fr)}
.nums div{padding:14px;border-left:1px solid var(--line)}
.nums div:first-child{border-left:0}
.nums b{display:block;font:700 28px/1 var(--disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.nums span{display:block;margin-top:4px;font-size:12px;font-weight:500;color:var(--mute)}
.queue{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px;border-top:1px solid var(--line)}
.q span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.meter{height:6px;margin-top:8px;background:linear-gradient(90deg,var(--c) var(--w),var(--line) 0);-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent 0 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent 0 10%)}
.q small{display:block;margin-top:6px;font-size:11.5px;color:var(--mute)}
@media(min-width:900px){.board{order:0;grid-template-columns:auto 1fr}.board.solo{grid-template-columns:1fr}.nums div{padding:18px 30px}.nums b{font-size:40px}.queue{border-top:0;border-left:1px solid var(--line);padding:18px 28px;align-items:center;gap:24px}}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.bar h1{flex:1 1 auto;min-width:0}
.nav,.opts{display:flex;gap:8px;align-items:center}
.opts{flex-wrap:wrap;width:100%}
.ib{display:grid;place-items:center;height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;font-size:13.5px}
.seg{display:flex;padding:3px;border:1px solid var(--line);background:var(--card);border-radius:12px}
.seg button{height:32px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pf{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;font-size:13px}
.pf[aria-pressed=false]{background:transparent;color:var(--faint)}
.pf[aria-pressed=false] .pd{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--faint)!important}
.pf .l{display:none}
@media(min-width:900px){.opts{width:auto;order:1;margin-left:auto}.nav{order:2}.bar h1{flex:0 1 auto}.pf{padding:0 14px}.pf .s{display:none}.pf .l{display:inline}.bar{flex-wrap:nowrap}}
.pd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tt)}
.pd.FB{background:var(--fb)}.pd.IG{background:var(--ig)}.pd.TikTok{box-shadow:1.5px 1.5px 0 var(--cy)}
.pd.all{background:var(--lime);box-shadow:0 0 0 1px var(--lime-deep)}

.layout{display:grid;gap:16px;align-items:start}
.layout.wk .panel{display:none}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 360px}.layout.wk{grid-template-columns:1fr}}
.cal{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{padding:11px 0;text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;min-height:62px;padding:6px 2px 8px;border-top:1px solid var(--line);border-left:1px solid var(--line);text-align:center;position:relative}
.cell:nth-child(7n+1){border-left:0}
.cell.in{animation:in .5s var(--ease) both;animation-delay:calc(var(--i)*14ms)}
.top{display:flex;justify-content:center;align-items:center}
.d{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cnt,.pills{display:none}
.cell.out{background:var(--soft);color:var(--faint)}
.cell.today .d{background:var(--lime);color:var(--lime-ink);font-weight:700}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink);z-index:1}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:36px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dots i.w{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.dots i.po{opacity:.4}
.dots i.pl{background:var(--lime);box-shadow:0 0 0 1px var(--lime-deep)}
.pill{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:6px;background:var(--soft);box-shadow:inset 3px 0 0 var(--c);font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden}
.pill em{font:500 10.5px var(--ui);color:var(--mute);font-variant-numeric:tabular-nums}
.pill b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pill.po{opacity:.55}.pill.pl{background:var(--lime-soft)}
.pill.w{background:transparent;box-shadow:inset 0 0 0 1px var(--line),inset 3px 0 0 var(--c)}
.more{padding:1px 6px;font-size:11.5px;font-weight:600;color:var(--mute)}
@media(min-width:900px){
.cell{align-items:stretch;min-height:124px;padding:8px;text-align:left}
.cell:hover{background:var(--soft)}.cell.out:hover{background:var(--soft)}
.top{justify-content:space-between}.d{width:28px;height:28px;font-size:13px}
.cnt{display:block;font-size:11.5px;font-weight:600;color:var(--faint)}
.dots{display:none}.pills{display:flex;flex-direction:column;gap:3px}}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.lg .w{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}.lg .po{opacity:.4}.lg .pl{background:var(--lime);box-shadow:0 0 0 1px var(--lime-deep)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 16px 12px;scroll-margin-top:72px}
@media(min-width:900px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;padding:22px 20px 14px}}
.dh{display:flex;align-items:center;gap:12px}
.dh>b{font:700 52px/.9 var(--disp);letter-spacing:-.05em}
.dh div{display:flex;flex-direction:column;line-height:1.25}
.dh strong{font-size:16px}.dh span{font-size:13px;color:var(--mute)}
.now{margin-left:auto;padding:5px 10px;border-radius:99px;background:var(--lime);color:var(--lime-ink);font:600 12px var(--ui)}
.sum{margin:12px 0 4px;font-size:13px;color:var(--mute)}
.empty{display:grid;gap:4px;padding:28px 0 20px}.empty span{font-size:13.5px;color:var(--mute)}
.it{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;width:100%;margin-top:8px;text-align:left}
.it time{padding-top:13px;font-weight:600;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.bx{display:block;min-width:0;padding:12px 12px 12px 15px;border-radius:14px;background:var(--soft);box-shadow:inset 4px 0 0 var(--c);transition:background .15s}
.it:hover .bx{background:var(--lime-soft)}
.it.po .bx{opacity:.72}
.mt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mute)}
.mt .tag{margin-left:auto}
.bx b{display:block;margin-top:6px;font-size:15px;line-height:1.3;font-weight:600}
.bx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:13px;line-height:1.45;color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px 4px 7px;border-radius:99px;font:600 11.5px/1 var(--ui);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-scheduled{background:var(--ink);color:var(--bg)}
.t-draft{border:1px dashed var(--faint);color:var(--mute)}.t-draft::before{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.t-posted{background:var(--ok-soft);color:var(--ok)}
.t-idea,.t-script{background:var(--lime-soft);color:var(--lime-deep)}
.t-voice{background:var(--lime-mid);color:var(--lime-deep)}
.t-render{background:var(--lime);color:var(--lime-ink)}

.week{display:grid;gap:12px}
.wd{min-width:0;padding:14px 12px 10px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.wd header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.wd header b{display:grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:50%;font:700 20px var(--disp);letter-spacing:-.03em}
.wd.today header b{background:var(--lime);color:var(--lime-ink)}
.wd header span{font-size:13px;font-weight:600;color:var(--mute)}
.none{margin:10px 0;font-size:13px;color:var(--faint)}
@media(min-width:900px){
.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.wd{border:0;border-left:1px solid var(--line);border-radius:0;min-height:440px}.wd:first-child{border-left:0}
.wd .it{grid-template-columns:1fr;gap:3px}.wd .it time{padding:6px 2px 0}.wd .mt{flex-wrap:wrap}}

.grp{margin-top:12px}
.grp header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.grp h3{margin:0;font:700 24px/1.1 var(--disp);letter-spacing:-.03em}
.grp header span{font-size:13px;color:var(--mute)}
.pg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.pc{display:flex;flex-direction:column;gap:10px;padding:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px}
.pc:hover{border-color:var(--ink)}
.pc b{font-size:15px;line-height:1.35;font-weight:600}
.steps{display:flex;gap:3px}.steps i{flex:1;height:5px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.pc .ft{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.kw{padding:2px 8px;border-radius:6px;background:var(--lime-soft);color:var(--lime-deep);font-weight:600}

.res{display:grid;gap:8px}
.rr{display:grid;gap:10px;padding:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px}
.rr:hover{border-color:var(--ink)}
.rt{display:block;margin-top:4px;font-size:15px;font-weight:600;line-height:1.3}
.bar2{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.bar2 i{display:block;height:100%;border-radius:3px;background:var(--c)}
.ms{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--mute)}.ms b{color:var(--ink);font-variant-numeric:tabular-nums}
@media(min-width:900px){.rr{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;align-items:center;gap:28px}}

.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,10,10,.45);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;z-index:71;left:0;right:0;bottom:0;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;padding:10px 20px calc(28px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow);transform:translateY(105%);visibility:hidden;transition:transform .3s var(--ease),visibility .3s}
.sheet.on{transform:none;visibility:visible}
.grab{width:40px;height:4px;margin:0 auto 12px;border-radius:2px;background:var(--faint);opacity:.4}
.shtop{display:flex;align-items:center;justify-content:space-between}
.shtop .mt{font-size:13px}
.x{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--soft)}
.sheet h2{margin:14px 0 12px;font:700 28px/1.1 var(--disp);letter-spacing:-.03em}
.sheet h5{margin:24px 0 8px;font-size:13px;font-weight:600;color:var(--mute)}
.kv{display:grid;gap:14px;margin:18px 0 0}
.kv dt{font-size:12px;color:var(--mute)}.kv dd{margin:2px 0 0;font-size:14.5px;font-weight:600}
.cap,.note{margin:0;padding:14px;border-radius:14px;background:var(--soft);font-size:14.5px;line-height:1.55}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mg div{padding:10px 12px;border-radius:12px;background:var(--soft)}
.mg b{display:block;font:700 20px var(--disp);letter-spacing:-.02em}.mg span{font-size:11.5px;color:var(--mute)}
.sheet .fine{margin:10px 0 0;text-align:left}
.stp{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stp div{font-size:11.5px;font-weight:600;color:var(--faint)}
.stp i{display:block;height:5px;margin-bottom:6px;border-radius:2px;background:var(--line)}
.stp .on{color:var(--ink)}.stp .on i{background:var(--ink)}.stp .cur i{background:var(--lime);box-shadow:0 0 0 1px var(--lime-deep)}
@media(min-width:900px){.sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;padding:28px 28px 36px;border-radius:24px 0 0 24px;transform:translateX(105%)}.grab{display:none}}
.cell:active{background:var(--soft)}
@media(max-width:899px){.panel{display:none}}
.dsheet{display:flex;flex-direction:column;padding:0;overflow:hidden;min-height:62vh;min-height:62dvh;max-height:88vh;max-height:88dvh;touch-action:pan-y;transition:transform .5s cubic-bezier(.32,.72,0,1),visibility .5s}
.dtop{flex:none;padding:10px 20px 14px;background:var(--card);border-bottom:1px solid var(--line);touch-action:none}
.dhd{display:flex;align-items:center;gap:8px}
.dtt{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.dtt>b{font:700 52px/.9 var(--disp);letter-spacing:-.05em}
.dtt div{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.dtt strong{font-size:16px}.dtt span{font-size:13px;color:var(--mute)}
.dhd .ib{height:38px;min-width:38px;padding:0}
.dsum{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px));--dx:0px}
.gon{--dx:30px}.gop{--dx:-30px}.first{--b:160ms}
.dc{margin-top:12px;padding:14px 14px 14px 18px;border-radius:18px;background:var(--soft);box-shadow:inset 4px 0 0 var(--c);animation:dcin .5s var(--ease) both;animation-delay:calc(var(--i)*40ms + var(--b,0ms))}
@keyframes dcin{from{opacity:0;transform:translate(var(--dx),14px)}}
.dct{display:flex;align-items:center;justify-content:space-between}
.dct time{font:700 22px var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dc .mt{margin-top:8px}
.dc h3{margin:6px 0 0;font:600 17px/1.3 var(--ui)}
.dc .cap{margin:10px 0 0;padding:0;background:none;font-size:14px;line-height:1.55;color:var(--mute)}

.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0 0}
.dl dt{font-size:11.5px;color:var(--mute)}.dl dd{margin:1px 0 0;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.dc .mg{margin-top:12px}.dc .mg div{background:var(--card)}
.dc .fine{margin:8px 0 0;text-align:left}
.dsum .now{margin:0}
@media(min-width:900px){.dsheet{min-height:0;touch-action:auto}}

.cell.gap{background:repeating-linear-gradient(-45deg,transparent,transparent 6px,var(--line) 6px,var(--line) 7px)}
@media(min-width:900px){.cell.gap .cnt{display:block}}
.t-early{background:var(--soft);color:var(--mute)}
.t-early::before{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.t-wait{border:1px solid var(--line);color:var(--mute)}
.t-wait::before{background:var(--faint)}
.snaps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 0}
.snaps div{padding:10px 10px 12px;border-radius:12px;background:var(--soft)}
.snaps b{display:block;font:700 18px var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.snaps span{display:block;font-size:11.5px;color:var(--mute)}
.snaps em{display:block;margin-top:4px;font-style:normal;font-size:10.5px;color:var(--faint)}
.snaps .d7{box-shadow:inset 0 0 0 1.5px var(--lime-deep);background:var(--lime-soft)}
.snaps .empty b{color:var(--faint);font-weight:600}
.cw .rr{align-items:start}
.cw .ms{margin-top:6px}
.kw[data-id]{cursor:pointer;border:0;font:inherit}
@media(max-width:699px){.snaps{grid-template-columns:repeat(2,minmax(0,1fr))}}

<!--CAL_DATA-->
<script>
(()=>{
const TZ='Asia/Karachi';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PN={FB:'Facebook',IG:'Instagram',TikTok:'TikTok'};
const ST={scheduled:'Scheduled',draft:'Waiting for slot',posted:'Posted',idea:'Idea',script:'Script',voice:'Voice',render:'Render'};
const STEPS=['idea','script','voice','render','scheduled'];
const GN={'meta-ads':'Meta ads reels','case-study':'Case studies',automation:'Automation',course:'Course'};
const ML={impressions:'Impressions',views:'Views',reach:'Reach',reactions:'Reactions',comments:'Comments',shares:'Shares',clicks:'Clicks',saves:'Saves',engagementRate:'Engagement',averageTimeWatched:'Avg. watch (s)',totalTimeWatched:'Watch time'};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const U=s=>{const a=String(s).split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2],12))};
const add=(d,n)=>new Date(d.getTime()+n*864e5);
const mon=d=>add(d,-((d.getUTCDay()+6)%7));
const fmt=(d,o)=>new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:'UTC'},o)).format(d);
const num=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const cmp=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1});
const today=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const CH=d=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const X='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 3 10 10M13 3 3 13"/></svg>';

function fail(msg){
  $('#app').innerHTML=`<div class="empty"><b>Could not load the calendar</b><span>${esc(msg)}</span></div>`;
}
function loadData(){
  if(window.__CAL_DATA__) return Promise.resolve(window.__CAL_DATA__);
  return fetch('data.json',{cache:'no-store'}).then(r=>{
    if(!r.ok) throw new Error('Could not load data.json ('+r.status+')');
    return r.json();
  });
}

function primary(i, metrics){
  const m=metrics||{};
  if(i.platform==='FB' && m.impressions!=null && m.impressions!=='') return {key:'impressions',value:m.impressions};
  if(m.views!=null && m.views!=='') return {key:'views',value:m.views};
  if(m.impressions!=null && m.impressions!=='') return {key:'impressions',value:m.impressions};
  return null;
}
function postedDate(i){return i.sent_date||i.date}
function ageOf(i){
  const d=postedDate(i);
  if(!d) return null;
  return Math.round((U(today)-U(d))/864e5);
}
function isEarly(i){const a=ageOf(i);return a!=null && a<7}
function cp(i,day){const c=i.checkpoints||{};return c[day]||c[String(day)]||null}
function day7(i){
  if(i.day7 && i.day7.value!=null) return i.day7;
  const c=cp(i,7);
  if(!c) return null;
  const s=primary(i,c.metrics);
  return s?Object.assign({captured_at:c.captured_at,captured_date:c.captured_date,age_days:c.age_days},s):null;
}

function boot(D){
const ALL=D.items.concat((D.pipeline||[]).map(p=>Object.assign({pipe:1},p)));
const byId=new Map(ALL.map(i=>[i.id,i]));
const ds=ALL.map(i=>i.date).filter(Boolean).sort();
const sel0=!ds.length?today:(today<ds[0]?ds[0]:today>ds[ds.length-1]?ds[ds.length-1]:today);
const S={tab:'cal',view:'month',sel:sel0,cur:U(sel0),pf:{FB:1,IG:1,TikTok:1}};
let first=true,lastFocus=null;

const on=i=>(i.platforms||[i.platform]).some(p=>S.pf[p]);
const dayItems=d=>ALL.filter(i=>i.date===d&&on(i)).sort((a,b)=>(a.pipe||0)-(b.pipe||0)||(a.time||'').localeCompare(b.time||'')||(a.title||'').localeCompare(b.title||''));
const col=i=>i.pipe?'var(--lime)':i.platform==='TikTok'?'var(--tt)':'var(--'+String(i.platform||'tt').toLowerCase()+')';
const kc=i=>i.pipe?'pl':i.status==='draft'?'w':i.status==='posted'?'po':'';
const tag=s=>`<span class="tag t-${s}">${ST[s]||s}</span>`;
const pd=i=>`<i class="pd ${i.pipe?'all':i.platform}"></i>`;

const chips=()=>Object.keys(PN).map(p=>`<button class="pf" data-pf="${p}" aria-pressed="${!!S.pf[p]}"><i class="pd ${p}"></i><span class="s">${p}</span><span class="l">${PN[p]}</span></button>`).join('');
const pill=x=>`<span class="pill ${kc(x)}" style="--c:${col(x)}">${x.time?`<em>${esc(x.time)}</em>`:''}<b>${esc(x.title)}</b></span>`;
const item=x=>`<button class="it ${kc(x)}" data-id="${esc(x.id)}"><time>${x.time||'Plan'}</time><span class="bx" style="--c:${col(x)}"><span class="mt">${pd(x)}${x.pipe?'All platforms':PN[x.platform]}${tag(x.status)}</span><b>${esc(x.title)}</b>${x.caption_gist?`<small>${esc(x.caption_gist)}</small>`:''}</span></button>`;

function board(solo,T){
  const c=D.counts||{};
  const q=(D.channels||[]).map(ch=>{const p=ch.platform,u=(c.scheduled_by_platform||{})[p]||0,w=(c.draft_waiting_slot_by_platform||{})[p]||0;
    return `<div class="q"><span><i class="pd ${p}"></i>${PN[p]}</span><div class="meter" style="--c:${col({platform:p})};--w:${u*10}%"></div><small>${u>=10?'Queue full':u+'/10 queued'}${w?`, ${w} waiting`:''}</small></div>`}).join('');
  const N=T||[[c.scheduled||0,'Scheduled'],[c.draft_waiting_slot||0,'Waiting'],[c.posted||0,'Posted'],[c.pipeline||0,'Pipeline']];
  return `<section class="board${solo?' solo':''}"><div class="nums">${N.map(n=>`<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}</div>${solo?'':`<div class="queue">${q}</div>`}</section>`;
}
function month(){
  const f=new Date(Date.UTC(S.cur.getUTCFullYear(),S.cur.getUTCMonth(),1,12)),e=new Date(Date.UTC(f.getUTCFullYear(),f.getUTCMonth()+1,0,12));
  const s=mon(f),n=Math.ceil(((e-s)/864e5+1)/7)*7;
  let h='<div class="dow">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="grid">';
  for(let k=0;k<n;k++){
    const dt=add(s,k),d=ymd(dt),l=dayItems(d),out=dt.getUTCMonth()!==f.getUTCMonth(),gap=!out&&!l.length;
    h+=`<button class="cell${out?' out':''}${d===today?' today':''}${d===S.sel?' sel':''}${gap?' gap':''}${first?' in':''}" style="--i:${k}" data-d="${d}" aria-pressed="${d===S.sel}" aria-label="${fmt(dt,{day:'numeric',month:'long'})}, ${l.length} items${gap?', gap':''}"><span class="top"><span class="d">${dt.getUTCDate()}</span>${l.length?`<span class="cnt">${l.length}</span>`:(gap?`<span class="cnt">Gap</span>`:'')}</span><span class="dots">${l.slice(0,8).map(x=>`<i class="${kc(x)}" style="--c:${col(x)}"></i>`).join('')}</span><span class="pills">${l.slice(0,3).map(pill).join('')}${l.length>3?`<span class="more">+${l.length-3} more</span>`:''}</span></button>`;
  }
  return h+'</div><div class="lg"><span><i></i>Scheduled</span><span><i class="po"></i>Posted</span><span><i class="w"></i>Waiting for slot</span><span><i class="pl"></i>Pipeline</span><span>Hatched days are gaps — nothing scheduled or reserved</span></div>';
}
function week(){
  const s=mon(S.cur);let h='<div class="week">';
  for(let k=0;k<7;k++){const dt=add(s,k),d=ymd(dt),l=dayItems(d);
    h+=`<section class="wd${d===today?' today':''}"><header><b>${dt.getUTCDate()}</b><span>${fmt(dt,{weekday:'short'})}</span></header>${l.length?l.map(item).join(''):'<p class="none">Gap — nothing planned</p>'}</section>`}
  return h+'</div>';
}
function panel(){
  const d=S.sel,l=dayItems(d),dt=U(d);
  const c=(k,w)=>{const n=l.filter(x=>x.pipe?k==='pipe':x.status===k).length;return n?n+' '+w:''};
  const sum=[c('posted','posted'),c('scheduled','scheduled'),c('draft','waiting'),c('pipe','in pipeline')].filter(Boolean).join(', ');
  return `<div class="dh"><b>${dt.getUTCDate()}</b><div><strong>${fmt(dt,{weekday:'long'})}</strong><span>${fmt(dt,{month:'long',year:'numeric'})}</span></div>${d===today?'<em class="now">Today</em>':''}</div>`+
    (l.length?`<p class="sum">${sum}</p>`+l.map(item).join(''):'<div class="empty"><b>Gap</b><span>No posts or pipeline items on this day.</span></div>');
}
function calTab(){
  const wk=S.view==='week',s=mon(S.cur),e=add(s,6);
  const title=wk?fmt(s,{day:'numeric',month:'short'})+' – '+fmt(e,{day:'numeric',month:'short',year:'numeric'}):fmt(S.cur,{month:'long',year:'numeric'});
  return `<div class="tab">${board()}<div class="bar"><h1>${title}</h1><div class="nav"><button class="ib" data-nav="-1" aria-label="Previous">${CH('M10 3 5 8l5 5')}</button><button class="ib" data-nav="0">Today</button><button class="ib" data-nav="1" aria-label="Next">${CH('m6 3 5 5-5 5')}</button></div><div class="opts"><div class="seg" role="group" aria-label="View"><button data-view="month" aria-pressed="${!wk}">Month</button><button data-view="week" aria-pressed="${wk}">Week</button></div>${chips()}</div></div><div class="layout${wk?' wk':''}">${wk?week():`<div class="cal">${month()}</div>`}<aside class="panel" id="panel" aria-live="polite">${panel()}</aside></div></div>`;
}
function pcard(p){
  const k=STEPS.indexOf(p.status);
  const step=k<0?0:k;
  return `<button class="pc" data-id="${esc(p.id)}"><span class="mt">${p.date?fmt(U(p.date),{weekday:'short',day:'numeric',month:'short'}):'No date yet'}${tag(p.status)}</span><b>${esc(p.title)}</b><span class="steps">${STEPS.map((s,j)=>`<i class="${j<=step?'on':''}"></i>`).join('')}</span><span class="ft"><span>Step ${step+1} of 5</span>${p.keyword_cta?`<span class="kw">${esc(p.keyword_cta)}</span>`:''}</span></button>`;
}
function clientWork(){
  const cases=(D.pipeline||[]).filter(p=>p.group==='case-study');
  const lastPipe=(D.pipeline||[]).map(p=>p.date).filter(Boolean).sort().slice(-1)[0];
  const start=mon(U('2026-10-26'));
  const end=add(mon(U(lastPipe||'2026-11-22')),20);
  let rows='';
  for(let w=start;w<=end;w=add(w,7)){
    const a=ymd(w),b=ymd(add(w,6));
    const inW=d=>d&&d>=a&&d<=b;
    const meta=(D.pipeline||[]).filter(p=>p.group==='meta-ads'&&inW(p.date)&&on(p));
    const cs=cases.filter(p=>inW(p.date)&&on(p));
    const hasCal=(D.items||[]).some(i=>inW(i.date)&&on(i));
    let hint,tags='';
    if(meta.length){
      hint='Meta ads block: '+meta.map(p=>p.id).join(', ')+'. Case studies are not assigned to this week yet.';
      tags=meta.map(p=>`<button type="button" class="kw" data-id="${esc(p.id)}">${esc(p.id)}</button>`).join(' ');
    }else if(cs.length){
      hint='Case-study reels planned this week.';
      tags=cs.map(p=>`<button type="button" class="kw" data-id="${esc(p.id)}">${esc(p.title)}</button>`).join(' ');
    }else if(hasCal){
      hint='Feed posts this week. No case study is assigned yet.';
    }else if(b<today){
      hint='No client-work case study ran this week.';
    }else{
      hint='Open week — a case-study reel could go here after the Meta ads block.';
    }
    rows+=`<article class="rr"><span><span class="rt">${esc(fmt(w,{day:'numeric',month:'short'})+' – '+fmt(add(w,6),{day:'numeric',month:'short',year:'numeric'}))}</span><span class="ms">${esc(hint)}</span>${tags?`<span class="ms">${tags}</span>`:''}</span></article>`;
  }
  return `<section class="grp cw"><header><h3>Client-work weeks</h3><span>Planning row for case studies and before/after work. The four case-study reels are at script stage and have no post day yet.</span></header><div class="res">${rows}</div></section>`;
}
function pipeTab(){
  const P=(D.pipeline||[]).filter(on);
  const body=Object.keys(GN).map(k=>{const l=P.filter(p=>p.group===k);if(!l.length)return'';
    const z=l.map(x=>x.date).filter(Boolean).sort();
    const sub=z.length?'slots held '+fmt(U(z[0]),{day:'numeric',month:'short'})+' to '+fmt(U(z[z.length-1]),{day:'numeric',month:'short'}):'no dates yet';
    return `<section class="grp"><header><h3>${GN[k]}</h3><span>${l.length} ${l.length===1?'piece':'pieces'}, ${sub}</span></header><div class="pg">${l.map(pcard).join('')}</div></section>`}).join('');
  return `<div class="tab"><div><h1 class="ph">Pipeline</h1><p class="psub">${P.length} pieces on their way to a slot. Stages run Idea, Script, Voice, Render, Scheduled. 16–20 Nov stay reserved for the Meta ads reels R1–R5.</p></div><div class="opts">${chips()}</div>${body}${clientWork()}</div>`;
}
function statusRow(i){
  if(isEarly(i)) return `<span class="tag t-early">Too early</span>`;
  if(!day7(i)) return `<span class="tag t-wait">Day-7 metrics not in yet</span>`;
  return `<span class="tag t-posted">Day 7</span>`;
}
function resTab(){
  const P=(D.items||[]).filter(i=>i.status==='posted'&&on(i));
  const ranked=[], early=[], waiting=[];
  P.forEach(i=>{
    if(isEarly(i)) early.push(i);
    else if(day7(i)) ranked.push(i);
    else waiting.push(i);
  });
  ranked.sort((a,b)=>day7(b).value-day7(a).value || (b.date+b.time).localeCompare(a.date+a.time));
  early.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  waiting.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const mx=Math.max(1,...ranked.map(i=>day7(i).value));
  const T=[[ranked.length,'Ranked (Day 7)'],[early.length,'Too early'],[waiting.length,'Awaiting Day 7'],[P.length,'Posted']];
  const row=(i,mode)=>{
    const d7=day7(i);
    const metric=mode==='rank'&&d7?`<span><b>${num(d7.value)}</b> Day-7 ${d7.key}</span>`:'';
    const bar=mode==='rank'&&d7?`<span class="bar2" style="--c:${col(i)}"><i style="width:${Math.max(2,d7.value/mx*100)}%"></i></span>`:'<span></span>';
    return `<button class="rr" data-id="${esc(i.id)}"><span><span class="mt">${pd(i)}${PN[i.platform]}, ${fmt(U(i.date),{day:'numeric',month:'short'})}</span><span class="rt">${esc(i.title)}</span></span>${bar}<span class="ms">${statusRow(i)}${metric}</span></button>`;
  };
  const block=(title,note,list,mode)=>!list.length?'':`<section class="grp"><header><h3>${esc(title)}</h3><span>${esc(note)}</span></header><div class="res">${list.map(i=>row(i,mode)).join('')}</div></section>`;
  return `<div class="tab"><div><h1 class="ph">Results</h1><p class="psub">Ranking uses only each post’s Day-7 score. Posts younger than 7 days are labelled too early. Snapshots are real Buffer values; missed earlier windows stay empty.</p></div><div class="opts">${chips()}</div>${board(1,T)}${block('Ranked by Day-7 score','Only posts with a Day-7 checkpoint. Facebook uses impressions; Instagram and TikTok use views.',ranked,'rank')}${block('Too early','Posted less than 7 days ago, so they are not ranked yet.',early,'early')}${block('Awaiting a Day-7 snapshot','These posts are 7 days or older, but Buffer has not given a pull on or after day 7 yet.',waiting,'wait')}</div>`;
}
function render(f){
  $('#app').innerHTML=S.tab==='cal'?calTab():S.tab==='pipe'?pipeTab():resTab();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
  first=false;if(f){const el=$(f);if(el)el.focus({preventScroll:true})}
}
function nav(n){
  if(n===0){S.sel=today;S.cur=U(today)}
  else if(S.view==='week'){S.cur=add(S.cur,7*n);S.sel=ymd(S.cur)}
  else{const c=S.cur,f=new Date(Date.UTC(c.getUTCFullYear(),c.getUTCMonth()+n,1,12));S.cur=f;S.sel=ymd(f).slice(0,7)===today.slice(0,7)?today:ymd(f)}
  render('[data-nav="'+n+'"]');
}
const sumChips=l=>{const c=f=>l.filter(f).length;return [[c(x=>x.status==='posted'),'posted','posted'],[c(x=>x.status==='scheduled'),'scheduled','scheduled'],[c(x=>x.status==='draft'),'waiting','draft'],[c(x=>x.pipe),'in pipeline','render']].filter(r=>r[0]).map(r=>`<span class="tag t-${r[2]}">${r[0]} ${r[1]}</span>`).join('')};

function snapBlock(x){
  const days=[1,3,7,30];
  const has=days.some(d=>cp(x,d));
  if(!has && !x.metrics) return '';
  const cells=days.map(d=>{
    const c=cp(x,d);
    if(!c) return `<div class="empty"><b>—</b><span>Day ${d}</span></div>`;
    const s=primary(x,c.metrics);
    const val=s?num(s.value)+(s.key==='engagementRate'?'%':''):'Recorded';
    return `<div class="${d===7?'d7':''}"><b>${val}</b><span>Day ${d}${s?' · '+s.key:''}</span><em>${esc(c.captured_at||'')}${c.age_days!=null?' · age '+c.age_days+'d':''}</em></div>`;
  }).join('');
  return `<h5>Day snapshots</h5><div class="snaps">${cells}</div><p class="fine">A checkpoint is the first Buffer pull on or after that day, kept only as the highest day it has reached. Ranking uses the Day-7 score only.</p>`;
}
function latestMetrics(x){
  const m=x.metrics||{},mk=Object.keys(ML).filter(q=>m[q]!=null&&m[q]!=='');
  if(!mk.length) return x.status==='posted'?`<h5>Latest Buffer metrics</h5><p class="fine">No metrics from Buffer at pull time.</p>`:'';
  return `<h5>Latest Buffer metrics</h5><div class="mg">${mk.map(q=>`<div><b>${num(m[q])}${q==='engagementRate'?'%':''}</b><span>${ML[q]}</span></div>`).join('')}</div>${m.metricsUpdatedAt_pkt?`<p class="fine">Metrics updated ${esc(m.metricsUpdatedAt_pkt)}</p>`:''}`;
}
function dcard(x,k){
  const ch=(D.channels||[]).find(c=>c.platform===x.platform),s=STEPS.indexOf(x.status);
  const rows=[!x.pipe&&ch&&['Channel',ch.name],x.file_name&&[x.pipe?'Script file':'Video file',x.file_name],x.keyword_cta&&['Auto-DM keyword',x.keyword_cta]].filter(Boolean);
  const early=x.status==='posted'?statusRow(x):'';
  return `<article class="dc" style="--c:${col(x)};--i:${k}"><div class="dct"><time>${x.time||'Plan'}</time>${tag(x.status)}${early?' '+early:''}</div><div class="mt">${pd(x)}${x.pipe?(x.platforms||[]).map(p=>PN[p]).join(', '):PN[x.platform]}</div><h3>${esc(x.title)}</h3>${x.caption_gist?`<p class="cap">${esc(x.caption_gist)}</p>`:''}${x.pipe?`<span class="steps">${STEPS.map((t,j)=>`<i class="${j<=s?'on':''}"></i>`).join('')}</span><small>Step ${s+1} of 5</small>`:''}${x.notes?`<p class="note">${esc(x.notes)}</p>`:''}${rows.length?`<dl class="dl">${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>`:''}${x.status==='posted'?snapBlock(x)+latestMetrics(x):''}</article>`;
}
function paintDay(dir){
  const dt=U(S.sel),l=dayItems(S.sel);
  $('#dsheet').innerHTML=`<div class="dtop"><div class="grab"></div><div class="dhd"><div class="dtt"><b>${dt.getUTCDate()}</b><div><strong>${fmt(dt,{weekday:'long'})}</strong><span>${fmt(dt,{month:'long',year:'numeric'})}</span></div></div><button class="ib" data-step="-1" aria-label="Previous day">${CH('M10 3 5 8l5 5')}</button><button class="ib" data-step="1" aria-label="Next day">${CH('m6 3 5 5-5 5')}</button><button class="x" data-close aria-label="Close">${X}</button></div><div class="dsum">${S.sel===today?'<em class="now">Today</em>':''}${l.length?sumChips(l):'<span class="tag t-draft">Gap — nothing planned</span>'}</div></div><div class="dbody ${dir===0?'first':dir>0?'gon':'gop'}" id="dbody">${l.length?l.map(dcard).join(''):'<div class="empty"><b>Open day</b><span>No posts or pipeline items are planned for this day.</span></div>'}</div>`;
}
function step(n){
  S.sel=ymd(add(U(S.sel),n));S.cur=U(S.sel);render();paintDay(n);
  const b=$('#dsheet [data-step="'+n+'"]');if(b)b.focus({preventScroll:true});
}
function openDay(){
  paintDay(0);lastFocus=document.activeElement;
  $('#scrim').classList.add('on');$('#dsheet').classList.add('on');document.documentElement.style.overflow='hidden';
}
function open(id){
  const i=byId.get(id);if(!i)return;
  const ch=(D.channels||[]).find(c=>c.platform===i.platform);
  const when=i.date?fmt(U(i.date),{weekday:'long',day:'numeric',month:'long'})+(i.time?', '+i.time+' PKT':''):'No date yet';
  const kv=[[i.pipe?'Platforms':'Channel',i.pipe?(i.platforms||[]).map(p=>PN[p]).join(', '):(ch?ch.name:PN[i.platform])],[i.status==='posted'?'Posted':'When',when],i.file_name&&[i.pipe?'Script file':'Video file',i.file_name],i.keyword_cta&&['Auto-DM keyword',i.keyword_cta]].filter(Boolean);
  const k=STEPS.indexOf(i.status);
  $('#sheet').innerHTML=`<div class="grab"></div><div class="shtop"><span class="mt">${pd(i)}${i.pipe?'All platforms':PN[i.platform]}</span><button class="x" data-close aria-label="Close">${X}</button></div><h2 id="st">${esc(i.title)}</h2>${tag(i.status)}${i.status==='posted'?' '+statusRow(i):''}`+
   (i.pipe?`<h5>Progress</h5><div class="stp">${STEPS.map((s,j)=>`<div class="${j<=k?'on':''}${j===k?' cur':''}"><i></i>${ST[s]}</div>`).join('')}</div>`:'')+
   `<dl class="kv">${kv.map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>`+
   (i.caption_gist?`<h5>Caption preview</h5><p class="cap">${esc(i.caption_gist)}</p>`:'')+
   (i.notes?`<h5>Notes</h5><p class="note">${esc(i.notes)}</p>`:'')+
   (i.status==='posted'?snapBlock(i)+latestMetrics(i):'');
  lastFocus=document.activeElement;
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');document.documentElement.style.overflow='hidden';
  $('#sheet').scrollTop=0;$('#sheet .x').focus({preventScroll:true});
}
function close(){
  const a=$('#sheet'),b=$('#dsheet');
  if(!a.classList.contains('on')&&!b.classList.contains('on'))return;
  b.style.transform='';$('#scrim').style.opacity='';
  $('#scrim').classList.remove('on');a.classList.remove('on');b.classList.remove('on');document.documentElement.style.overflow='';
  const f=lastFocus&&document.contains(lastFocus)?lastFocus:$('[data-d="'+S.sel+'"]');if(f)f.focus({preventScroll:true});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){close();S.tab=d.tab;render();scrollTo(0,0)}
  else if(d.view){S.view=d.view;render('[data-view="'+d.view+'"]')}
  else if(d.pf){const p=d.pf;if(S.pf[p]&&Object.values(S.pf).filter(Boolean).length<2)return;S.pf[p]=S.pf[p]?0:1;render('[data-pf="'+p+'"]')}
  else if(d.nav!=null)nav(+d.nav);
  else if(d.d){S.sel=d.d;S.cur=U(d.d);render('[data-d="'+d.d+'"]');if(innerWidth<900)openDay()}
  else if(d.step)step(+d.step);
  else if(d.id)open(d.id);
  else if('close' in d)close();
});
$('#scrim').addEventListener('click',close);
addEventListener('keydown',e=>{
  if(e.key==='Escape')close();
  else if($('#dsheet').classList.contains('on')&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))step(e.key==='ArrowLeft'?-1:1);
});
(()=>{
  const s=$('#dsheet'),sc=$('#scrim');let y0=0,x0=0,t0=0,dy=0,mode=null,top=false;
  s.addEventListener('touchstart',e=>{const t=e.touches[0],bd=$('#dbody');y0=t.clientY;x0=t.clientX;t0=Date.now();dy=0;mode=null;top=!bd||bd.scrollTop<=0||!bd.contains(e.target)},{passive:true});
  s.addEventListener('touchmove',e=>{
    const t=e.touches[0],ay=t.clientY-y0,ax=t.clientX-x0;
    if(!mode){if(Math.abs(ay)<8&&Math.abs(ax)<8)return;mode=Math.abs(ax)>Math.abs(ay)*1.4?'x':(ay>0&&top?'y':'n')}
    if(mode==='y'){e.preventDefault();dy=Math.max(0,ay);s.style.transition='none';s.style.transform='translateY('+dy+'px)';sc.style.opacity=Math.max(0,1-dy/(s.offsetHeight*.9))}
  },{passive:false});
  s.addEventListener('touchend',e=>{
    if(mode==='y'){const v=dy/Math.max(1,Date.now()-t0);s.style.transition='';if(dy>110||v>.6)close();else{s.style.transform='';sc.style.opacity=''}}
    else if(mode==='x'){const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)step(dx<0?1:-1)}
    mode=null;dy=0;
  });
})();
const u=(D.meta&&D.meta.generated_at||'').match(/(\d{4}-\d\d-\d\d) (\d\d:\d\d)/);
$('#upd').innerHTML=u?`<b>Updated</b>${fmt(U(u[1]),{day:'numeric',month:'short'})}, ${u[2]} PKT`:'';
render();
}

loadData().then(boot).catch(err=>fail(err.message||String(err)));
})();
</script>
