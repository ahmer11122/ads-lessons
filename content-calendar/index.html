<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Content calendar — Smart Solutions</title>
<meta name="description" content="Smart Solutions content calendar: scheduled, pipeline and posted work across Facebook, Instagram and TikTok. Times in PKT.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="smart-solutions-s-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens and base styles follow the Ads Teacher lesson shell (light, Inter, lime fill only in the brand chrome). */
:root{
  --background:#F8F8F6;--surface:#F1F1ED;--card:#FFFFFF;
  --ink:#0D0D0D;--primary:#1A1A1A;--primary-fg:#FFFFFF;
  --muted:#EDEDEA;--muted-fg:#595959;
  --lime:#C4F236;--lime-soft:#F0FBD0;--lime-ink:#0D0D0D;
  --accent:var(--lime);--accent-fg:var(--lime-ink);
  --rule:#C4C4BE;--hair:rgba(13,13,13,.09);--border:var(--rule);
  --ok:#1D7A46;--ok-soft:#E7F5EC;--bad:#B3261E;--bad-soft:#FCECEA;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:var(--background);--line:var(--hair);--mute:var(--muted-fg);--faint:#6B6B6B;
  --r:16px;--shadow:none;--ease:cubic-bezier(.2,.7,.2,1);
  --fb:#1877F2;--fb-soft:#E8F1FD;
  --ig:#C13584;--ig-soft:#F9E8F1;
  --tt:#111111;--tt-soft:#ECECEC;--tt-accent:#25F4EE;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--ink);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
a{color:var(--ink);text-decoration:underline;text-decoration-color:#8FB51A;text-decoration-thickness:2px;text-underline-offset:3px}
b,strong{font-weight:700}
[hidden]{display:none!important}
::selection{background:var(--lime)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 20px}
.logo{display:inline-flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:var(--ink)}
.logo img{width:28px;height:28px;display:block}
.logo b{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.ctr{flex:none;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted-fg);white-space:nowrap}
.ctr strong{color:var(--ink);font-weight:700}
.grow{flex:1;min-width:0}
.updated{font-size:12.5px;color:var(--muted-fg);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.updated b{display:block;color:var(--ink);font-weight:600}
@media(max-width:639px){.logo b{display:none}.updated{font-size:11.5px}}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px 96px}
@media(min-width:640px){.wrap{padding:0 32px 128px}}

.hero{padding-top:32px}
@media(min-width:640px){.hero{padding-top:48px}}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;line-height:1.4;color:var(--ink);background:var(--lime);border-radius:8px;padding:4px 12px}
h1{margin:16px 0 0;font-size:clamp(28px,5vw,44px);line-height:1.1;letter-spacing:-.03em;font-weight:700;color:var(--ink);text-wrap:balance}
.lead{margin:12px 0 0;font-size:15.5px;color:var(--muted-fg);max-width:44rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:24px 0 0;padding:0;list-style:none}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.stats li{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px 16px}
.stats b{display:block;font-size:28px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:6px;font-size:13px;color:var(--muted-fg);font-weight:500}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:28px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:2px}
.seg button{font-size:13px;font-weight:600;border:0;background:none;color:var(--muted-fg);border-radius:8px;padding:0 14px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mbtn{font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:0 14px;min-height:36px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.mbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mbtn .dot{width:8px;height:8px;border-radius:99px;flex:none}
.mbtn[data-p="FB"] .dot{background:var(--fb)}
.mbtn[data-p="IG"] .dot{background:var(--ig)}
.mbtn[data-p="TikTok"] .dot{background:var(--tt);box-shadow:0 0 0 2px var(--tt-accent)}
.navrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.navrow h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:12rem}
.iconbtn{width:36px;height:36px;border:1px solid var(--rule);background:var(--card);border-radius:8px;display:grid;place-items:center;font-size:16px;line-height:1}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:12.5px;color:var(--muted-fg)}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:1;border-radius:999px;padding:4px 8px;border:1px solid var(--hair);background:var(--muted);color:var(--ink);white-space:nowrap}
.chip.idea{background:var(--muted);color:var(--muted-fg)}
.chip.script{background:var(--surface);border-color:var(--rule)}
.chip.voice{background:var(--lime-soft);border-color:transparent}
.chip.render{background:var(--lime);border-color:transparent}
.chip.scheduled{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.draft{background:var(--card);border-style:dashed;border-color:var(--rule);color:var(--muted-fg)}
.chip.posted{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.gap{background:var(--surface);border-style:dashed;color:var(--muted-fg)}

/* Calendar */
.cal{margin-top:16px;background:var(--card);border:1px solid var(--hair);border-radius:16px;overflow:auto}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--hair);background:var(--surface)}
.dow span{padding:10px 8px;font-size:12px;font-weight:600;color:var(--muted-fg);text-align:center}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:118px;border-top:1px solid var(--hair);border-left:1px solid var(--hair);padding:8px 6px 6px;display:flex;flex-direction:column;gap:4px;background:var(--card);min-width:0}
.day:nth-child(7n+1){border-left:0}
.day.out{background:var(--background);color:var(--faint)}
.day.out .num{color:var(--faint)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.gap{background:repeating-linear-gradient(-45deg,var(--surface),var(--surface) 6px,#E8E8E2 6px,#E8E8E2 7px)}
.day.gap .gaplab{font-size:10.5px;font-weight:600;color:var(--muted-fg);letter-spacing:.01em}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:4px}
.num{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:8px}
.day.today .num{background:var(--lime)}
.ecount{font-size:11px;font-weight:600;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.elist{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{display:flex;align-items:center;gap:5px;width:100%;text-align:left;border-radius:6px;padding:3px 5px;font-size:11.5px;line-height:1.25;font-weight:600;min-width:0;background:var(--surface)}
.ev .t{flex:none;font-variant-numeric:tabular-nums;font-weight:500;color:var(--muted-fg);font-size:10.5px}
.ev .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev[data-p="FB"]{background:var(--fb-soft);box-shadow:inset 3px 0 0 var(--fb)}
.ev[data-p="IG"]{background:var(--ig-soft);box-shadow:inset 3px 0 0 var(--ig)}
.ev[data-p="TikTok"]{background:var(--tt-soft);box-shadow:inset 3px 0 0 var(--tt)}
.ev.pipe{background:var(--lime-soft);box-shadow:inset 3px 0 0 var(--lime)}
.ev .meta{display:none}
.ev.draft{border:1px dashed #8A8A8A;background:#F7F7F4}
.ev:hover{filter:brightness(.97)}
.more{font-size:11.5px;font-weight:600;color:var(--muted-fg);padding:2px 4px;text-align:left;border-radius:6px}
.more:hover{color:var(--ink);background:var(--muted)}
@media(max-width:719px){
  .cal{overflow-x:auto}
  .dow,.month{min-width:640px}
  .day{min-height:96px}
}

/* Week view */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wday{border-top:1px solid var(--hair);border-left:1px solid var(--hair);padding:10px 8px 12px;min-width:0;min-height:220px;display:flex;flex-direction:column;gap:6px}
.wday:nth-child(7n+1){border-left:0}
.wday.out{background:var(--background)}
.wday.today{box-shadow:inset 0 0 0 2px var(--ink)}
.wday.gap{background:repeating-linear-gradient(-45deg,var(--surface),var(--surface) 6px,#E8E8E2 6px,#E8E8E2 7px)}
.wdname{font-size:11.5px;font-weight:600;color:var(--muted-fg)}
.wday .elist{gap:6px;flex:1}
.wday .ev{padding:7px 8px;border-radius:8px;flex-wrap:wrap;align-items:flex-start}
.wday .ev .n{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wday .ev .meta{display:block;flex-basis:100%;font-size:10.5px;font-weight:500;color:var(--muted-fg)}
@media(max-width:819px){
  .week{min-width:840px}
}

.section{padding-top:48px;margin-top:48px;border-top:1px solid var(--hair)}
.sec-head{display:flex;align-items:center;gap:12px}
.sec-num{flex:none;display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border-radius:8px;background:var(--lime);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sec-head h3{margin:0;font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.02em;min-width:0;text-wrap:balance}
.sec-body{margin-top:8px;font-size:14.5px;color:var(--muted-fg);max-width:50rem}

.lane{display:grid;gap:10px;margin-top:20px}
@media(min-width:800px){.lane.days{grid-template-columns:repeat(5,minmax(0,1fr))}}
.lcard{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;text-align:left;width:100%}
.lcard:hover{border-color:var(--rule)}
.lcard .when{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted-fg)}
.lcard h4{margin:8px 0 0;font-size:15.5px;line-height:1.35;letter-spacing:-.015em}
.lcard p{margin:8px 0 0;font-size:13.5px;color:#1F1F1F;line-height:1.5}
.plats{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.pbadge{font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:3px 7px;color:#fff}
.pbadge.FB{background:var(--fb)}
.pbadge.IG{background:var(--ig)}
.pbadge.TikTok{background:var(--tt);color:#fff;box-shadow:inset 0 -2px 0 var(--tt-accent)}
.bucket{margin-top:16px;background:var(--surface);border-radius:16px;padding:16px 16px 8px;border:1px dashed var(--rule)}
.bucket h4{margin:0 0 6px;font-size:14px}
.bucket .gnote{font-size:13px;color:var(--muted-fg);margin:0 0 12px;max-width:52rem}
.bucket + .bucket{margin-top:12px}
.grid4{display:grid;gap:10px}
@media(min-width:720px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}

.weeks-lane{display:grid;gap:10px;margin-top:20px}
.wrow{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px 18px}
.wrow .label{font-size:13px;font-weight:700}
.wrow .hint{font-size:13.5px;color:var(--muted-fg);margin-top:4px}
.wrow .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.perf{display:grid;gap:12px;margin-top:20px}
@media(min-width:880px){.perf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px;min-width:0}
.pcard h4{margin:0;display:flex;align-items:center;gap:8px;font-size:16px}
.totals{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 0 0;padding:0;list-style:none}
.totals li{font-size:12.5px;color:var(--muted-fg)}
.totals b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rank{list-style:none;margin:16px 0 0;padding:0}
.rank li{border-top:1px solid var(--hair)}
.rank button{display:flex;gap:10px;width:100%;text-align:left;padding:10px 0}
.rank .pos{flex:none;width:22px;height:22px;border-radius:6px;background:var(--lime);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.rank .ttl{font-size:14px;font-weight:600;line-height:1.3}
.rank .sub{font-size:12.5px;color:var(--muted-fg);margin-top:2px}
.note{font-size:12.5px;color:var(--muted-fg);margin-top:10px}
.empty{color:var(--muted-fg);font-size:14px;padding:12px 0}

footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--hair);color:var(--muted-fg);font-size:13px}
footer p{margin:0 0 8px;max-width:60ch}

/* Modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(13,13,13,.45);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
body.modal-on{overflow:hidden}
body.modal-on .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 24px));max-height:min(86vh,860px);overflow:auto;background:#FFFFFF;border-radius:16px;padding:24px 24px 28px;border:1px solid var(--hair);box-shadow:0 16px 48px rgba(13,13,13,.2);opacity:0;pointer-events:none;transition:opacity .16s var(--ease)}
body.modal-on .modal{opacity:1;pointer-events:auto}
.modal h3{margin:8px 0 0;font-size:22px;letter-spacing:-.02em;line-height:1.25}
.modal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.kv{display:grid;grid-template-columns:108px minmax(0,1fr);gap:8px 12px;margin-top:18px;font-size:14px}
.kv dt{color:var(--muted-fg);font-weight:500}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.metrics div{background:var(--surface);border-radius:12px;padding:10px 12px}
.metrics b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metrics span{font-size:12px;color:var(--muted-fg)}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:8px;border:1px solid var(--rule);display:grid;place-items:center;font-size:18px;background:var(--card)}
.err{margin:32px 0;padding:20px;border-radius:16px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.loading{margin:40px 0;color:var(--muted-fg)}
</style>
</head>
<body>
<header class="topbar">
  <div class="in">
    <a class="logo" href="https://ahmer11122.github.io/ads-lessons/" aria-label="Smart Solutions">
      <img src="smart-solutions-s-logo.svg" width="28" height="28" alt="">
      <b>Smart Solutions</b>
    </a>
    <span class="ctr">Content calendar</span>
    <span class="grow"></span>
    <div class="updated" id="updated">Loading…</div>
  </div>
</header>

<main class="wrap">
  <div id="app">
    <p class="loading">Loading the calendar…</p>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden></div>

<script>
(function(){
  const TZ = "Asia/Karachi";
  const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const STATUS_LABEL = {idea:"Idea",script:"Script",voice:"Voice",render:"Render",scheduled:"Scheduled",draft:"Draft",posted:"Posted"};
  const METRIC_LABEL = {
    views:"Views", reach:"Reach", impressions:"Impressions", reactions:"Reactions",
    comments:"Comments", shares:"Shares", clicks:"Clicks", saves:"Saves",
    engagementRate:"Engagement rate", averageTimeWatched:"Avg. watch (s)",
    totalTimeWatched:"Total watch time", metricsUpdatedAt_pkt:"Metrics updated"
  };
  const PLATFORM_NAME = {FB:"Facebook", IG:"Instagram", TikTok:"TikTok"};

  const state = {
    data: null,
    view: "month",
    cursor: null, // Date at noon PKT in the visible month/week
    platforms: {FB:true, IG:true, TikTok:true},
    itemsById: new Map()
  };

  const $ = (id) => document.getElementById(id);

  function todayPKT(){
    const parts = new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(new Date());
    const get = (t) => +parts.find(p => p.type===t).value;
    return new Date(Date.UTC(get("year"), get("month")-1, get("day"), 7, 0, 0)); // noon-ish PKT as UTC+5
  }
  function ymd(d){
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth()+1).padStart(2,"0");
    const day = String(d.getUTCDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function fromYMD(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(Date.UTC(y, m-1, d, 7, 0, 0));
  }
  function addDays(d, n){
    const x = new Date(d.getTime());
    x.setUTCDate(x.getUTCDate()+n);
    return x;
  }
  function startOfWeek(d){
    // Monday = 0
    const dow = (d.getUTCDay()+6)%7;
    return addDays(d, -dow);
  }
  function startOfMonth(d){
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1, 7, 0, 0));
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }
  function fmtNum(n){
    if (n==null || n==="") return "—";
    if (typeof n === "number"){
      if (!isFinite(n)) return "—";
      if (Number.isInteger(n)) return n.toLocaleString("en-PK");
      return n.toLocaleString("en-PK", {maximumFractionDigits:2});
    }
    return escapeHtml(String(n));
  }
  function hasMetric(m, key){
    return m && Object.prototype.hasOwnProperty.call(m, key) && m[key] !== null && m[key] !== undefined && m[key] !== "";
  }
  function platformOn(item){
    const plats = item.platforms && item.platforms.length ? item.platforms : (item.platform ? [item.platform] : []);
    if (!plats.length) return true;
    return plats.some(p => state.platforms[p]);
  }
  function visibleItems(list){
    return (list||[]).filter(platformOn);
  }
  function statusChip(status){
    const label = STATUS_LABEL[status] || status;
    return `<span class="chip ${escapeHtml(status||"")}">${escapeHtml(label)}</span>`;
  }
  function badges(platforms){
    return (platforms||[]).map(p => `<span class="pbadge ${escapeHtml(p)}">${escapeHtml(p)}</span>`).join("");
  }

  async function boot(){
    try{
      const res = await fetch("data.json", {cache:"no-store"});
      if (!res.ok) throw new Error("Could not load data.json ("+res.status+")");
      const data = await res.json();
      state.data = data;
      (data.items||[]).forEach(it => state.itemsById.set(it.id, it));
      (data.pipeline||[]).forEach(it => state.itemsById.set(it.id, it));
      const today = todayPKT();
      // Default to the month that holds today, or November 2026 if that's where the data lives.
      state.cursor = today;
      $("updated").innerHTML = `<b>Last updated</b>${escapeHtml(data.meta.generated_at || "—")}`;
      render();
    }catch(err){
      $("app").innerHTML = `<div class="err">The calendar data could not be loaded. ${escapeHtml(err.message)}</div>`;
      $("updated").textContent = "Data missing";
    }
  }

  function allDated(){
    const rows = [];
    visibleItems(state.data.items).forEach(it => { if (it.date) rows.push(it); });
    visibleItems(state.data.pipeline).forEach(it => { if (it.date) rows.push(it); });
    return rows;
  }
  function itemsOn(dateStr){
    const posts = visibleItems(state.data.items).filter(it => it.date===dateStr);
    const pipes = visibleItems(state.data.pipeline).filter(it => it.date===dateStr);
    const sortKey = (it) => (it.time||"99:99") + (it.platform||"") + (it.title||"");
    posts.sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
    pipes.sort((a,b)=> (a.id||"").localeCompare(b.id||""));
    return {posts, pipes, all: posts.concat(pipes)};
  }
  function isGap(dateStr, bundle){
    // A gap is a day with nothing scheduled, drafted, posted, or reserved in the pipeline.
    return bundle.all.length===0;
  }

  function render(){
    const d = state.data;
    const counts = d.counts || {};
    const today = ymd(todayPKT());
    const monthName = MONTHS[state.cursor.getUTCMonth()] + " " + state.cursor.getUTCFullYear();
    const weekStart = startOfWeek(state.cursor);
    const weekEnd = addDays(weekStart, 6);
    const weekLabel = formatRange(weekStart, weekEnd);

    $("app").innerHTML = `
      <section class="hero">
        <span class="eyebrow">Smart Solutions · Sargodha</span>
        <h1>Content calendar</h1>
        <p class="lead">What is scheduled, what scripts are ready, and how posted work performed — across Facebook, Instagram and TikTok. All times are ${escapeHtml(d.meta.timezone_label||"PKT")}.</p>
        <ul class="stats">
          <li><b>${fmtNum(counts.scheduled||0)}</b><span>Scheduled in Buffer</span></li>
          <li><b>${fmtNum(counts.draft_waiting_slot||0)}</b><span>Drafts waiting for a slot</span></li>
          <li><b>${fmtNum(counts.pipeline||0)}</b><span>In the pipeline</span></li>
          <li><b>${fmtNum(counts.posted||0)}</b><span>Posted since 28 Oct</span></li>
        </ul>
        <div class="toolbar">
          <div class="seg" role="tablist" aria-label="Calendar view">
            <button type="button" data-view="month" aria-pressed="${state.view==="month"}">Month</button>
            <button type="button" data-view="week" aria-pressed="${state.view==="week"}">Week</button>
          </div>
          <button type="button" class="mbtn ${state.platforms.FB?"on":""}" data-p="FB" aria-pressed="${state.platforms.FB}"><i class="dot"></i> Facebook</button>
          <button type="button" class="mbtn ${state.platforms.IG?"on":""}" data-p="IG" aria-pressed="${state.platforms.IG}"><i class="dot"></i> Instagram</button>
          <button type="button" class="mbtn ${state.platforms.TikTok?"on":""}" data-p="TikTok" aria-pressed="${state.platforms.TikTok}"><i class="dot"></i> TikTok</button>
        </div>
        <div class="navrow">
          <button type="button" class="iconbtn" data-nav="-1" aria-label="Previous">‹</button>
          <button type="button" class="iconbtn" data-nav="1" aria-label="Next">›</button>
          <h2>${state.view==="month"?escapeHtml(monthName):escapeHtml(weekLabel)}</h2>
          <button type="button" class="mbtn" data-today="1">Today</button>
        </div>
        <div class="legend">
          <i><span class="pbadge FB">FB</span> Facebook</i>
          <i><span class="pbadge IG">IG</span> Instagram</i>
          <i><span class="pbadge TikTok">TikTok</span> TikTok</i>
          <i>${statusChip("scheduled")} ${statusChip("draft")} ${statusChip("posted")} ${statusChip("voice")} ${statusChip("script")}</i>
          <i class="chip gap">Gap — nothing scheduled</i>
        </div>
      </section>
      ${state.view==="month"? renderMonth(today) : renderWeek(today)}
      ${renderPipeline()}
      ${renderClientWork()}
      ${renderPerformance()}
      <footer>
        <p>Buffer is the source of truth. Metrics are the real values Buffer returned — zeros are included when Buffer sent them, and missing fields were not filled in. Facebook reach often came back as 0, so Facebook rankings use impressions.</p>
        <p>Export ${escapeHtml(d.meta.generated_at||"")} · Converted ${escapeHtml(d.meta.converted_at||"")} · ${escapeHtml(d.meta.timezone_label||"PKT")}</p>
      </footer>
    `;
    bind();
  }

  function formatRange(a,b){
    const sameMonth = a.getUTCMonth()===b.getUTCMonth();
    const left = MONTHS[a.getUTCMonth()].slice(0,3) + " " + a.getUTCDate();
    const right = (sameMonth?"":MONTHS[b.getUTCMonth()].slice(0,3)+" ") + b.getUTCDate() + ", " + b.getUTCFullYear();
    return left + " – " + right;
  }

  function evButton(it){
    const isPipe = it.kind==="pipeline";
    const cls = "ev" + (isPipe?" pipe":"") + (it.status==="draft"?" draft":"");
    const time = it.time ? `<span class="t">${escapeHtml(it.time)}</span>` : "";
    const label = isPipe ? it.id : it.title;
    const metaBits = [];
    if (it.status) metaBits.push(STATUS_LABEL[it.status]||it.status);
    if (isPipe && it.title) metaBits.push(it.title);
    if (isPipe && it.platforms && it.platforms.length) metaBits.push(it.platforms.join(" + "));
    const meta = metaBits.length ? `<span class="meta">${escapeHtml(metaBits.join(" · "))}</span>` : "";
    return `<button type="button" class="${cls}" data-id="${escapeHtml(it.id)}" data-p="${escapeHtml(it.platform||"")}" data-status="${escapeHtml(it.status||"")}" title="${escapeHtml(it.title)}">${time}<span class="n">${escapeHtml(label)}</span>${meta}</button>`;
  }

  function dayBundleMarkup(bundle, limit){
    const show = bundle.all.slice(0, limit);
    const rest = bundle.all.length - show.length;
    let html = `<div class="elist">${show.map(it => evButton(it)).join("")}`;
    if (rest>0) html += `<button type="button" class="more" data-day="${escapeHtml(bundle.date)}">+${rest} more</button>`;
    html += `</div>`;
    return html;
  }

  function renderMonth(todayStr){
    const first = startOfMonth(state.cursor);
    const gridStart = startOfWeek(first);
    const nextMonth = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth()+1, 1, 7, 0, 0));
    let cells = "";
    for (let i=0;i<42;i++){
      const d = addDays(gridStart, i);
      const ds = ymd(d);
      const inMonth = d.getUTCMonth()===first.getUTCMonth();
      const bundle = itemsOn(ds);
      bundle.date = ds;
      const gap = inMonth && isGap(ds, bundle);
      const cls = ["day", inMonth?"":"out", ds===todayStr?"today":"", gap?"gap":""].filter(Boolean).join(" ");
      const count = bundle.all.length;
      cells += `<div class="${cls}" data-day="${ds}">
        <div class="dayhead"><span class="num">${d.getUTCDate()}</span>${count?`<span class="ecount">${count}</span>`:(gap?`<span class="gaplab">Gap</span>`:"")}</div>
        ${dayBundleMarkup(bundle, 3)}
      </div>`;
      if (i>=34 && addDays(d,1)>=nextMonth && ((i+1)%7===0)) break;
    }
    return `<div class="cal" aria-label="Month view">
      <div class="dow">${WEEKDAYS.map(w=>`<span>${w}</span>`).join("")}</div>
      <div class="month">${cells}</div>
    </div>`;
  }

  function renderWeek(todayStr){
    const start = startOfWeek(state.cursor);
    let cells = "";
    for (let i=0;i<7;i++){
      const d = addDays(start, i);
      const ds = ymd(d);
      const bundle = itemsOn(ds);
      bundle.date = ds;
      const gap = isGap(ds, bundle);
      const cls = ["wday", ds===todayStr?"today":"", gap?"gap":""].filter(Boolean).join(" ");
      cells += `<div class="${cls}" data-day="${ds}">
        <div class="dayhead"><div><div class="wdname">${WEEKDAYS[i]}</div><span class="num">${d.getUTCDate()}</span></div>${bundle.all.length?`<span class="ecount">${bundle.all.length}</span>`:(gap?`<span class="gaplab">Gap</span>`:"")}</div>
        ${dayBundleMarkup(bundle, 99)}
      </div>`;
    }
    return `<div class="cal" aria-label="Week view">
      <div class="week">${cells}</div>
    </div>`;
  }

  function renderPipeline(){
    const planned = visibleItems(state.data.pipeline).filter(it => it.date && it.lane!=="client-work")
      .sort((a,b)=> (a.date+a.id).localeCompare(b.date+b.id));
    const unscheduled = visibleItems(state.data.pipeline).filter(it => it.unscheduled);
    const cards = planned.map(it => {
      const card = pipelineCard(it, prettyDate(it.date));
      // Dated Meta ads cards also keep the production note.
      if (!it.notes) return card;
      return card.replace("</h4>", "</h4><p>"+escapeHtml(it.notes)+"</p>");
    }).join("");
    return `<section class="section" id="pipeline">
      <div class="sec-head"><span class="sec-num">1</span><h3>Scripts ready / pipeline</h3></div>
      <p class="sec-body">Reserved days for work that is not in Buffer yet. The five Meta ads reels are planned one a day, 16–20 Nov, on Facebook, Instagram and TikTok — those dates stay reserved. Exact clock times are not booked. Case studies, the automation series and the course series have no post day yet.</p>
      <div class="lane days">${cards || `<p class="empty">No planned pipeline items for the selected platforms.</p>`}</div>
      ${unscheduled.length? renderUnscheduled(unscheduled): ""}
    </section>`;
  }

  function pipelineCard(it, whenLabel){
    const gist = it.caption_gist || "";
    const cta = it.keyword_cta ? `<span class="chip">${escapeHtml(it.keyword_cta)}</span>` : "";
    return `<button type="button" class="lcard" data-id="${escapeHtml(it.id)}">
        <div class="when"><span>${escapeHtml(whenLabel)}</span>${statusChip(it.status)}${cta}</div>
        <h4>${escapeHtml(it.id)} · ${escapeHtml(it.title)}</h4>
        ${gist? `<p>${escapeHtml(gist)}</p>`:""}
        <div class="plats">${badges(it.platforms)}</div>
      </button>`;
  }

  function renderUnscheduled(list, singleTitle){
    const groups = [
      {key:"case-study", title:"Case studies — no post day yet", note:"Voice was planned today after 1 PM PKT. These sit in the client-work lane until a week is assigned."},
      {key:"automation", title:"Automation — 01 / 03 / 05 / 07 / 09", note:"Each automation reel needs its own keyword DM on its go-live day. 01 WORKFLOWS, 03 WHATSAPP and 05 INBOX are voice-done, with HTML and render still pending. 07 CHATBOT and 09 CRM are being voiced today after 1 PM PKT. No post day yet — 16–20 Nov stay reserved for the Meta ads reels R1–R5."},
      {key:"course", title:"Course — 02 / 04 / 06 / 08 / 10 / 11", note:"Script stage only. No post day yet — 16–20 Nov stay reserved for the Meta ads reels R1–R5."}
    ];
    const known = new Set(groups.map(g => g.key));
    const used = groups.filter(g => list.some(it => (it.group||"")===g.key));
    const other = list.filter(it => !known.has(it.group||""));
    if (other.length) used.push({key:"other", title: singleTitle || "Unscheduled", note:"", items: other});
    if (!used.length) return "";
    if (singleTitle && used.length===1) used[0] = Object.assign({}, used[0], {title: singleTitle});
    return used.map(g => {
      const items = g.items || list.filter(it => (it.group||"")===g.key);
      items.sort((a,b)=> (a.n||0)-(b.n||0) || (a.id||"").localeCompare(b.id||""));
      const cards = items.map(it => pipelineCard(it, "No post day yet")).join("");
      return `<div class="bucket"><h4>${escapeHtml(g.title)}</h4>${g.note?`<p class="gnote">${escapeHtml(g.note)}</p>`:""}<div class="grid4">${cards}</div></div>`;
    }).join("");
  }

  function prettyDate(s){
    if (!s) return "Unscheduled";
    const d = fromYMD(s);
    return WEEKDAYS[(d.getUTCDay()+6)%7] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()].slice(0,3);
  }

  function renderClientWork(){
    const today = ymd(todayPKT());
    const cases = visibleItems(state.data.pipeline).filter(it => it.lane==="client-work");
    // Weekly planning rows from the first posted date through two weeks after the last planned pipeline day.
    const allDates = allDated().map(it => it.date).concat(cases.map(it => it.date).filter(Boolean));
    let start = fromYMD("2026-10-26"); // week of first possible Oct 28 window
    const lastPipe = (state.data.pipeline||[]).map(it => it.date).filter(Boolean).sort().slice(-1)[0];
    let end = fromYMD(lastPipe || "2026-11-22");
    end = addDays(startOfWeek(end), 20); // show a couple of open weeks after the Meta ads block
    const rows = [];
    for (let w = startOfWeek(start); w <= end; w = addDays(w, 7)){
      const a = ymd(w), b = ymd(addDays(w,6));
      const inWeek = (date) => date && date>=a && date<=b;
      const meta = visibleItems(state.data.pipeline).filter(it => it.lane!=="client-work" && inWeek(it.date));
      const cs = cases.filter(it => inWeek(it.date));
      const hasCal = visibleItems(state.data.items).some(it => inWeek(it.date) && (it.status==="scheduled"||it.status==="draft"||it.status==="posted"));
      let hint, tags;
      if (meta.length){
        hint = "Meta ads block: " + meta.map(it => it.id).join(", ") + ". Case studies are not assigned to this week yet.";
        tags = meta.map(it => `<button type="button" class="chip voice" data-id="${escapeHtml(it.id)}">${escapeHtml(it.id)}</button>`).join("");
      } else if (cs.length){
        hint = "Case-study reels planned this week.";
        tags = cs.map(it => `<button type="button" class="chip script" data-id="${escapeHtml(it.id)}">${escapeHtml(it.title)}</button>`).join("");
      } else if (hasCal){
        hint = "Feed and scheduled posts this week. No client-work case study is assigned yet.";
        tags = "";
      } else if (b < today){
        hint = "No client-work case study ran this week.";
        tags = "";
      } else {
        hint = "Open week — nothing reserved. A case-study reel could go here after the Meta ads block.";
        tags = `<span class="chip gap">Open</span>`;
      }
      rows.push(`<div class="wrow"><div class="label">${escapeHtml(formatRange(w, addDays(w,6)))}</div><div class="hint">${escapeHtml(hint)}</div>${tags?`<div class="items">${tags}</div>`:""}</div>`);
    }
    const backlog = cases.filter(it => !it.date);
    return `<section class="section" id="client-work">
      <div class="sec-head"><span class="sec-num">2</span><h3>Client-work content</h3></div>
      <p class="sec-body">A planning row for case studies and before/after work that sells the web, Shopify and ads services — separate from the daily feed calendar. The four case-study reels are at script stage and do not have a post day yet.</p>
      <div class="weeks-lane">${rows.join("")}</div>
      ${backlog.length? renderUnscheduled(backlog, "Backlog — not placed on a week yet"): ""}
    </section>`;
  }

  function primaryMetric(it){
    const m = it.metrics || {};
    if (it.platform==="FB" && hasMetric(m,"impressions")) return {key:"impressions", value:m.impressions};
    if (hasMetric(m,"views")) return {key:"views", value:m.views};
    if (hasMetric(m,"impressions")) return {key:"impressions", value:m.impressions};
    if (hasMetric(m,"reach")) return {key:"reach", value:m.reach};
    return null;
  }
  function sumMetric(list, key){
    let sum=0, seen=0;
    list.forEach(it => {
      const m = it.metrics||{};
      if (hasMetric(m,key) && typeof m[key]==="number"){ sum += m[key]; seen++; }
    });
    return seen? sum : null;
  }

  function renderPerformance(){
    const posted = visibleItems(state.data.items).filter(it => it.status==="posted");
    const platforms = ["FB","IG","TikTok"].filter(p => state.platforms[p]);
    const cards = platforms.map(p => {
      const list = posted.filter(it => it.platform===p);
      const ranked = list.map(it => ({it, pm: primaryMetric(it)})).filter(x => x.pm && typeof x.pm.value==="number");
      ranked.sort((a,b)=> b.pm.value - a.pm.value);
      const top = ranked.slice(0,3);
      const metricPrefs = p==="FB"
        ? ["impressions","reactions","shares","clicks","engagementRate"]
        : p==="IG"
          ? ["views","reach","reactions","saves","shares","engagementRate"]
          : ["views","reactions","comments","shares","engagementRate"];
      const totals = metricPrefs.map(k => {
        const v = (k==="engagementRate") ? null : sumMetric(list,k);
        if (v==null && k!=="engagementRate") return "";
        if (k==="engagementRate") return ""; // don't sum rates
        return `<li><b>${fmtNum(v)}</b>${METRIC_LABEL[k]}</li>`;
      }).join("");
      const rankNote = p==="FB"
        ? "Ranked by impressions. Buffer returned reach 0 (and no views field) on these Facebook posts."
        : "Ranked by views, using only posts that have a views value from Buffer.";
      const missing = list.filter(it => !primaryMetric(it)).length;
      const rows = top.length? `<ol class="rank">${top.map((x,i)=>`
        <li><button type="button" data-id="${escapeHtml(x.it.id)}">
          <span class="pos">${i+1}</span>
          <span><span class="ttl">${escapeHtml(x.it.title)}</span>
          <div class="sub">${escapeHtml(x.it.sent_at_pkt||x.it.datetime_pkt)} · ${METRIC_LABEL[x.pm.key]} ${fmtNum(x.pm.value)}</div></span>
        </button></li>`).join("")}</ol>` : `<p class="empty">No Buffer metrics to rank yet.</p>`;
      return `<article class="pcard">
        <h4><span class="pbadge ${p}">${p}</span> ${PLATFORM_NAME[p]} · ${list.length} posted</h4>
        <ul class="totals">${totals}</ul>
        ${rows}
        <p class="note">${rankNote}${missing? " "+missing+" post"+(missing===1?"":"s")+" had no rankable metric.":""}</p>
      </article>`;
    }).join("");
    return `<section class="section" id="performance">
      <div class="sec-head"><span class="sec-num">3</span><h3>Performance</h3></div>
      <p class="sec-body">Posted work since 28 Oct 2026, with real Buffer metrics only. Instagram “Instagram kaafi nahi” had no metric values at pull time, so it is listed in the calendar but not ranked.</p>
      <div class="perf">${cards}</div>
    </section>`;
  }

  function bind(){
    $("app").querySelectorAll("[data-view]").forEach(btn => btn.addEventListener("click", () => {
      state.view = btn.getAttribute("data-view");
      render();
    }));
    $("app").querySelectorAll(".mbtn[data-p]").forEach(btn => btn.addEventListener("click", () => {
      const p = btn.getAttribute("data-p");
      state.platforms[p] = !state.platforms[p];
      render();
    }));
    $("app").querySelectorAll("[data-nav]").forEach(btn => btn.addEventListener("click", () => {
      const dir = +btn.getAttribute("data-nav");
      if (state.view==="month"){
        state.cursor = new Date(Date.UTC(state.cursor.getUTCFullYear(), state.cursor.getUTCMonth()+dir, 1, 7, 0, 0));
      } else {
        state.cursor = addDays(state.cursor, dir*7);
      }
      render();
    }));
    $("app").querySelector("[data-today]")?.addEventListener("click", () => {
      state.cursor = todayPKT();
      render();
    });
    $("app").querySelectorAll("[data-id]").forEach(btn => btn.addEventListener("click", ev => {
      ev.stopPropagation();
      openModal(btn.getAttribute("data-id"));
    }));
    $("app").querySelectorAll("[data-day]").forEach(el => {
      if (el.classList.contains("more") || el.classList.contains("day") || el.classList.contains("wday")){
        // Day cells open a day list only when the click is on the cell chrome, not an event.
        el.addEventListener("click", ev => {
          if (ev.target.closest("[data-id]")) return;
          if (el.classList.contains("more") || ev.target===el || ev.target.closest(".dayhead") || ev.target.classList.contains("more")){
            openDay(el.getAttribute("data-day") || ev.currentTarget.getAttribute("data-day"));
          }
        });
      }
    });
  }

  function openDay(dateStr){
    const bundle = itemsOn(dateStr);
    if (!bundle.all.length){
      openMessage(prettyDate(dateStr), "Nothing is scheduled, reserved or posted on this day for the selected platforms.");
      return;
    }
    const list = bundle.all.map(it => `
      <button type="button" class="lcard" data-id="${escapeHtml(it.id)}" style="margin-top:8px">
        <div class="when">${escapeHtml(it.time||"")} ${it.platform?`<span class="pbadge ${escapeHtml(it.platform)}">${escapeHtml(it.platform)}</span>`:badges(it.platforms)} ${statusChip(it.status)}</div>
        <h4>${escapeHtml(it.title)}</h4>
      </button>`).join("");
    showModal(`<button type="button" class="close" data-close="1" aria-label="Close">×</button>
      <div class="eyebrow">${escapeHtml(prettyDate(dateStr))}</div>
      <h3 id="modal-title">${bundle.all.length} item${bundle.all.length===1?"":"s"}</h3>
      ${list}`);
    $("modal").querySelectorAll("[data-id]").forEach(btn => btn.addEventListener("click", () => openModal(btn.getAttribute("data-id"))));
  }

  function openMessage(title, body){
    showModal(`<button type="button" class="close" data-close="1" aria-label="Close">×</button>
      <h3 id="modal-title">${escapeHtml(title)}</h3>
      <p class="lead">${escapeHtml(body)}</p>`);
  }

  function openModal(id){
    const it = state.itemsById.get(id);
    if (!it) return;
    const plats = it.platforms && it.platforms.length ? it.platforms : (it.platform?[it.platform]:[]);
    const metrics = it.metrics && typeof it.metrics==="object" ? it.metrics : (it.metrics||null);
    const metricKeys = metrics ? Object.keys(metrics).filter(k => hasMetric(metrics,k)) : [];
    const metricHtml = metricKeys.length ? `<div class="metrics">${metricKeys.map(k => {
      const label = METRIC_LABEL[k]||k;
      const val = k==="engagementRate" && typeof metrics[k]==="number" ? fmtNum(metrics[k])+"%" : (k.endsWith("_pkt")? escapeHtml(metrics[k]) : fmtNum(metrics[k]));
      return `<div><b>${val}</b><span>${escapeHtml(label)}</span></div>`;
    }).join("")}</div>` : (it.status==="posted" ? `<p class="note">No metrics from Buffer at pull time.</p>` : "");
    const files = [];
    if (it.file_name) files.push(it.file_name);
    if (it.files) Object.entries(it.files).forEach(([k,v]) => { if (v && v!==it.file_name) files.push(k+": "+v); });
    const rows = [
      ["When", it.datetime_pkt || (it.date? it.date+" PKT" : "No post day yet")],
      it.sent_at_pkt ? ["Sent", it.sent_at_pkt] : null,
      it.scheduled_for_pkt ? ["Scheduled for", it.scheduled_for_pkt] : null,
      ["Status", STATUS_LABEL[it.status]||it.status],
      plats.length? ["Platform", plats.map(p => PLATFORM_NAME[p]||p).join(", ")] : null,
      it.keyword_cta? ["Keyword / CTA", it.keyword_cta] : null,
      it.buffer_post_id? ["Buffer ID", it.buffer_post_id] : null,
      it.media && it.media.drive_id? ["Drive file", it.media.drive_id] : null,
      files.length? ["File", files.join(" · ")] : null
    ].filter(Boolean);
    showModal(`<button type="button" class="close" data-close="1" aria-label="Close">×</button>
      <div class="row">${plats.map(p=>`<span class="pbadge ${escapeHtml(p)}">${escapeHtml(p)}</span>`).join("")}${statusChip(it.status)}</div>
      <h3 id="modal-title">${escapeHtml(it.title)}</h3>
      ${it.caption_gist? `<p class="lead">${escapeHtml(it.caption_gist)}</p>`:""}
      ${it.notes? `<p class="lead">${escapeHtml(it.notes)}</p>`:""}
      <dl class="kv">${rows.map(([k,v])=>`<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join("")}</dl>
      ${metricHtml}`);
  }

  function showModal(html){
    const modal = $("modal");
    const scrim = $("scrim");
    modal.innerHTML = html;
    modal.hidden = false;
    scrim.hidden = false;
    document.body.classList.add("modal-on");
    modal.querySelector("[data-close]")?.addEventListener("click", closeModal);
    scrim.onclick = closeModal;
  }
  function closeModal(){
    document.body.classList.remove("modal-on");
    $("modal").hidden = true;
    $("scrim").hidden = true;
    $("modal").innerHTML = "";
  }
  document.addEventListener("keydown", ev => { if (ev.key==="Escape") closeModal(); });

  boot();
})();
</script>
</body>
</html>
